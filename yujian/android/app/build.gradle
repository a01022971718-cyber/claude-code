plugins { id 'com.android.application' }

android {
  namespace 'com.yujian.island'
  compileSdk 35
  defaultConfig {
    applicationId 'com.yujian.island'
    minSdk 24          // Android 7.0 起（WebView 可单独更新，支持 WebGL2）
    targetSdk 35
    versionCode 20
    versionName '0.20'
  }
  // 测试用签名：密钥在 keystore/ 里，方便每次打的包都能覆盖安装。正式上架要换成自己的签名，且不要提交进仓库
  signingConfigs {
    dev { storeFile file('../keystore/yujian-dev.jks'); storePassword 'android'; keyAlias 'yujian'; keyPassword 'android' }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.dev }
    debug { signingConfig signingConfigs.dev }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }

// 打包前把最新的网页版游戏复制进 assets
tasks.register('copyWeb', Copy) {
  from('../../dist/index.html')
  into('src/main/assets')
}
preBuild.dependsOn copyWeb
