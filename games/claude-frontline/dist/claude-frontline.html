<script>
/* js/brand.js */
/* X-S 品牌：标志与字标
 * 寓意：X = 未知（方程里的未知数）与新星（四芒星转 45° 即为 X）；
 *       S = 向上的 S 曲线（Sigmoid 学习曲线 / 火箭爬升轨迹）；
 *       色彩 = 紫夜（未知）→ 破晓橙金（新生）+ 探索青（探索）。规则见 art/01-typography-constitution.md */
(function () {
  const CF = window.CF;
  let uid = 0;
  function emblem() {
    const id = 'xs' + uid++;
    return `<svg class="wm-mark" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="${id}d" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a45"/><stop offset=".6" stop-color="#ffb14a"/><stop offset="1" stop-color="#ffe08a"/></linearGradient>
        <linearGradient id="${id}t" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4ef0ff" stop-opacity="0"/><stop offset=".55" stop-color="#4ef0ff" stop-opacity=".9"/><stop offset="1" stop-color="#e6fdff"/></linearGradient>
      </defs>
      <path d="M5 43 C 19 43, 13 27, 24 24 S 30 7, 43 5" fill="none" stroke="url(#${id}t)" stroke-width="3.2" stroke-linecap="round"/>
      <g class="star"><path d="M24 7 Q26.2 21.8 41 24 Q26.2 26.2 24 41 Q21.8 26.2 7 24 Q21.8 21.8 24 7 Z" transform="rotate(45 24 24)" fill="url(#${id}d)"/>
      <circle cx="24" cy="24" r="3" fill="#fff6e0"/></g>
      <circle cx="43" cy="5" r="2.6" fill="#e6fdff"/>
    </svg>`;
  }
  // 字标：标志 + 拉丁品牌字（破晓渐变）+ 中文（米白），规则「双色、粗重、标志先行」
  function wordmark(cjk = '造月之路', opts = {}) {
    return `<span class="wm ${opts.shadow === false ? '' : 'wm-shadow'}">${emblem()}<span class="wm-latin">X-S</span>${cjk ? `<span class="wm-cjk">${cjk}</span>` : ''}</span>`;
  }
  // 逐字上升动画（「向上」）
  function rise(text, step = 40) {
    return `<span class="t-rise">${[...text].map((ch, i) => `<span style="animation-delay:${i * step}ms">${ch === ' ' ? '&nbsp;' : CF.esc(ch)}</span>`).join('')}</span>`;
  }
  /* 主标题《造月之路》（字体宪法第 13 章 v1.3）：采用主创提供的设计稿——左边是图标，右边是标题字。
   * 图标 = 音符（符头 + 符杆 + 旗）× 月牙 × 代码括号 < > × 一条 S 形的路：「造月之路」。
   * 颜色随主英雄切换（《游戏界面视觉宪法》第 2 章）：图标渐变 = 英雄点缀色 → 主光色（--logo-a → --logo-b），
   * 文字始终米白；挤出厚度用英雄背景色；辉光、火花、图标律动跟着节拍 --beat。 */
  function keyLogo(opts = {}) {
    const L = CF.LOGO;
    if (!L) return wordmark();
    const id = 'kl' + uid++, I = L.icon, T = L.text;
    const st = 1000 / (T.b[3] - T.b[1]), si = 1550 / (I.b[3] - I.b[1]);
    const iw = (I.b[2] - I.b[0]) * si, gap = 170, tx = iw + gap, ty = 815 - 500, W = tx + (T.b[2] - T.b[0]) * st, H = 1550;
    // 路径只写一次（defs），其余用 <use> 引用，避免 SVG 体积膨胀
    const icon = (fill, dy = 0) => `<use href="#${id}I" fill="${fill}" transform="translate(${(-I.b[0] * si).toFixed(1)} ${(-I.b[1] * si + dy).toFixed(1)}) scale(${si.toFixed(4)})"/>`;
    const text = (fill, dy = 0) => `<use href="#${id}T" fill="${fill}" transform="translate(${(tx - T.b[0] * st).toFixed(1)} ${(ty - T.b[1] * st + dy).toFixed(1)}) scale(${st.toFixed(4)})"/>`;
    const D = 11, ext = [];
    ['var(--hero-bg2,#4a2fa0)', 'var(--hero-bg1,#33207a)', 'var(--hero-bg1,#33207a)', 'var(--hero-bg0,#22144c)', 'var(--hero-bg0,#22144c)'].forEach((c, k) => ext.unshift(icon(c, (k + 1) * D) + text(c, (k + 1) * D)));
    const sparks = [[iw * 0.92, -40, 46, 'a', 0], [iw * 0.2, 120, 34, 'b', 1.3], [tx + 900, 40, 30, 'a', 2.1], [tx + 2400, 10, 38, 'b', 0.7], [W - 200, 160, 30, 'a', 1.8], [tx + 3600, 1380, 26, 'b', 2.6]].map(([x, y, z, c, dl]) => `<rect class="kl-px" x="${x.toFixed(0)}" y="${y}" width="${z}" height="${z}" fill="var(--logo-${c},#d4ff1e)" style="animation-delay:${dl}s"/>`).join('');
    const vb = `-120 -120 ${(W + 240).toFixed(0)} ${H + 300}`;
    return `<svg class="kl" viewBox="${vb}" role="img" aria-label="造月之路">
      <defs>
        <path id="${id}I" d="${I.d}" fill-rule="evenodd"/><path id="${id}T" d="${T.d}" fill-rule="evenodd"/>
        <linearGradient id="${id}i" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${H}"><stop offset=".08" style="stop-color:var(--logo-a,#d4ff1e)"/><stop offset=".88" style="stop-color:var(--logo-b,#00f0ff)"/></linearGradient>
        <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <radialGradient id="${id}g" cx=".5" cy=".5" r=".5"><stop offset="0" style="stop-color:var(--logo-b,#00f0ff)" stop-opacity=".42"/><stop offset="1" style="stop-color:var(--logo-b,#00f0ff)" stop-opacity="0"/></radialGradient>
        <clipPath id="${id}c">${icon('#fff')}</clipPath>
      </defs>
      <ellipse class="kl-glow" cx="${(iw / 2).toFixed(0)}" cy="${H / 2}" rx="${(iw * 1.1).toFixed(0)}" ry="${H * 0.75}" fill="url(#${id}g)"/>
      ${sparks}
      ${ext.join('')}
      <g class="kl-spin">${icon(`url(#${id}i)`)}</g>
      <g clip-path="url(#${id}c)"><rect class="kl-sheen" x="0" y="0" width="${iw.toFixed(0)}" height="260" fill="url(#${id}s)"/></g>
      ${text('#f4f1ea')}
    </svg>`;
  }
  // 单独的游戏图标（安装包图标、加载页）：同一套路径，渐变默认用品牌色（造乐的青柠 → 青）
  function icon(cls) { const I = CF.LOGO.icon, id = 'gi' + uid++; return `<svg class="${cls || 'gicon'}" viewBox="${I.b[0] - 20} ${I.b[1] - 20} ${I.b[2] - I.b[0] + 40} ${I.b[3] - I.b[1] + 40}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset=".08" style="stop-color:var(--logo-a,#d4ff1e)"/><stop offset=".88" style="stop-color:var(--logo-b,#00f0ff)"/></linearGradient></defs><path d="${I.d}" fill-rule="evenodd" fill="url(#${id})"/></svg>`; }
  CF.Brand = { emblem, wordmark, rise, keyLogo, icon };
})();

</script>

<script>
/* js/progress.js */
/* 成长系统：经验、3:7 配比引擎、军衔、解锁、每日修炼、成就、战斗加成 */
(function () {
  const CF = window.CF;
  const S = () => CF.Save.data;

  const RANKS = [
    [0, '新兵'], [100, '学徒'], [300, '见习工程师'], [700, '工程师'], [1300, '高级工程师'],
    [2200, '研究员'], [3500, '首席科学家'], [5200, '创始人'], [7500, '连续创业者'], [10000, '造物者'],
  ];
  const LABS = ['gd', 'perceptron', 'pid', 'robot', 'rocket', 'startup', 'code', 'pixel'];
  const TARGET_K = 0.3;

  const P = (CF.P = { RANKS, LABS, TARGET_K });

  P.totalXP = () => S().xp.knowledge + S().xp.practice;
  P.ratio = () => {
    const k = S().xp.knowledge, p = S().xp.practice, t = k + p;
    return { k, p, t, kPct: t ? k / t : 0, pPct: t ? p / t : 0 };
  };
  P.suggestion = () => {
    const r = P.ratio();
    if (r.t < 40) return { type: 'any', text: '刚起步：先做「今日修炼」，知识和实操都来一点。' };
    if (r.kPct > TARGET_K + 0.05) return { type: 'p', text: `知识占比 ${Math.round(r.kPct * 100)}%，偏高。下一项建议做实操：实验室或线下任务。` };
    if (r.kPct < TARGET_K - 0.08) return { type: 'k', text: `知识占比 ${Math.round(r.kPct * 100)}%，偏低。做几道知识题，给实践补上理论。` };
    return { type: 'ok', text: `配比 ${Math.round(r.kPct * 100)} : ${Math.round(r.pPct * 100)}，接近 3:7 的目标，保持节奏。` };
  };
  P.rank = () => {
    const xp = P.totalXP();
    let i = 0;
    while (i + 1 < RANKS.length && xp >= RANKS[i + 1][0]) i++;
    const cur = RANKS[i], next = RANKS[i + 1];
    return { idx: i, name: cur[1], xp, next: next ? next[0] : null, nextName: next ? next[1] : null, prog: next ? (xp - cur[0]) / (next[0] - cur[0]) : 1 };
  };

  // 发放经验。type: 'k' 知识 / 'p' 实操
  P.addXP = function ({ type, amt, dims = {}, domain = null, founder = null, label = '' }) {
    const d = S();
    const before = P.rank().idx;
    amt = Math.round(amt);
    if (type === 'k') d.xp.knowledge += amt; else d.xp.practice += amt;
    for (const k in dims) d.dims[k] = (d.dims[k] || 0) + amt * dims[k] * 0.5;
    if (domain && d.domains[domain] !== undefined) d.domains[domain] += amt;
    if (founder) for (const k in founder) d.founder[k] = (d.founder[k] || 0) + founder[k];
    P.touchStreak();
    CF.Save.save();
    CF.toast(`+${amt} ${type === 'k' ? '知识' : '实操'}经验${label ? ' · ' + label : ''}`, type === 'k' ? '' : 'gold', 1600);
    const after = P.rank();
    if (after.idx > before) { CF.Audio.sfx('levelup'); setTimeout(() => CF.toast(`军衔晋升：${after.name}`, 'gold', 3000), 400); }
    P.checkAch();
    CF.bus.emit('progress');
  };

  P.touchStreak = function () {
    const st = S().streak, today = CF.today();
    if (st.last === today) return;
    st.count = st.last && CF.dayDiff(st.last, today) === 1 ? st.count + 1 : 1;
    st.last = today; st.best = Math.max(st.best || 0, st.count);
  };

  // ---------- 实验 / 任务状态 ----------
  P.labDone = (id) => !!(S().labs[id] && S().labs[id].done);
  P.labStars = (id) => (S().labs[id] ? S().labs[id].stars || 0 : 0);
  P.labsDoneCount = () => LABS.filter(P.labDone).length;
  P.codeDone = () => Object.keys(S().code).filter((k) => S().code[k]).length;
  P.questCount = (dom) => S().quests.log.filter((l) => !dom || l.d === dom).length;
  P.scenarioCount = () => Object.keys(S().scenarios).length;
  P.trial = () => !!S().settings.trial;

  P.finishLab = function (id, stars, info = {}) {
    const d = S(), rec = d.labs[id] || { done: false, stars: 0, count: 0 };
    const first = !rec.done;
    const gain = first ? 40 + stars * 10 : Math.max(0, stars - rec.stars) * 10 + 8;
    rec.done = true; rec.count = (rec.count || 0) + 1; rec.stars = Math.max(rec.stars || 0, stars);
    d.labs[id] = rec;
    const meta = (CF.Labs && CF.Labs.META[id]) || {};
    P.addXP({ type: 'p', amt: gain, dims: Object.assign({ shi: 1, zhi: 0.4 }, meta.dims || {}), domain: meta.d, label: meta.name });
    P.markDaily('lab', id);
    if (first) { CF.Audio.sfx('unlock'); P.announceUnlocks(); }
  };
  P.finishCode = function (id) {
    const d = S();
    if (d.code[id]) { CF.toast('已完成过，复习也很好'); return; }
    d.code[id] = CF.today();
    const c = CF.Content.CODE.find((x) => x.id === id);
    P.addXP({ type: 'p', amt: 35, dims: { shi: 1, zhi: 0.5 }, domain: c ? c.d : 'ai', label: '代码挑战' });
    if (!P.labDone('code') && P.codeDone() >= 3) P.finishLab('code', 3);
    P.markDaily('lab', 'code');
    P.announceUnlocks();
  };
  P.finishQuest = function (q, note) {
    const d = S();
    d.quests.log.unshift({ id: q.id, d: q.d, t: q.t, note: note.slice(0, 600), date: CF.today() });
    const dom = ['ai', 'emb', 'aero', 'biz'].includes(q.d) ? q.d : null;
    P.addXP({ type: 'p', amt: q.xp, dims: q.dims, domain: dom, label: '线下实操' });
    P.markDaily('quest', q.id);
    P.announceUnlocks();
  };
  P.answerQuiz = function (q, correct) {
    const d = S();
    const rec = d.quiz.seen[q.id] || { c: 0, w: 0 };
    if (correct) { rec.c++; d.quiz.correct++; } else { rec.w++; d.quiz.wrong++; }
    rec.last = Date.now();
    d.quiz.seen[q.id] = rec;
    const dims = { zhi: 1 };
    if (q.d === 'biz') dims.qi = 0.6;
    if (q.d === 'whole') { dims.de = 0.4; dims.mei = 0.3; }
    P.addXP({ type: 'k', amt: correct ? 10 : 3, dims, domain: q.d === 'whole' ? null : q.d, label: correct ? '答对' : '答错也有收获' });
  };
  P.decideScenario = function (sc, idx) {
    const d = S(), first = d.scenarios[sc.id] === undefined;
    d.scenarios[sc.id] = idx;
    const op = sc.opts[idx];
    if (!first) { CF.Save.save(); return; }
    const dims = { qi: 1, zhi: 0.3 };
    if (op.de || sc.opts.some((o) => o.de)) dims.de = (op.de || 0) * 0.4 + 0.2;
    if (op.ti) dims.ti = op.ti * 0.4;
    P.addXP({ type: 'p', amt: op.best ? 30 : 20, dims, domain: 'biz', founder: op.f, label: '情景决策' });
    P.markDaily('scenario', sc.id);
    P.announceUnlocks();
  };

  // ---------- 每日修炼 ----------
  P.dailyPlan = function () {
    const d = S(), today = CF.today();
    if (d.daily.date === today && d.daily.items.length) return d.daily;
    const rnd = CF.rng(CF.hashStr(today));
    const pickR = (arr) => arr[Math.floor(rnd() * arr.length)];
    const undone = LABS.filter((l) => !P.labDone(l));
    const lab = undone.length ? undone[0] : pickR(LABS);
    const doms = ['ai', 'emb', 'aero', 'biz'];
    const dom = doms[Math.floor(rnd() * 4)];
    const qMain = pickR(CF.Content.QUESTS.filter((q) => q.d === dom));
    const qBody = pickR(CF.Content.QUESTS.filter((q) => q.d === 'ti'));
    const qSoul = pickR(CF.Content.QUESTS.filter((q) => q.d === (rnd() < 0.5 ? 'de' : 'mei')));
    const scs = CF.Content.SCENARIOS.filter((s) => d.scenarios[s.id] === undefined);
    const items = [
      { kind: 'quiz', id: 'daily', n: 3, label: '知识小测 3 题', type: 'k' },
      { kind: 'lab', id: lab, label: '实验室', type: 'p' },
      { kind: 'quest', id: qMain.id, label: '线下实操', type: 'p' },
      { kind: 'quest', id: qBody.id, label: '体', type: 'p' },
      { kind: 'quest', id: qSoul.id, label: qSoul.d === 'de' ? '德' : '美', type: 'p' },
    ];
    if (scs.length) items.push({ kind: 'scenario', id: pickR(scs).id, label: '企业家修炼', type: 'p' });
    d.daily = { date: today, items, done: [], bonus: false };
    CF.Save.save();
    return d.daily;
  };
  P.markDaily = function (kind, id) {
    const dl = S().daily;
    if (dl.date !== CF.today()) return;
    const it = dl.items.find((x) => x.kind === kind && (x.id === id || kind === 'quiz'));
    if (it && !dl.done.includes(it.kind + ':' + it.id)) {
      dl.done.push(it.kind + ':' + it.id);
      if (dl.done.length >= dl.items.length && !dl.bonus) {
        dl.bonus = true;
        CF.Save.save();
        setTimeout(() => { CF.toast('今日修炼全部完成！下一场战斗起始算力 +50', 'gold', 3200); CF.Audio.sfx('levelup'); }, 600);
      }
      CF.Save.save();
    }
  };

  // ---------- 解锁 ----------
  const LEVEL_REQ = {
    L1: [],
    L2: [['win', 'L1', '通关「第一行代码」'], ['anylab', ['gd', 'perceptron'], '完成「梯度下降」或「感知机」实验'], ['code', 1, '完成 1 个代码挑战（解锁 Agent 工坊）']],
    L3: [['win', 'L2', '通关「守住上下文」'], ['lab', 'robot', '完成「机器人编程」实验']],
    L4: [['win', 'L3', '通关「原型机护送」'], ['lab', 'pid', '完成「PID 无人机」实验（解锁无人机空港）'], ['lab', 'rocket', '完成「火箭方程」实验']],
    L5: [['win', 'L4', '通关「制空权」'], ['lab', 'startup', '完成「创业沙盘」实验'], ['scen', 3, '完成 3 个企业家情景决策']],
  };
  function reqOk(r) {
    const d = S();
    switch (r[0]) {
      case 'win': return !!(d.campaign[r[1]] && d.campaign[r[1]].won);
      case 'lab': return P.labDone(r[1]);
      case 'anylab': return r[1].some(P.labDone);
      case 'code': return P.codeDone() >= r[1];
      case 'scen': return P.scenarioCount() >= r[1];
      case 'quest': return P.questCount(r[1]) >= (r[2] || 1);
    }
    return false;
  }
  P.levelReqs = (id) => (LEVEL_REQ[id] || []).map((r) => ({ ok: reqOk(r), text: r[2] }));
  P.levelUnlocked = (id) => P.trial() || P.levelReqs(id).every((r) => r.ok);

  const BUILD_REQ = {
    repair: [['quest', 'ti', 1, '完成 1 个「体」线下任务（体能 = 修复力）']],
    radar: [['lab', 'perceptron', 0, '完成「感知机」实验（感知 = 雷达）']],
    workshop: [['code', 1, 0, '完成 1 个代码挑战']],
    port: [['lab', 'pid', 0, '完成「PID 无人机」实验']],
  };
  P.buildUnlocked = function (type) {
    if (P.trial()) return { ok: true };
    const reqs = BUILD_REQ[type];
    if (!reqs) return { ok: true };
    for (const r of reqs) {
      const ok = r[0] === 'quest' ? P.questCount(r[1]) >= r[2] : r[0] === 'lab' ? P.labDone(r[1]) : P.codeDone() >= r[1];
      if (!ok) return { ok: false, why: r[3] };
    }
    return { ok: true };
  };
  P._unlockSnapshot = null;
  P.unlockSnapshot = () => ['repair', 'radar', 'workshop', 'port'].filter((t) => P.buildUnlocked(t).ok).concat(['L2', 'L3', 'L4', 'L5'].filter(P.levelUnlocked));
  P.announceUnlocks = function () {
    const now = P.unlockSnapshot();
    const prev = P._unlockSnapshot || [];
    if (P.trial()) { P._unlockSnapshot = now; return; }
    const names = { repair: '修复站', radar: '雷达站', workshop: 'Agent 工坊', port: '无人机空港', L2: '第 2 关', L3: '第 3 关', L4: '第 4 关', L5: '第 5 关' };
    now.filter((x) => !prev.includes(x)).forEach((x, i) => setTimeout(() => { CF.toast('🔓 解锁：' + names[x], 'gold', 3000); CF.Audio.sfx('unlock'); }, 900 + i * 700));
    P._unlockSnapshot = now;
  };

  // ---------- 战斗加成：学习 → 战力 ----------
  P.battleBonus = function () {
    const d = S(), r = P.ratio();
    const dailyBonus = d.daily.date === CF.today() && d.daily.bonus ? 50 : 0;
    const cb = CF.City ? CF.City.bonus() : { atkMul: 1, bldMul: 1, heroMul: 1, extraCoders: 0, startChip: 0 };
    return {
      atkMul: cb.atkMul, bldMul: cb.bldMul, cityHero: cb.heroMul, extraCoders: cb.extraCoders, startChip: cb.startChip,
      chips: Math.min(200, Math.floor(r.k / 5)),
      corp: Math.min(150, Math.floor(r.p / 10)),
      comp: dailyBonus,
      compRate: 0.15 * P.labsDoneCount() + 0.05 * P.codeDone(),
      riffMul: 1 + Math.min(0.6, P.questCount() * 0.03),
      heroHp: 1 + Math.min(0.5, (d.dims.ti || 0) / 200),
      lines: [
        `知识经验 → 起始晶片 +${Math.min(200, Math.floor(r.k / 5))}`,
        `实操经验 → 起始语料 +${Math.min(150, Math.floor(r.p / 10))}`,
        `完成 ${P.labsDoneCount()} 个实验、${P.codeDone()} 个代码挑战 → 算力产出 +${(0.15 * P.labsDoneCount() + 0.05 * P.codeDone()).toFixed(2)}/s`,
        `线下任务 ${P.questCount()} 个 → 英雄技能伤害 +${Math.round(Math.min(0.6, P.questCount() * 0.03) * 100)}%`,
        `「体」${Math.round(d.dims.ti || 0)} 点 → 英雄耐久 +${Math.round(Math.min(0.5, (d.dims.ti || 0) / 200) * 100)}%`,
      ].concat(dailyBonus ? ['今日修炼全部完成 → 起始算力 +50'] : []).concat(CF.City ? [`电路工坊完成 ${cb.solved || 0} 个实验 → 伤害与建筑耐久 +${Math.round((cb.atkMul - 1) * 100)}% · 英雄耐久 +${Math.round((cb.heroMul - 1) * 100)}% · 起始晶片 +${cb.startChip}${cb.extraCoders ? ' · 开局 1 个编码 Agent' : ''}`] : []),
    };
  };

  // ---------- 成就 ----------
  const ACH = [
    ['first_win', '🧑‍💻', '第一行代码', '通关第 1 关', () => !!(S().campaign.L1 && S().campaign.L1.won)],
    ['all_campaign', '🏁', '终局胜者', '通关全部 5 关战役', () => ['L1', 'L2', 'L3', 'L4', 'L5'].every((l) => S().campaign[l] && S().campaign[l].won)],
    ['three_star', '⭐', '三星指挥官', '任意关卡获得三星', () => Object.values(S().campaign).some((c) => c.stars >= 3)],
    ['all_three', '🌟', '完美战役', '全部 5 关三星', () => ['L1', 'L2', 'L3', 'L4', 'L5'].every((l) => S().campaign[l] && S().campaign[l].stars >= 3)],
    ['air', '🛩️', '制空权', '通关第 4 关「制空权」', () => !!(S().campaign.L4 && S().campaign.L4.won)],
    ['riff20', '🎸', '弦振大师', '累计释放 20 次英雄技能', () => S().stats.riffs >= 20],
    ['kills500', '🧹', '清理乱码', '累计消灭 500 个乱码单位', () => S().stats.kills >= 500],
    ['hard', '🔥', '硬核指挥官', '赢得一场困难遭遇战', () => S().skirmish.hard > 0],
    ['quiz50', '📚', '知识猎手', '累计答对 50 题', () => S().quiz.correct >= 50],
    ['lab3', '🔧', '动手派', '完成 3 个实验', () => P.labsDoneCount() >= 3],
    ['lab_all', '🧪', '全能实验员', '完成全部 8 个实验', () => P.labsDoneCount() >= 8],
    ['code5', '⌨️', '会写代码的指挥官', '完成 5 个代码挑战', () => P.codeDone() >= 5],
    ['quest10', '🤝', '知行合一', '完成 10 个线下实操任务', () => P.questCount() >= 10],
    ['ratio', '⚖️', '黄金配比', '总经验 ≥ 300 且实操占比在 65%–75%', () => { const r = P.ratio(); return r.t >= 300 && r.pPct >= 0.65 && r.pPct <= 0.75; }],
    ['streak7', '📅', '七日不辍', '连续 7 天有学习记录', () => S().streak.count >= 7],
    ['whole', '🌱', '德智体美', '德、智、体、美四维都达到 30', () => ['de', 'zhi', 'ti', 'mei'].every((k) => S().dims[k] >= 30)],
    ['founder5', '💡', '第一性原理', '完成 5 个企业家情景决策', () => P.scenarioCount() >= 5],
    ['pixel', '🎨', '像素艺术家', '保存自己的像素头像', () => !!S().avatar],
    ['rank6', '🔬', '首席科学家', '军衔达到「首席科学家」', () => P.rank().idx >= 6],
  ].map((a) => ({ id: a[0], icon: a[1], name: a[2], desc: a[3], test: a[4] }));
  P.ACH = ACH;
  P.checkAch = function () {
    const d = S();
    ACH.forEach((a) => {
      if (d.achievements[a.id]) return;
      let ok = false; try { ok = a.test(); } catch (e) {}
      if (ok) { d.achievements[a.id] = CF.today(); CF.Save.save(); setTimeout(() => { CF.toast(`${a.icon} 成就解锁：${a.name}`, 'gold', 3200); CF.Audio.sfx('unlock'); }, 300); }
    });
  };
})();

<script>
/* js/stamina.js */
/* 体力系统（v1）
 * - 战斗类玩法消耗体力，学习类内容（学院、实验室、电路工坊）不消耗。
 * - 体力上限 120，每 6 分钟自然恢复 1 点。
 * - 学习换「无限体力」（按主创规则）：
 *   ① 一次连续学习满 25 分钟（期间没有离开学习模式）→ 存入 5 分钟无限体力；每再满 25 分钟再存 5 分钟；
 *   ② 没能连续满 25 分钟的零散学习时间（包括连续学习超出 25 分钟整数倍的部分）全部累计，满 40 分钟 → 存入 10 分钟。
 *   存下的无限体力由玩家自己点「启用」开始计时，避免在不玩的时候白白流失。
 * - 连续 5 分钟没有任何操作时暂停计时（防挂机），回来继续计，不算离开学习模式。 */
(function () {
  const CF = window.CF;
  const MAX = 120, REGEN = 6 * 60 * 1000, SESSION = 25 * 60, POOL = 40 * 60, IDLE = 5 * 60 * 1000;
  const COST = { minor: 6, story: 10, dungeon: 15, immersive: 15, skirmish: 8, quick: 4, raid: 6, other: 6 };
  const LEARN = ['academy', 'labs', 'city'];
  const d = () => { const s = CF.Save.data; if (!s.stamina) s.stamina = { cur: MAX, last: Date.now(), bank: 0, until: 0, sess: 0, pool: 0, total: 0 }; return s.stamina; };
  const trial = () => CF.P && CF.P.trial && CF.P.trial();
  let lastInput = Date.now(), inLearn = false;
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((ev) => window.addEventListener(ev, () => (lastInput = Date.now()), { passive: true, capture: true }));

  const St = (CF.Stamina = {
    MAX, COST,
    regen() { const s = d(), now = Date.now(); if (s.cur >= MAX) { s.last = now; return; } const n = Math.floor((now - s.last) / REGEN); if (n > 0) { s.cur = Math.min(MAX, s.cur + n); s.last += n * REGEN; } },
    cur() { St.regen(); return d().cur; },
    add(n) { const s = d(); St.regen(); s.cur += n; CF.Save.save(); St.paint(); },
    unlimited: () => Date.now() < d().until,
    leftMs: () => Math.max(0, d().until - Date.now()),
    bank: () => d().bank,
    costOf(L) { if (!L) return COST.other; if (L.quick) return COST.quick; if (L.raid) return COST.raid; if (L.dungeon) return COST.dungeon; if (L.immersive) return COST.immersive; if (L.skirmish) return COST.skirmish; if (L.story) return COST.story; if (L.minor) return COST.minor; return COST.other; },
    // 开战前扣体力；不够时弹出说明（去学习换无限体力 / 商城体力药剂）
    spend(L) {
      if (trial() || St.unlimited()) return true;
      const c = St.costOf(L), s = d(); St.regen();
      if (s.cur >= c) { s.cur -= c; if (s.cur < MAX && s.last > Date.now()) s.last = Date.now(); CF.Save.save(); St.paint(); return true; }
      CF.Audio.sfx('error');
      CF.modal.open({ title: '体力不足', body: `<p style="line-height:1.8">这一局需要 <b>${c}</b> 点体力，你现在有 <b>${s.cur}</b> 点（每 6 分钟恢复 1 点）。</p>${St.explain()}`, foot: [{ text: '稍后', cls: 'ghost' }].concat(s.bank > 0 ? [{ text: `启用 ${s.bank} 分钟无限体力`, cls: 'primary', onClick: () => { St.activate(); CF.modal.close(); } }] : [{ text: '去学院学习', cls: 'primary', onClick: () => { CF.modal.close(); CF.UI.show('academy'); } }]) });
      return false;
    },
    activate() { const s = d(); if (s.bank <= 0) return; s.until = Math.max(Date.now(), s.until) + s.bank * 60000; CF.toast(`无限体力已启用：${s.bank} 分钟`, 'gold', 3000); s.bank = 0; CF.Save.save(); St.paint(); },
    explain: () => `<div class="explain">学习类内容（学院、实验室、电路工坊）<b>不消耗体力</b>。<br>· 一次连续学习满 <b>25 分钟</b>（中途不离开学习页面）→ 得 <b>5 分钟</b>无限体力；<br>· 零散学习累计满 <b>40 分钟</b>（例如今天 10 分钟、明天 10 分钟）→ 得 <b>10 分钟</b>无限体力。<br>无限体力会先存起来，你想玩的时候再点「启用」。</div>`,
    // 每秒调用：统计学习时间
    tick(dt) {
      const s = d(), cur = CF.UI && CF.UI.cur, learning = LEARN.includes(cur) && !document.hidden;
      if (!learning) { if (inLearn) St.endSession(); inLearn = false; return; }
      inLearn = true;
      if (Date.now() - lastInput > IDLE) return; // 挂机不计时
      s.sess += dt; s.total += dt;
      if (s.sess >= SESSION) { s.sess -= SESSION; s.bank += 5; CF.Audio.sfx('unlock'); CF.toast('连续学习 25 分钟！获得 5 分钟无限体力（已存入，随时启用）', 'gold', 4000); }
      CF.Save.save();
    },
    endSession() { const s = d(); if (s.sess > 0) { s.pool += s.sess; s.sess = 0; } while (s.pool >= POOL) { s.pool -= POOL; s.bank += 10; CF.toast('零散学习累计 40 分钟！获得 10 分钟无限体力（已存入）', 'gold', 4000); } CF.Save.save(); },
    learnInfo() { const s = d(); return { sess: s.sess, pool: s.pool, bank: s.bank, total: s.total }; },
    // 大厅右上角的体力胶囊 + 学习页的计时条
    paint() {
      const el = CF.$('#lobbyStamina'); if (el) el.innerHTML = St.unlimited() ? `⚡ <b class="t-num">∞</b><span class="small">${CF.fmtTime(St.leftMs() / 1000)}</span>` : `⚡ <b class="t-num">${St.cur()}</b><span class="small">/${MAX}</span>${d().bank ? `<i class="bank">+${d().bank}′</i>` : ''}`;
      const lt = CF.$('#learnTimer'); if (lt) { const s = d(), show = LEARN.includes(CF.UI && CF.UI.cur); lt.classList.toggle('hidden', !show); lt.classList.toggle('top', CF.UI.cur === 'city'); if (show) lt.innerHTML = `<span>学习计时</span><b class="t-num">${CF.fmtTime(s.sess)}</b><span class="small">/ 25:00</span><i style="--p:${(s.sess / SESSION) * 100}%"></i><span class="small">零散累计 ${Math.floor(s.pool / 60)}/40 分</span>${s.bank ? `<span class="small c-chip">已存 ${s.bank} 分钟无限体力</span>` : ''}`; }
    },
    open() {
      const s = d();
      CF.modal.open({ title: '体力', body: `<p style="line-height:1.8">当前体力 <b>${St.cur()}</b> / ${MAX}${St.unlimited() ? `，无限体力剩余 <b>${CF.fmtTime(St.leftMs() / 1000)}</b>` : ''}。每 6 分钟恢复 1 点。</p><p class="small muted" style="line-height:1.8">消耗：小关 ${COST.minor} · 次级关 ${COST.story} · 组队副本 ${COST.dungeon} · 沉浸模式 ${COST.immersive} · 遭遇战 ${COST.skirmish} · 快速模式 ${COST.quick}</p>${St.explain()}<p class="small" style="margin-top:8px">本次连续学习 ${CF.fmtTime(s.sess)} / 25:00 · 零散累计 ${Math.floor(s.pool / 60)} / 40 分钟 · 累计学习 ${Math.floor(s.total / 60)} 分钟</p>`, foot: [{ text: '关闭', cls: 'ghost' }].concat(s.bank > 0 ? [{ text: `启用 ${s.bank} 分钟无限体力`, cls: 'primary', onClick: () => { St.activate(); CF.modal.close(); } }] : [{ text: '去学院', cls: 'primary', onClick: () => { CF.modal.close(); CF.UI.show('academy'); } }]) });
    },
  });
  setInterval(() => { try { St.tick(1); St.paint(); } catch (e) { /* 存档未就绪 */ } }, 1000);
})();

</script>
<script>
/* js/labs.js */
/* 实验室：8 个可交互的实操实验 */
(function () {
  const CF = window.CF;
  const META = {
    gd: { name: '梯度下降', d: 'ai', icon: '📉', desc: '亲手训练一条直线：感受学习率太小、刚好、太大的区别。', dims: { zhi: 0.5 } },
    perceptron: { name: '感知机', d: 'ai', icon: '🧠', desc: '调权重把「乱码」和「信号」分开，理解一个神经元在做什么。', dims: { zhi: 0.5 } },
    pid: { name: 'PID 无人机', d: 'emb', icon: '🚁', desc: '调 Kp/Ki/Kd 让载重无人机稳稳悬停在 10 米，还要扛住一阵下压风。', dims: { zhi: 0.4 } },
    robot: { name: '机器人编程', d: 'emb', icon: '🤖', desc: '用指令编程让机器人绕开障碍拿到电池，挑战最少指令数。', dims: { zhi: 0.4 } },
    rocket: { name: '火箭方程', d: 'aero', icon: '🚀', desc: '设计两级火箭把 5 吨卫星送入近地轨道，越轻越好。', dims: { zhi: 0.5 } },
    startup: { name: '创业沙盘', d: 'biz', icon: '💼', desc: '经营一家 AI 初创公司 12 个月：定价、营销、招聘、融资。', dims: { qi: 1 } },
    code: { name: '代码挑战', d: 'ai', icon: '⌨️', desc: '在浏览器里写真代码：ReLU、Softmax、PID、火箭方程……完成 3 个即通关。', dims: { zhi: 0.5 } },
    pixel: { name: '像素工坊', d: null, icon: '🎨', desc: '画一个 16×16 的像素头像，它会出现在战场通讯里。', dims: { mei: 1 } },
  };
  const ORDER = ['gd', 'perceptron', 'pid', 'robot', 'rocket', 'startup', 'code', 'pixel'];
  const L = (CF.Labs = { META, ORDER });

  // ---------- 通用外壳 ----------
  function shell(id, introHtml) {
    const m = META[id];
    const body = CF.h(`<div class="lab"><div class="lab-msg">${introHtml}</div><div class="lab-main"><div class="lab-cv"><canvas></canvas></div><div class="lab-side"></div></div></div>`);
    let ro = null;
    CF.modal.open({ title: `${m.icon} 实验室 · ${m.name}`, body, wide: true, onClose: () => { if (ro) ro.disconnect(); CF.bus.emit('lab:closed'); } });
    const cv = body.querySelector('canvas'), box = body.querySelector('.lab-cv'), side = body.querySelector('.lab-side');
    const msgEl = CF.h('<div class="lab-msg">准备就绪。</div>');
    const ref = {
      body, cv, side, ctx: cv.getContext('2d'), w: 0, h: 0, draw: () => {},
      fit() { const dpr = Math.min(2, window.devicePixelRatio || 1); ref.w = box.clientWidth; ref.h = box.clientHeight; cv.width = Math.max(1, ref.w * dpr); cv.height = Math.max(1, ref.h * dpr); ref.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); },
      msg(html, cls = '') { msgEl.className = 'lab-msg ' + cls; msgEl.innerHTML = html; },
      msgEl,
    };
    if (window.ResizeObserver) { ro = new ResizeObserver(() => { ref.fit(); ref.draw(); }); ro.observe(box); }
    setTimeout(() => { ref.fit(); ref.draw(); }, 30);
    return ref;
  }
  function slider(label, min, max, step, val, fmt, on) {
    const el = CF.h(`<label class="slider"><div class="row"><span>${label}</span><b></b></div><input type="range" min="${min}" max="${max}" step="${step}" value="${val}"></label>`);
    const inp = el.querySelector('input'), b = el.querySelector('b');
    const upd = () => { b.textContent = fmt(+inp.value); };
    inp.addEventListener('input', () => { upd(); on(+inp.value); });
    upd();
    el.set = (v) => { inp.value = v; upd(); };
    return el;
  }
  function btn(text, cls, on) { const b = CF.h(`<button class="btn ${cls || ''}">${text}</button>`); b.onclick = () => { CF.Audio.sfx('click'); on(b); }; return b; }
  function row(...els) { const r = CF.h('<div class="row wrap"></div>'); els.forEach((e) => r.appendChild(e)); return r; }
  const starStr = (n) => '★'.repeat(n) + '☆'.repeat(3 - n);
  function plotFrame(ctx, x, y, w, h, title) {
    ctx.strokeStyle = '#2b2641'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w, h);
    ctx.fillStyle = '#9d96ad'; ctx.font = '11px ui-monospace,monospace'; ctx.fillText(title, x + 6, y + 14);
  }

  // =================== 1. 梯度下降 ===================
  L.gd = function () {
    const rnd = CF.rng(42), xs = [], ys = [];
    for (let i = 0; i < 14; i++) { const x = -3 + (6 * i) / 13; xs.push(x); ys.push(1.5 * x + 2 + (rnd() - 0.5) * 1.6); }
    const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
    let sxy = 0, sxx = 0; xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; });
    const wStar = sxy / sxx, bStar = my - wStar * mx;
    const loss = (w, b) => xs.reduce((s, x, i) => s + (w * x + b - ys[i]) ** 2, 0) / n;
    const minL = loss(wStar, bStar), goal = minL + 0.05;
    const S = { w: -1, b: -1, lr: 0.05, steps: 0, hist: [], touched: false, done: false };
    S.hist.push(loss(S.w, S.b));
    const R = shell('gd', '<b>目标：</b>用梯度下降把损失（MSE）降到 <span class="mono">' + goal.toFixed(2) + '</span> 以下。<br>先拖 w、b 感受「损失地形」，然后点「重置」，只调<b>学习率</b>再训练。步数越少星越多——学习率太大会发散。');
    const wS = slider('w（斜率）', -3, 5, 0.05, S.w, (v) => v.toFixed(2), (v) => { S.w = v; S.touched = true; S.hist.push(loss(S.w, S.b)); R.draw(); info(); });
    const bS = slider('b（截距）', -4, 6, 0.05, S.b, (v) => v.toFixed(2), (v) => { S.b = v; S.touched = true; S.hist.push(loss(S.w, S.b)); R.draw(); info(); });
    const lrS = slider('学习率 η', 0.01, 0.4, 0.01, S.lr, (v) => v.toFixed(2), (v) => { S.lr = v; });
    const kpi = CF.h('<div class="lab-msg mono small"></div>');
    function step() {
      if (S.done) return;
      let gw = 0, gb = 0;
      xs.forEach((x, i) => { const e = S.w * x + S.b - ys[i]; gw += (2 / n) * e * x; gb += (2 / n) * e; });
      S.w -= S.lr * gw; S.b -= S.lr * gb; S.steps++;
      const L0 = loss(S.w, S.b);
      S.hist.push(L0);
      wS.set(CF.clamp(S.w, -3, 5)); bS.set(CF.clamp(S.b, -4, 6));
      if (!isFinite(L0) || L0 > 1e4) { R.msg('💥 <b>发散了！</b>学习率太大，每一步都跨过了谷底并越跳越远。点「重置」换个更小的学习率。', 'bad'); S.done = true; CF.Audio.sfx('wrong'); }
      else if (L0 <= goal) {
        S.done = true;
        if (S.touched) { R.msg('达到目标！但你手动拖过 w/b——点「重置」后只用梯度下降再来一次才算数。'); return; }
        const stars = S.steps <= 6 ? 3 : S.steps <= 15 ? 2 : 1;
        R.msg(`✅ 用 <b>${S.steps}</b> 步收敛，${starStr(stars)}<br>学习率 ${S.lr.toFixed(2)}。最优学习率附近收敛最快；超过约 0.30 就会发散。这就是训练大模型时调「学习率」的意义。`, 'ok');
        CF.Audio.sfx('correct');
        CF.P.finishLab('gd', stars);
      }
    }
    function info() { kpi.innerHTML = `损失 ${S.hist[S.hist.length - 1].toFixed(3)}　目标 ≤ ${goal.toFixed(2)}<br>步数 ${S.steps}　w=${S.w.toFixed(2)} b=${S.b.toFixed(2)}`; }
    let timer = null;
    R.side.append(wS, bS, lrS,
      row(btn('单步', '', () => { step(); R.draw(); info(); }), btn('训练 ▶', 'primary', () => { clearInterval(timer); let k = 0; timer = setInterval(() => { if (S.done || k++ > 60) return clearInterval(timer); step(); R.draw(); info(); }, 120); }), btn('重置', 'ghost', () => { clearInterval(timer); Object.assign(S, { w: -1, b: -1, steps: 0, hist: [loss(-1, -1)], touched: false, done: false }); wS.set(-1); bS.set(-1); R.msg('已重置。只调学习率，然后训练。'); R.draw(); info(); })),
      kpi, R.msgEl);
    info();
    R.draw = function () {
      const { ctx, w, h } = R; ctx.clearRect(0, 0, w, h);
      const pw = w * 0.58, ph = h - 16;
      plotFrame(ctx, 8, 8, pw - 12, ph, '数据与拟合直线');
      const X = (x) => 8 + ((x + 3.5) / 7) * (pw - 12), Y = (y) => 8 + ph - ((y + 4) / 12) * ph;
      ctx.strokeStyle = '#2b2641'; ctx.beginPath(); ctx.moveTo(X(-3.5), Y(0)); ctx.lineTo(X(3.5), Y(0)); ctx.moveTo(X(0), Y(-4)); ctx.lineTo(X(0), Y(8)); ctx.stroke();
      xs.forEach((x, i) => { ctx.fillStyle = '#3fd0c9'; ctx.fillRect(X(x) - 3, Y(ys[i]) - 3, 6, 6); ctx.strokeStyle = '#ff4f9a55'; ctx.beginPath(); ctx.moveTo(X(x), Y(ys[i])); ctx.lineTo(X(x), Y(S.w * x + S.b)); ctx.stroke(); });
      ctx.strokeStyle = '#d97757'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(X(-3.5), Y(S.w * -3.5 + S.b)); ctx.lineTo(X(3.5), Y(S.w * 3.5 + S.b)); ctx.stroke(); ctx.lineWidth = 1;
      const lx = pw + 4, lw = w - pw - 12;
      plotFrame(ctx, lx, 8, lw, ph, '损失曲线（对数）');
      const hs = S.hist.slice(-80), lmax = Math.log10(Math.max(...hs.filter(isFinite), 1) + 1), lmin = Math.log10(minL);
      const LY = (v) => 8 + 20 + (1 - (Math.log10(Math.max(v, minL)) - lmin) / Math.max(0.01, lmax - lmin)) * (ph - 30);
      ctx.strokeStyle = '#6fdc8c88'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(lx, LY(goal)); ctx.lineTo(lx + lw, LY(goal)); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = '#e9b949'; ctx.lineWidth = 2; ctx.beginPath();
      hs.forEach((v, i) => { const px = lx + 6 + (i / Math.max(1, hs.length - 1)) * (lw - 12), py = LY(isFinite(v) ? Math.min(v, 1e4) : 1e4); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
      ctx.stroke(); ctx.lineWidth = 1;
    };
  };

  // =================== 2. 感知机 ===================
  L.perceptron = function () {
    const rnd = CF.rng(7), pts = [];
    while (pts.length < 24) {
      const lab = pts.length % 2 ? 1 : -1, cx = lab > 0 ? 1.2 : -1.1, cy = lab > 0 ? 0.9 : -0.9;
      const x = cx + (rnd() - 0.5) * 2.2, y = cy + (rnd() - 0.5) * 2.2;
      if ((x + y - 0.05) * lab > 0.35) pts.push({ x, y, l: lab });
    }
    const S = { w1: 0.6, w2: -1.2, b: 0.6, auto: 0, done: false };
    const R = shell('perceptron', '<b>感知机 = 最简单的神经元：</b>输出 = sign(w₁·x + w₂·y + b)。<br>橙色方块是我方「信号」，粉色是「乱码」。调三个参数让分界线把它们完全分开（准确率 100%）。纯手动完成得 3 星。');
    const acc = () => pts.filter((p) => Math.sign(S.w1 * p.x + S.w2 * p.y + S.b) === p.l).length / pts.length;
    const kpi = CF.h('<div class="lab-msg mono small"></div>');
    const check = () => {
      const a = acc();
      kpi.innerHTML = `准确率 ${(a * 100).toFixed(0)}%　自动训练轮数 ${S.auto}`;
      if (a === 1 && !S.done) {
        S.done = true;
        const stars = S.auto === 0 ? 3 : S.auto <= 2 ? 2 : 1;
        R.msg(`✅ 全部分对！${starStr(stars)}<br>你刚才做的就是神经网络训练的本质：找到一组权重让预测与标签一致。现代网络有数十亿个这样的权重，由梯度下降自动调整。`, 'ok');
        CF.Audio.sfx('correct'); CF.P.finishLab('perceptron', stars);
      }
    };
    const s1 = slider('w₁', -3, 3, 0.1, S.w1, (v) => v.toFixed(1), (v) => { S.w1 = v; R.draw(); check(); });
    const s2 = slider('w₂', -3, 3, 0.1, S.w2, (v) => v.toFixed(1), (v) => { S.w2 = v; R.draw(); check(); });
    const s3 = slider('b（偏置）', -3, 3, 0.1, S.b, (v) => v.toFixed(1), (v) => { S.b = v; R.draw(); check(); });
    R.side.append(s1, s2, s3, row(btn('自动训练 1 轮', '', () => {
      S.auto++;
      pts.forEach((p) => { const o = Math.sign(S.w1 * p.x + S.w2 * p.y + S.b) || 1; if (o !== p.l) { S.w1 += 0.3 * p.l * p.x; S.w2 += 0.3 * p.l * p.y; S.b += 0.3 * p.l; } });
      S.w1 = CF.clamp(S.w1, -3, 3); S.w2 = CF.clamp(S.w2, -3, 3); S.b = CF.clamp(S.b, -3, 3);
      s1.set(S.w1); s2.set(S.w2); s3.set(S.b);
      R.msg('感知机学习规则：对每个分错的点，w ← w + η·标签·输入。错了就往正确方向挪一点。');
      R.draw(); check();
    })), kpi, R.msgEl);
    check();
    R.draw = function () {
      const { ctx, w, h } = R; ctx.clearRect(0, 0, w, h);
      const sz = Math.min(w, h) - 16, ox = (w - sz) / 2, oy = 8;
      const X = (x) => ox + ((x + 3) / 6) * sz, Y = (y) => oy + sz - ((y + 3) / 6) * sz;
      const cell = sz / 30;
      for (let i = 0; i < 30; i++) for (let j = 0; j < 30; j++) {
        const x = -3 + (i + 0.5) / 5, y = 3 - (j + 0.5) / 5, v = S.w1 * x + S.w2 * y + S.b;
        ctx.fillStyle = v > 0 ? 'rgba(217,119,87,0.13)' : 'rgba(255,79,154,0.10)';
        ctx.fillRect(ox + i * cell, oy + j * cell, cell - 1, cell - 1);
      }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath();
      if (Math.abs(S.w2) > 1e-3) { ctx.moveTo(X(-3), Y((-S.b - S.w1 * -3) / S.w2)); ctx.lineTo(X(3), Y((-S.b - S.w1 * 3) / S.w2)); }
      else if (Math.abs(S.w1) > 1e-3) { ctx.moveTo(X(-S.b / S.w1), Y(-3)); ctx.lineTo(X(-S.b / S.w1), Y(3)); }
      ctx.stroke(); ctx.lineWidth = 1;
      pts.forEach((p) => {
        const ok = Math.sign(S.w1 * p.x + S.w2 * p.y + S.b) === p.l;
        ctx.fillStyle = p.l > 0 ? '#d97757' : '#ff4f9a';
        ctx.fillRect(X(p.x) - 5, Y(p.y) - 5, 10, 10);
        if (!ok) { ctx.strokeStyle = '#fff'; ctx.strokeRect(X(p.x) - 8, Y(p.y) - 8, 16, 16); }
      });
    };
  };

  // =================== 3. PID 无人机 ===================
  function pidSim(kp, ki, kd) {
    const m = 1.2, g = 9.81, dt = 0.01, target = 10;
    let y = 0, v = 0, I = 0, prevE = target;
    const ys = [];
    for (let i = 0; i <= 1200; i++) {
      const t = i * dt, e = target - y, D = (e - prevE) / dt; prevE = e;
      const raw = 1.0 * g + kp * e + ki * I + kd * D, T = CF.clamp(raw, 0, 2.5 * g);
      if (raw === T && Math.abs(e) < 3) I += e * dt;
      let F = T - m * g - 0.4 * v; if (t >= 6 && t < 7.5) F -= 4;
      v += (F / m) * dt; y += v * dt; if (y < 0) { y = 0; v = Math.max(0, v); }
      ys.push(y);
    }
    const first = ys.slice(0, 600), maxY = Math.max(...first);
    let settle = 0; for (let i = 0; i < 600; i++) if (Math.abs(ys[i] - 10) > 0.3) settle = i * dt;
    let rec = 0; for (let i = 600; i < 1200; i++) if (Math.abs(ys[i] - 10) > 0.3) rec = i * dt;
    return { ys, over: Math.max(0, (maxY - 10) / 10) * 100, settle: settle + dt, err: Math.abs(ys[590] - 10), rec };
  }
  L.pid = function () {
    const S = { kp: 2, ki: 0, kd: 0, sim: null, t: 0, anim: null };
    const R = shell('pid', '<b>任务：</b>一架带货无人机（比飞控以为的重 20%）要从地面升到 <b>10 米</b> 悬停；第 6 秒会有一阵向下的风。<br>过关：超调 &lt; 15%、4.5 秒内稳定在 ±0.3 m、第 6 秒前误差 &lt; 0.2 m、风后 4.5 秒内恢复。<br><span class="muted">提示：先调 Kp，再加 Kd 抑制超调，最后加 Ki 消除「重了 20%」带来的误差。</span>');
    const kpi = CF.h('<div class="lab-msg mono small">点「起飞」运行仿真</div>');
    const run = () => {
      S.sim = pidSim(S.kp, S.ki, S.kd); S.t = 0;
      cancelAnimationFrame(S.anim);
      const t0 = performance.now();
      const tick = () => { S.t = Math.min(12, ((performance.now() - t0) / 1000) * 4); R.draw(); if (S.t < 12) S.anim = requestAnimationFrame(tick); else judge(); };
      tick();
    };
    const judge = () => {
      const r = S.sim;
      const pass = r.over < 15 && r.settle < 4.5 && r.err < 0.2 && r.rec < 10.5;
      kpi.innerHTML = `超调 ${r.over.toFixed(1)}%　稳定时间 ${r.settle.toFixed(2)}s<br>6s 前误差 ${r.err.toFixed(2)}m　风后恢复 ${r.rec > 6 ? (r.rec - 7.5 > 0 ? (r.rec - 7.5).toFixed(2) + 's' : '即时') : '即时'}`;
      if (pass) {
        const stars = r.over < 4 && r.settle < 2.3 ? 3 : r.over < 10 && r.settle < 3.5 ? 2 : 1;
        R.msg(`✅ 稳稳悬停！${starStr(stars)}<br>P 负责「拉回来」，D 负责「别冲过头」，I 负责「补上一直差的那一点」。真实的飞控（PX4、ArduPilot）里，姿态和位置都是一层层 PID。`, 'ok');
        CF.Audio.sfx('correct'); CF.P.finishLab('pid', stars);
      } else {
        const why = [];
        if (r.over >= 15) why.push('超调太大 → 加大 Kd 或减小 Kp');
        if (r.err >= 0.2) why.push('一直差一点 → 需要 Ki（积分）');
        if (r.settle >= 4.5) why.push('稳定太慢 → 适当加大 Kp');
        if (r.rec >= 10.5) why.push('抗风不足 → 加大 Ki 或 Kp');
        R.msg('还没过关：' + why.join('；'), 'bad'); CF.Audio.sfx('wrong');
      }
    };
    R.side.append(
      slider('Kp 比例', 0, 10, 0.25, S.kp, (v) => v.toFixed(2), (v) => (S.kp = v)),
      slider('Ki 积分', 0, 3, 0.05, S.ki, (v) => v.toFixed(2), (v) => (S.ki = v)),
      slider('Kd 微分', 0, 8, 0.25, S.kd, (v) => v.toFixed(2), (v) => (S.kd = v)),
      row(btn('🚁 起飞', 'primary', run)), kpi, R.msgEl);
    R.draw = function () {
      const { ctx, w, h } = R; ctx.clearRect(0, 0, w, h);
      const pw = w - 90, ph = h - 26;
      plotFrame(ctx, 8, 8, pw, ph, '高度 (m) – 时间 (s)');
      const X = (t) => 8 + (t / 12) * pw, Y = (y) => 8 + ph - (y / 16) * ph;
      ctx.fillStyle = '#6fdc8c18'; ctx.fillRect(8, Y(10.3), pw, Y(9.7) - Y(10.3));
      ctx.strokeStyle = '#6fdc8c'; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(8, Y(10)); ctx.lineTo(8 + pw, Y(10)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#29e0e014'; ctx.fillRect(X(6), 8, X(7.5) - X(6), ph);
      ctx.fillStyle = '#9d96ad'; ctx.font = '10px ui-monospace,monospace';
      for (let t = 0; t <= 12; t += 2) ctx.fillText(t + 's', X(t) - 6, 8 + ph + 12);
      ctx.fillText('阵风', X(6) + 4, 24);
      let cy = 0;
      if (S.sim) {
        const N = Math.floor(S.t / 0.01);
        ctx.strokeStyle = '#e9b949'; ctx.lineWidth = 2; ctx.beginPath();
        for (let i = 0; i <= N && i < S.sim.ys.length; i += 2) { const px = X(i * 0.01), py = Y(S.sim.ys[i]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
        ctx.stroke(); ctx.lineWidth = 1;
        cy = S.sim.ys[Math.min(N, S.sim.ys.length - 1)];
      }
      // 无人机
      const dx = w - 46, dy = Y(cy);
      ctx.fillStyle = '#2b2641'; ctx.fillRect(dx - 2, 8, 4, ph);
      ctx.fillStyle = '#d97757'; ctx.fillRect(dx - 12, dy - 5, 24, 8);
      ctx.fillStyle = '#1b1226'; ctx.fillRect(dx - 6, dy - 3, 2, 2); ctx.fillRect(dx + 4, dy - 3, 2, 2);
      ctx.fillStyle = '#b3abea'; const sp = (performance.now() / 40) % 2 < 1;
      ctx.fillRect(dx - 22, dy - 9, sp ? 14 : 8, 2); ctx.fillRect(dx + 8, dy - 9, sp ? 14 : 8, 2);
      ctx.fillStyle = '#9d96ad'; ctx.fillRect(dx - 15, dy - 9, 2, 6); ctx.fillRect(dx + 13, dy - 9, 2, 6);
      if (S.sim && S.t >= 6 && S.t < 7.5) { ctx.fillStyle = '#29e0e0'; for (let k = 0; k < 3; k++) ctx.fillRect(dx - 14 + k * 12, dy - 30 + ((performance.now() / 20) % 12), 2, 8); }
    };
  };

  // =================== 4. 机器人编程 ===================
  const MAPS = [
    ['........', '.S...#..', '.....#B.', '.....#..', '........', '........'],
    ['S.#.....', '..#.##..', '..#..#..', '.....#B.', '.###.#..', '........'],
    ['S...#...', '.##.#.#.', '.#..#.#.', '.#.##.#B', '.#....#.', '...##...'],
  ];
  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // 东 南 西 北
  function parseMap(m) { let s, b; m.forEach((r, y) => { for (let x = 0; x < r.length; x++) { if (r[x] === 'S') s = [x, y]; if (r[x] === 'B') b = [x, y]; } }); return { s, b, wall: (x, y) => y < 0 || y >= m.length || x < 0 || x >= m[0].length || m[y][x] === '#' }; }
  function optimalOps(m) {
    const P = parseMap(m), start = [P.s[0], P.s[1], 0], key = (a) => a.join(',');
    const seen = new Set([key(start)]), q = [[start, 0]];
    while (q.length) {
      const [[x, y, d], c] = q.shift();
      if (x === P.b[0] && y === P.b[1]) return c;
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      const next = [[x, y, (d + 3) % 4], [x, y, (d + 1) % 4]];
      if (!P.wall(nx, ny)) next.push([nx, ny, d]);
      next.forEach((s) => { if (!seen.has(key(s))) { seen.add(key(s)); q.push([s, c + 1]); } });
    }
    return -1;
  }

      const X = (i) => 10 + 20 + (i / 12) * (pw - 30), Yc = (c) => 8 + 20 + (1 - (c - minC) / (maxC - minC)) * (ph - 30);
      S.hist.forEach((p, i) => { const bh = (p.users / maxU) * (ph - 40); ctx.fillStyle = '#3fd0c955'; ctx.fillRect(X(i + 1) - 8, 8 + ph - bh, 16, bh); });
      ctx.strokeStyle = '#ff5d6c66'; ctx.beginPath(); ctx.moveTo(10, Yc(0)); ctx.lineTo(10 + pw, Yc(0)); ctx.stroke();
      ctx.strokeStyle = '#e9b949'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(0), Yc(1e6)); S.hist.forEach((p, i) => ctx.lineTo(X(i + 1), Yc(p.cash))); ctx.stroke(); ctx.lineWidth = 1;
      ctx.fillStyle = '#9d96ad'; ctx.font = '10px ui-monospace,monospace'; for (let i = 0; i <= 12; i += 3) ctx.fillText(i + '月', X(i) - 8, 8 + ph + 12);
    };
  };

  // =================== 7. 代码挑战 ===================
  const WORKER_SRC = `onmessage=function(e){var d=e.data,f;try{f=new Function(d.code+"\\n;return typeof "+d.fn+"==='function'?"+d.fn+":null;")();}catch(err){postMessage({error:'语法错误：'+err.message});return;}if(!f){postMessage({error:'没有找到函数 '+d.fn+'，请保留函数名'});return;}var res=d.tests.map(function(t){try{return{got:f.apply(null,JSON.parse(JSON.stringify(t[0])))};}catch(err){return{err:String(err&&err.message||err)};}});postMessage({res:res});};`;
  function runTests(c, code) {
    return new Promise((resolve) => {
      let w = null;
      try { w = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }))); } catch (e) { w = null; }
      const payload = { code, fn: c.fn, tests: c.tests };
      if (!w) { // 退化：同步执行
        try { const f = new Function(code + '\n;return ' + c.fn + ';')(); resolve({ res: c.tests.map((t) => { try { return { got: f(...JSON.parse(JSON.stringify(t[0]))) }; } catch (err) { return { err: err.message }; } }) }); } catch (err) { resolve({ error: '语法错误：' + err.message }); }
        return;
      }
      const to = setTimeout(() => { w.terminate(); resolve({ error: '运行超时（是不是写了死循环？）' }); }, 2000);
      w.onmessage = (e) => { clearTimeout(to); w.terminate(); resolve(e.data); };
      w.onerror = (e) => { clearTimeout(to); w.terminate(); resolve({ error: e.message || '运行出错' }); e.preventDefault && e.preventDefault(); };
      w.postMessage(payload);
    });
  }
  const close = (a, b) => {
    if (Array.isArray(b)) return Array.isArray(a) && a.length === b.length && a.every((x, i) => close(x, b[i]));
    return typeof a === 'number' && Math.abs(a - b) <= Math.max(1e-6, Math.abs(b) * 1e-4);
  };
  L.code = function () {
    const body = CF.h('<div class="lab"><div class="lab-msg">在浏览器里写真正的 JavaScript。完成任意 <b>3</b> 个挑战即通关本实验（每个挑战都有实操经验）。<br><span class="muted">AI 领域主流语言是 Python——这些函数在线下任务里请再用 Python 写一遍。</span></div><div class="lab-main"><div class="lab-side" style="flex:0 1 230px" id="cList"></div><div style="flex:1 1 380px;display:flex;flex-direction:column;gap:8px;min-width:0"><div id="cDesc" class="lab-msg"></div><textarea class="code" id="cCode" spellcheck="false"></textarea><div class="row"><button class="btn primary" id="cRun">▶ 运行测试</button><button class="btn ghost" id="cReset">恢复初始代码</button></div><div class="lab-msg testlog" id="cLog">—</div></div></div></div>');
    CF.modal.open({ title: '⌨️ 实验室 · 代码挑战', body, wide: true });
    const list = body.querySelector('#cList'), desc = body.querySelector('#cDesc'), code = body.querySelector('#cCode'), log = body.querySelector('#cLog');
    const drafts = {};
    let cur = CF.Content.CODE[0];
    const renderList = () => {
      list.innerHTML = '';
      CF.Content.CODE.forEach((c) => {
        const done = CF.Save.data.code[c.id];
        const b = CF.h(`<button class="btn sm" style="justify-content:space-between;width:100%">${CF.esc(c.title)}<span>${done ? '✓' : CF.Content.DOMAINS[c.d].icon}</span></button>`);
        if (c === cur) b.classList.add('violet');
        b.onclick = () => { drafts[cur.id] = code.value; cur = c; show(); renderList(); };
        list.appendChild(b);
      });
    };
    const show = () => { desc.innerHTML = `<b>${CF.esc(cur.title)}</b><br>${CF.esc(cur.desc)}`; code.value = drafts[cur.id] || cur.starter; log.textContent = '—'; };
    code.addEventListener('keydown', (e) => { if (e.key === 'Tab') { e.preventDefault(); const s = code.selectionStart; code.value = code.value.slice(0, s) + '  ' + code.value.slice(code.selectionEnd); code.selectionStart = code.selectionEnd = s + 2; } });
    body.querySelector('#cReset').onclick = () => { code.value = cur.starter; };
    body.querySelector('#cRun').onclick = async () => {
      log.textContent = '运行中…';
      const r = await runTests(cur, code.value);
      if (r.error) { log.textContent = '❌ ' + r.error; CF.Audio.sfx('error'); return; }
      let pass = 0;
      log.textContent = r.res.map((x, i) => { const t = cur.tests[i], ok = !x.err && close(x.got, t[1]); if (ok) pass++; return `${ok ? '✅' : '❌'} ${cur.fn}(${t[0].map((a) => JSON.stringify(a)).join(', ')}) → ${x.err ? '报错: ' + x.err : JSON.stringify(x.got)}${ok ? '' : '　期望 ' + JSON.stringify(t[1])}`; }).join('\n');
      if (pass === cur.tests.length) { log.textContent += `\n\n全部通过！`; CF.Audio.sfx('correct'); CF.P.finishCode(cur.id); renderList(); }
      else CF.Audio.sfx('wrong');
    };
    renderList(); show();
  };

  // =================== 8. 像素工坊 ===================
  const PIX_PAL = ['transparent', '#d97757', '#b85f40', '#1b1226', '#ede6d6', '#8b80d6', '#5b3aa8', '#e9b949', '#3fd0c9', '#ff4f9a', '#6fdc8c'];
  L.PIX_PAL = PIX_PAL;
  L.pixel = function () {
    const grid = (CF.Save.data.avatar && CF.Save.data.avatar.slice()) || new Array(256).fill(0);
    let col = 1, painting = false;
    const body = CF.h(`<div class="lab"><div class="lab-msg">美也是一种能力。画一个 16×16 的指挥官头像，它会出现在战场通讯框里。用到 4 种以上颜色得 3 星。</div><div class="lab-main" style="align-items:flex-start"><div class="pix-grid" id="pg"></div><div class="lab-side"><div class="swatches" id="sw"></div><div class="row wrap"><button class="btn sm" id="pTpl">载入 X-S 模板</button><button class="btn sm ghost" id="pClr">清空</button></div><button class="btn primary" id="pSave">保存为指挥官头像</button><div class="lab-msg small" id="pMsg">按住拖动可以连续涂色；选透明色当橡皮擦。</div></div></div></div>`);
    CF.modal.open({ title: '🎨 实验室 · 像素工坊', body, wide: true });
    const pg = body.querySelector('#pg'), sw = body.querySelector('#sw');
    const cells = [];
    for (let i = 0; i < 256; i++) { const d = document.createElement('div'); d.dataset.i = i; cells.push(d); pg.appendChild(d); }
    const paint = () => cells.forEach((d, i) => (d.style.background = PIX_PAL[grid[i]]));
    PIX_PAL.forEach((c, i) => { const s = CF.h(`<button class="swatch" title="${i ? c : '橡皮擦'}" style="background:${i ? c : 'repeating-conic-gradient(#555 0 25%,#222 0 50%) 0 0/10px 10px'}"></button>`); s.onclick = () => { col = i; CF.$$('.swatch', sw).forEach((x) => x.classList.remove('on')); s.classList.add('on'); }; if (i === 1) s.classList.add('on'); sw.appendChild(s); });
    const at = (e) => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.parentNode === pg ? +el.dataset.i : -1; };
    pg.addEventListener('pointerdown', (e) => { painting = true; const i = at(e); if (i >= 0) { grid[i] = col; paint(); } e.preventDefault(); });
    pg.addEventListener('pointermove', (e) => { if (!painting) return; const i = at(e); if (i >= 0 && grid[i] !== col) { grid[i] = col; cells[i].style.background = PIX_PAL[col]; } });
    window.addEventListener('pointerup', () => (painting = false));
    body.querySelector('#pClr').onclick = () => { grid.fill(0); paint(); };
    body.querySelector('#pTpl').onclick = () => {
      const c = document.createElement('canvas'); c.width = c.height = 16; const x = c.getContext('2d');
      x.fillStyle = '#5b3aa8'; x.fillRect(0, 0, 16, 16);
      CF.PixelFX.drawClawd(x, 1, 3, 1, { noGuitar: true });
      const data = x.getImageData(0, 0, 16, 16).data;
      const hex = (r, g, b) => '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
      for (let i = 0; i < 256; i++) { const h = hex(data[i * 4], data[i * 4 + 1], data[i * 4 + 2]); const k = PIX_PAL.indexOf(h); grid[i] = k > 0 ? k : 6; }
      paint();
    };
    body.querySelector('#pSave').onclick = () => {
      const used = new Set(grid.filter((v) => v > 0));
      if (used.size < 2) { body.querySelector('#pMsg').textContent = '至少用 2 种颜色画点什么吧。'; CF.Audio.sfx('error'); return; }
      CF.Save.data.avatar = grid.slice(); CF.Save.save();
      const stars = used.size >= 4 ? 3 : used.size >= 3 ? 2 : 1;
      body.querySelector('#pMsg').innerHTML = `已保存！${starStr(stars)}　下一场战斗的通讯里就能看到它。`;
      CF.Audio.sfx('correct'); CF.P.finishLab('pixel', stars);
    };
    paint();
  };
  // 头像绘制（供通讯框使用）
  L.drawAvatar = function (ctx, x, y, size) {
    const g = CF.Save.data.avatar; if (!g) return false;
    const p = size / 16;
    for (let i = 0; i < 256; i++) if (g[i]) { ctx.fillStyle = PIX_PAL[g[i]]; ctx.fillRect(x + (i % 16) * p, y + Math.floor(i / 16) * p, Math.ceil(p), Math.ceil(p)); }
    return true;
  };

  L.open = function (id) { CF.Audio.play('lab'); (L[id] || L.gd)(); };
})();

</script>
<script>
/* js/academy.js */
/* 学院、实验室列表、成长档案、成就页面 */
(function () {
  const CF = window.CF;
  const C = () => CF.Content;
  const S = () => CF.Save.data;
  const A = (CF.Academy = { tab: 'daily' });

  // ---------- 配比条 ----------
  A.ratioHtml = function () {
    const r = CF.P.ratio(), k = Math.round(r.kPct * 100), p = 100 - k;
    return `<div class="ratio"><span class="c-corp">知识 ${r.t ? k : 0}%</span><div class="rbar"><i class="k" style="width:${r.t ? k : 30}%"></i><i class="p" style="width:${r.t ? p : 70}%"></i><b class="mark" title="目标 30%"></b></div><span style="color:var(--orange2)">实操 ${r.t ? p : 0}%</span></div><div class="small muted" style="margin-top:6px">${CF.P.suggestion().text}</div>`;
  };

  // ---------- 测验 ----------
  A.pickQuestions = function (domain, n) {
    const seen = S().quiz.seen;
    let pool = C().QUIZ.filter((q) => !domain || domain === 'all' || q.d === domain);
    if (domain === 'wrong') pool = C().QUIZ.filter((q) => seen[q.id] && seen[q.id].w > seen[q.id].c);
    const score = (q) => { const s = seen[q.id]; if (!s) return Math.random(); return 1 + s.c * 2 - s.w * 1.5 + Math.random() * 1.5 + (Date.now() - (s.last || 0) < 3600e3 ? 5 : 0); };
    return pool.map((q) => [score(q), q]).sort((a, b) => a[0] - b[0]).slice(0, n).map((x) => x[1]);
  };
  A.quiz = function ({ domain = 'all', n = 5, onDone = null, title = '知识测验', inBattle = false } = {}) {
    const qs = A.pickQuestions(domain, n);
    if (!qs.length) { CF.toast('这个分类暂时没有题目（错题本是空的）'); return; }
    let i = 0, right = 0;
    const body = CF.modal.open({ title, closable: !inBattle, onClose: () => { if (inBattle && i < qs.length) onDone && onDone(right, qs.length); } });
    const render = () => {
      const q = qs[i];
      const order = CF.shuffle(q.o.map((t, k) => k));
      body.innerHTML = `<div class="row between small muted"><span>${C().DOMAINS[q.d].icon} ${C().DOMAINS[q.d].name}</span><span>${i + 1} / ${qs.length}</span></div><div class="quiz-q">${CF.esc(q.q)}</div><div class="quiz-opts"></div><div class="nextwrap"></div>`;
      const box = body.querySelector('.quiz-opts');
      order.forEach((k, idx) => {
        const b = CF.h(`<button class="quiz-opt"><span class="mono muted">${'ABCD'[idx]}.</span> ${CF.esc(q.o[k])}</button>`);
        b.onclick = () => {
          if (box.dataset.done) return; box.dataset.done = 1;
          const ok = k === q.a;
          if (ok) right++;
          CF.$$('.quiz-opt', box).forEach((el, j) => { if (order[j] === q.a) el.classList.add('right'); });
          if (!ok) b.classList.add('wrong');
          CF.Audio.sfx(ok ? 'correct' : 'wrong');
          CF.P.answerQuiz(q, ok);
          const nx = body.querySelector('.nextwrap');
          nx.innerHTML = `<div class="explain">${ok ? '✅ 正确！' : '❌ 正确答案已标出。'}<br>${CF.esc(q.e)}</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary">${i + 1 < qs.length ? '下一题 →' : '完成'}</button></div>`;
          nx.querySelector('button').onclick = () => { CF.Audio.sfx('click'); i++; if (i < qs.length) render(); else finish(); };
        };
        box.appendChild(b);
      });
    };
    const finish = () => {
      if (onDone) { CF.modal.close(); onDone(right, qs.length); return; }
      body.innerHTML = `<div style="text-align:center;padding:20px"><div style="font-size:42px">${right === qs.length ? '🏆' : right >= qs.length / 2 ? '👍' : '📖'}</div><h3 style="margin:10px 0">答对 ${right} / ${qs.length}</h3><p class="muted small">知识是地图，实操是走路。记得按 3:7 去实验室或做线下任务。</p><div class="row" style="justify-content:center;margin-top:16px;gap:8px"><button class="btn" data-a="again">再来一组</button><button class="btn primary" data-a="lab">去实验室</button></div></div>`;
      body.querySelector('[data-a=again]').onclick = () => A.quiz({ domain, n });
      body.querySelector('[data-a=lab]').onclick = () => { CF.modal.close(); CF.UI.show('labs'); };
      CF.bus.emit('progress');
    };
    render();
  };

  // ---------- 线下任务打卡 ----------
  A.quest = function (q) {
    const doneToday = S().quests.log.some((l) => l.id === q.id && l.date === CF.today());
    const body = CF.h(`<div><p class="small muted">${C().DOMAINS[q.d] ? C().DOMAINS[q.d].icon + ' ' + C().DOMAINS[q.d].name : { de: '🤝 德', ti: '💪 体', mei: '🎸 美' }[q.d]} · +${q.xp} 实操经验</p><h3 style="margin:8px 0">${CF.esc(q.t)}</h3><p style="line-height:1.8">${CF.esc(q.how)}</p><div class="sec-title">实践记录</div><p class="small muted" style="margin-bottom:6px">${CF.esc(q.ev)}（至少 10 个字。这是写给你自己的证据，诚实最重要。）</p><textarea class="note" placeholder="写下你做了什么、结果如何、学到了什么……"></textarea></div>`);

      { text: '稍后再做', cls: 'ghost' },

  // ---------- 企业家情景 ----------
  A.scenario = function (sc) {
    const prev = S().scenarios[sc.id];
    const body = CF.modal.open({ title: `💼 ${sc.who} · ${sc.year} · ${sc.title}` });
    const render = (chosen) => {
      body.innerHTML = `<p style="line-height:1.8;font-size:15px">${CF.esc(sc.ctx)}</p><div class="sec-title">你会怎么做？</div><div class="quiz-opts"></div><div class="res"></div>`;
      const box = body.querySelector('.quiz-opts');
      sc.opts.forEach((o, k) => {
        const b = CF.h(`<button class="quiz-opt">${CF.esc(o.t)}</button>`);
        if (chosen !== undefined) { if (k === chosen) b.classList.add(o.best ? 'right' : 'wrong'); else if (o.best) b.classList.add('right'); }
        b.onclick = () => { if (chosen !== undefined) return; CF.Audio.sfx(o.best ? 'correct' : 'chord'); CF.P.decideScenario(sc, k); render(k); };
        box.appendChild(b);
      });
      if (chosen !== undefined) {
        const o = sc.opts[chosen], best = sc.opts.find((x) => x.best);
        const fs = Object.keys(o.f || {}).map((k) => `${C().FOUNDER[k]} +${o.f[k]}`).join('　');
        body.querySelector('.res').innerHTML = `<div class="explain"><b>你的选择：</b>${CF.esc(o.r)}${fs ? `<br><span class="c-chip small">${fs}</span>` : ''}</div>` +
          (o.best ? '' : `<div class="explain" style="border-color:var(--good)"><b>历史/推荐选择：</b>${CF.esc(best.t)}<br>${CF.esc(best.r)}</div>`) +
          `<div class="explain" style="border-color:var(--orange)"><b>💡 启示：</b>${CF.esc(sc.lesson)}</div>`;
      }
    };
    render(prev);
  };

  // ---------- 学院主页面 ----------
  const TABS = [['daily', '今日修炼'], ['quiz', '知识测验'], ['quests', '线下任务'], ['founder', '企业家修炼'], ['road', '学习路线']];
  A.render = function () {
    const tabs = CF.$('#academyTabs');
    tabs.innerHTML = '';
    TABS.forEach(([id, n]) => { const b = CF.h(`<button class="tab ${A.tab === id ? 'on' : ''}">${n}</button>`); b.onclick = () => { CF.Audio.sfx('click'); A.tab = id; A.render(); }; tabs.appendChild(b); });
    const body = CF.$('#academyBody');
    body.innerHTML = '';
    body.appendChild(CF.h(`<div class="card" style="margin-bottom:14px">${A.ratioHtml()}</div>`));
    ({ daily: renderDaily, quiz: renderQuiz, quests: renderQuests, founder: renderFounder, road: renderRoad })[A.tab](body);
  };
  function taskRow(ic, title, desc, right, done, onClick) {
    const el = CF.h(`<div class="task ${done ? 'done' : ''}"><div class="ic">${ic}</div><div class="bd"><h4>${title}</h4><p>${desc}</p></div><div></div></div>`);
    if (right) { const b = CF.h(`<button class="btn sm ${done ? 'ghost' : 'primary'}">${right}</button>`); b.onclick = () => { CF.Audio.sfx('click'); onClick(); }; el.lastChild.appendChild(b); }

  }
  function renderDaily(body) {
    const plan = CF.P.dailyPlan(), st = S().streak;
    body.appendChild(CF.h(`<div class="row between wrap" style="margin-bottom:10px"><div class="small muted">${CF.today()} · 连续学习 <b class="c-chip">${st.count}</b> 天（最佳 ${st.best || 0}）</div><div class="small muted">完成全部 → 下场战斗起始算力 +50</div></div>`));

      if (it.kind === 'quiz') body.appendChild(taskRow('📚', `${tag} 知识小测 · 3 题`, '优先出你没见过或答错过的题。', done ? '再来' : '开始', done, () => A.quiz({ n: 3, title: '今日小测', onDone: (r, n) => { CF.P.markDaily('quiz', 'daily'); CF.toast(`答对 ${r}/${n}`); A.render(); } })));
      if (it.kind === 'lab') { const m = CF.Labs.META[it.id]; body.appendChild(taskRow(m.icon, `${tag} 实验室 · ${m.name}`, m.desc, done ? '再玩' : '开始', done, () => CF.Labs.open(it.id))); }
      if (it.kind === 'quest') { const q = C().QUESTS.find((x) => x.id === it.id); body.appendChild(taskRow({ ai: '🧠', emb: '🤖', aero: '🚀', biz: '💼', de: '🤝', ti: '💪', mei: '🎸' }[q.d], `${tag} ${it.label === '线下实操' ? '线下实操' : it.label} · ${CF.esc(q.t)}`, CF.esc(q.how), done ? '已打卡' : '去做', done, () => A.quest(q))); }
      if (it.kind === 'scenario') { const sc = C().SCENARIOS.find((x) => x.id === it.id); body.appendChild(taskRow('💡', `${tag} 企业家修炼 · ${sc.who}：${CF.esc(sc.title)}`, CF.esc(sc.ctx.slice(0, 60)) + '…', done ? '回顾' : '决策', done, () => A.scenario(sc))); }
    });
    body.appendChild(CF.h('<p class="small muted" style="margin-top:12px;line-height:1.7">💡 游戏能帮你把大目标拆成每天能完成的小步并给你反馈，但真正的成长发生在线下：写代码、做实验、运动、和人交流。每个线下任务都需要写实践记录——这是你自己的成长证据。</p>'));
  }

  // ---------- 成长档案 ----------
  function radar(cv, vals, labels) {
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cx = W / 2, cy = H / 2 + 4, R = Math.min(W, H) / 2 - 30, n = vals.length;
    const max = Math.max(50, ...vals) * 1.1;
    const pt = (i, r) => [cx + Math.sin((i / n) * Math.PI * 2) * r, cy - Math.cos((i / n) * Math.PI * 2) * r];
    ctx.strokeStyle = '#2b2641';
    for (let k = 1; k <= 4; k++) { ctx.beginPath(); for (let i = 0; i <= n; i++) { const [x, y] = pt(i % n, (R * k) / 4); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
    for (let i = 0; i < n; i++) { const [x, y] = pt(i, R); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke(); }
    ctx.fillStyle = 'rgba(155,123,255,0.28)'; ctx.strokeStyle = '#9b7bff'; ctx.lineWidth = 2; ctx.beginPath();
    vals.forEach((v, i) => { const [x, y] = pt(i, (R * v) / max); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = '#ede6d6'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    labels.forEach((l, i) => { const [x, y] = pt(i, R + 16); ctx.fillText(`${l} ${Math.round(vals[i])}`, x, y + 4); });
    ctx.textAlign = 'left';
  }

    CF.$('#expBtn').onclick = () => {

    CF.$('#impBtn').onclick = () => {

      b.querySelector('input').onchange = async (e) => { const f = e.target.files[0]; if (f) b.querySelector('textarea').value = await f.text(); };
      CF.modal.open({ title: '导入存档', body: b, foot: [{ text: '取消', cls: 'ghost' }, { text: '导入（覆盖当前进度）', cls: 'primary', onClick: () => { try { CF.Save.importText(b.querySelector('textarea').value); CF.modal.close(); CF.toast('导入成功', 'good'); A.renderProfile(); } catch (e) { CF.toast('导入失败：' + e.message, 'bad'); } } }] });

 *  - 每章随机 10–13 个普通关（按存档种子固定，换设备导入存档也一样）；
 *  - 次级关 = 剧情关：3 波，通关后不可重复挑战；

(function () {
  const CF = window.CF;

    budget: (P) => Math.round(P <= 15 ? 12 * Math.pow(1.15, P - 1) : 12 * Math.pow(1.15, 14) * Math.pow(1.04, P - 15)),
    // 敌人耐久随难度缓慢上升（每级 +2.5%；D15 以后每级 +5%）

    SPLIT3: [0.25, 0.5, 1],
    SPLIT5: [0.3, 0.5, 0.75, 1, 1.2],
    MIX: {
      ground: { bug: 0.55, noise: 0.35, titan: 0.1 },
      swarm: { bug: 0.7, bat: 0.3 },
      heavy: { bug: 0.35, noise: 0.2, titan: 0.45 },
      air: { bat: 0.8, noise: 0.2 },

    THEME_NAME: { ground: '地面推进', swarm: '虫群', heavy: '重装', air: '空袭', mixed: '混编' },
    tier(P) { return P < 3 ? ['入门', '#6fdc8c'] : P < 6 ? ['普通', '#3fd0c9'] : P < 9 ? ['进阶', '#ffb14a'] : P < 12 ? ['挑战', '#ff7a45'] : ['噩梦', '#ff4f9a']; },
    wave(P, frac, theme) {
      const B = Diff.budget(P) * frac, mix = Object.assign({}, Diff.MIX[theme] || Diff.MIX.ground), units = [];
      // 新兵种按难度逐步登场：飞行 P ≥ 3（空袭主题除外）、巨像 P ≥ 4 且只在后半程；被跳过的份额并入乱码虫
      if (mix.bat && P < 3 && theme !== 'air') { mix.bug = (mix.bug || 0) + mix.bat; delete mix.bat; }
      if (mix.titan && (P < 4 || frac < 0.5)) { mix.bug = (mix.bug || 0) + mix.titan; delete mix.titan; }
      for (const k in mix) { const n = Math.round((B * mix[k]) / THREAT[k]); if (n > 0) units.push([k, n]); }
      if (!units.length) units.push(['bug', Math.max(2, Math.round(B))]);
      return { units };
    },

    const rnd = CF.rng(st.seed), W = 2200, H = 1300, cy = 650, theme = ch.themes[(st.minorNo - 1) % ch.themes.length];
    const idx = (st.minorNo - 1) % ch.names.length;
    const cliffs = [];
    for (let i = 0; i < 4; i++) { const h = Math.round(220 + rnd() * 300), top = (i + Math.floor(rnd() * 2)) % 2 === 0; cliffs.push([Math.round(980 + i * 210 + rnd() * 50), top ? 0 : H - h, Math.round(90 + rnd() * 50), h]); }
    const air = theme === 'air';
    return {
      id: st.id, no: `${ch.no}-${st.i + 1}`, name: ch.names[idx], learn: ch.learn[idx], minor: true, chapter: ch.id, P: st.P, theme,
      brief: `第${'一二三四五六七'[ch.no - 1]}章 · 小关 ${st.minorNo}。乱码军团的「${Diff.THEME_NAME[theme]}」部队正在逼近。守住 3 波进攻即可获胜，可以反复挑战来积攒长期补给。`,
      tip: air ? '这一关以飞行敌人为主：炮塔、编码 Agent 和拦截无人机都能对空。' : '前两波很轻松，抓紧时间造矿机、攒经济；第 3 波才是真正的考验。',
      w: W, h: H, core: [300, cy], hero: [430, cy], cliffs,
      nodes: [['chip', 540, 470], ['chip', 540, 830], ['chip', 860, 650], ['corp', 380, 960], ['corp', 700, 260]],
      spawns: [[W - 40, Math.round(260 + rnd() * 200)], [W - 40, Math.round(840 + rnd() * 200)]],
      first: 35, gap: 32, waves: Diff.waves(st.P, 3, theme), hpMul: Diff.hpMul(st.P),
      objectives: [{ text: '守住 3 波进攻', test: (g) => g.wavesCleared() }],
      win: (g) => g.wavesCleared(),
      stars: [['获胜', () => true], ['主脑耐久 ≥ 60%', (g) => g.coreHpPct() >= 0.6], ['主脑耐久 ≥ 90%', (g) => g.coreHpPct() >= 0.9]],
      script: [[1, 'HERO', `「${ch.learn[idx]}」——这一关我们边打边学。`]],
      onEnd: (g, win, stars) => Ch.minorReward(ch, st, win, stars, g),
    };
  };

  // ================= 组队副本 =================
  Ch.dungeonUnlocked = (ch) => CF.P.trial() || Ch.cleared(ch.dungeon.after);
  Ch.attempts = function (ch) { const d = S().dungeon, r = d[ch.dungeon.id] || (d[ch.dungeon.id] = { date: '', used: 0, best: 0 }); if (r.date !== today()) { r.date = today(); r.used = 0; } return Ch.ATTEMPTS - r.used; };
  // ================= 章节掉落（v1）：每章固定一种碎片 / 道具 =================
  // 第一章 万象（GPT）· 第二章 火力发电厂 · 第三章 核能发电厂 · 第四章 X-S（Claude）· 第五章 鲸歌（DeepSeek）· 第六章 法宝锦囊 · 第七章 狂想（Grok）
  // 掉落量：小关首通 2（第一章第 3 个小关首通 3）、小关重复通关 25% 概率 1、次级关首通 3、组队副本第 5 波 3。已拥有的英雄碎片自动转化为晶片。
  Ch.fragName = (ch) => (ch.frag === 'pouch' ? '法宝锦囊' : CF.Collect.PLANTS[ch.frag] ? CF.Collect.PLANTS[ch.frag].name + ' 碎片' : CF.Heroes.get(ch.frag).name + ' 碎片');
  Ch.fragProgress = (ch) => (ch.frag === 'pouch' ? `持有 ${CF.Collect.pouches()} 个` : CF.Collect.PLANTS[ch.frag] ? (CF.Collect.owns(ch.frag) ? '已收藏' : `${CF.Collect.frags(ch.frag)}/${CF.Collect.NEED}`) : CF.Roster.ownsReal(ch.frag) ? '已拥有' : `${CF.Roster.frags(ch.frag)}/${CF.Roster.FRAG_NEED}`);
  Ch.drop = function (ch, n, lines) {
    if (!n || !ch.frag) return;
    const f = ch.frag;
    if (f === 'pouch') { CF.Collect.addPouch(n); lines.push(`法宝锦囊 ×${n}（去商城打开）`); return; }
    if (CF.Collect.PLANTS[f]) { lines.push(CF.Collect.addFrag(f, n)); return; }
    const h = CF.Heroes.get(f);
    if (CF.Roster.ownsReal(f)) { CF.City.add({ chip: 40 * n }); lines.push(`${h.name} 碎片 ×${n}（已拥有，转化为晶片 ${40 * n}）`); return; }
    CF.Roster.addFrag(f, n); lines.push(`${h.name} 碎片 ×${n}（${Math.min(CF.Roster.FRAG_NEED, CF.Roster.frags(f))}/${CF.Roster.FRAG_NEED}）`);
  };
  Ch.featured = (ch) => ch.frag;
  const DREWARD = [{ chip: 150 }, { corp: 120 }, { comp: 60 }, { boost: 1 }, { frag: 3 }];
  Ch.dungeonRewards = (ch) => DREWARD.map((r, i) => { const o = {}; for (const k in r) o[k] = k === 'frag' || k === 'boost' ? r[k] : r[k] * ch.no; o.wave = i + 1; return o; });
  Ch.rewardText = function (r, ch) {
    if (r.frag) return `${Ch.fragName(ch)} ×${r.frag}`;
    if (r.boost) return `学习加速 ×${r.boost}`;
    return Object.keys(r).filter((k) => k !== 'wave').map((k) => `${{ chip: '晶片', corp: '语料', comp: '算力' }[k]} ×${r[k]}`).join(' · ');
  };
  Ch.dungeonLevel = function (ch, team) {
    const P = ch.dungeon.P, rewards = Ch.dungeonRewards(ch);
    return {
      id: ch.dungeon.id, no: `${ch.no}-副本`, name: ch.dungeon.name, learn: '团队协作', dungeon: true, chapter: ch.id, P, team,
      brief: `组队副本：最多 3 位英雄并肩作战（队友由 AI 控制）。一共 5 波，比普通关略难；每守住一波都能拿到奖励，第 5 波是首领与英雄碎片。今天还能挑战 ${Ch.attempts(ch)} 次。`,
      tip: '队友会自动跟随主英雄并释放技能。先稳住前两波的经济，第 4、5 波敌人最多。',
      w: 2400, h: 1500, core: [300, 750], hero: [440, 750],
      cliffs: [[1150, 0, 140, 480], [1150, 1020, 140, 480], [1650, 380, 110, 260], [1650, 880, 110, 260]],
      nodes: [['chip', 540, 560], ['chip', 540, 940], ['chip', 880, 750], ['corp', 380, 1080], ['corp', 720, 380], ['corp', 380, 420]],
      spawns: [[2360, 400], [2360, 1100], [2360, 750]],
      first: 40, gap: 38, waves: Diff.waves(P, 5, 'mixed', ch.dungeon.boss), hpMul: Diff.hpMul(P),
      objectives: [{ text: '守住 5 波进攻（每波都有奖励）', test: (g) => g.wavesCleared() }, { text: '击败第 5 波首领', test: (g) => g.bossKilled(ch.dungeon.boss) }],
      win: (g) => g.wavesCleared(),
      stars: [['获胜', () => true], ['主脑耐久 ≥ 60%', (g) => g.coreHpPct() >= 0.6], ['没有英雄阵亡', (g) => !g.heroDeaths]],
      script: [[1, 'HERO', '组队副本开始。队友们，跟上我！'], [20, '侦察Agent', '每守住一波，补给就会送到主城仓库。']],
      onWaveClear: (g, n) => { const L = g.L; L._paid = L._paid || new Set(); if (L._paid.has(n)) return; L._paid.add(n); const r = rewards[n - 1]; if (r) Ch.grantDungeon(ch, r, g); },
      onEnd: (g, win) => { const d = S().dungeon[ch.dungeon.id]; d.best = Math.max(d.best || 0, g.clearedN || 0); if (win && !CF.P.trial()) [g.heroId].concat(team).forEach((id) => { if (id !== 'xs' && id !== CF.Roster.STARTER && CF.Roster.ownsReal(id)) CF.Treasure.grant(id); }); },

    else CF.City.add({ chip: r.chip || 0, corp: r.corp || 0, comp: r.comp || 0 });
    (g.waveRewards = g.waveRewards || []).push(`第 ${r.wave} 波：${txt}`);
    CF.Save.save(); CF.toast(`🎁 第 ${r.wave} 波奖励：${txt}`, 'gold', 2600); CF.Audio.sfx('unlock');

  // ================= 奖励 =================
  // 小关：长期消耗品（主城资源）；首通双倍 + 1 次学习加速；第 3 / 5 个小关首通赠送英雄
  Ch.minorReward = function (ch, st, win, stars, g) {
    if (!win) return;

    g.stageRewards = lines;

  Ch.storyReward = function (ch, st, win, g) {

    if (st.id === CHAPTERS[0].story[CHAPTERS[0].story.length - 1] && !CF.P.trial() && CF.Treasure.grant(CF.Roster.STARTER)) lines.push(`章节终章：获得${CF.Heroes.get(CF.Roster.STARTER).name}的法宝「${CF.Heroes.get(CF.Roster.STARTER).instrument}」`);
    g.stageRewards = lines;
  };
  // 给剧情关挂上章节信息与奖励回调
  Ch.storyLevel = function (ch, st) { return Object.assign({}, st.L, { no: `${ch.no}-${st.i + 1}`, story: true, chapter: ch.id, P: st.P, onEnd: (g, win) => Ch.storyReward(ch, st, win, g) }); };
  // 首领关（第三章起的次级关）：程序生成的 3 波关卡，第 3 波出首领，通关后不可重复
  Ch.bossLevel = function (ch, st) {
    const L = Ch.minorLevel(ch, Object.assign({}, st, { minorNo: st.i + 1 }));
    return Object.assign(L, { id: st.id, name: st.name, story: true, minor: false, waves: Diff.waves(st.P, 3, 'mixed', st.boss), brief: `第${'一二三四五六七'[ch.no - 1]}章 · 次级关「${st.name}」。前两波照常布防，第 3 波首领现身。通关后不可重复挑战。`, objectives: [{ text: '守住 3 波进攻', test: (g) => g.wavesCleared() }, { text: '击败首领', test: (g) => g.bossKilled(st.boss) }], onEnd: (g, win) => Ch.storyReward(ch, st, win, g) });
  };
  Ch.level = (ch, st) => (st.kind === 'story' ? Ch.storyLevel(ch, st) : st.kind === 'boss' ? Ch.bossLevel(ch, st) : Ch.minorLevel(ch, st));
  // 下一关（结算页「下一关」按钮）
  Ch.next = function (id) {
    const f = Ch.find(id); if (!f) return null;
    const list = Ch.stages(f.ch), nx = list[f.st.i + 1];
    if (nx) return Ch.unlocked(f.ch, nx) ? Ch.level(f.ch, nx) : null;
    const ch2 = CHAPTERS[f.ch.no]; if (!ch2) return null;
    const s0 = Ch.stages(ch2)[0]; return Ch.unlocked(ch2, s0) ? Ch.level(ch2, s0) : null;
  };
  // 第几个小关（结算页、教程等引用）
  Ch.progress = function () { let won = 0, total = 0; CHAPTERS.forEach((ch) => Ch.stages(ch).forEach((s) => { total++; if (Ch.cleared(s.id)) won++; })); return { won, total }; };
})();

    else if (u.type === 'golem') { ctx.fillStyle = c; ctx.fillRect(-r, -r, r * 2, r * 2); ctx.fillStyle = '#5b5040'; ctx.fillRect(-r * 0.6, -r * 0.4, r * 1.2, r * 0.3); ctx.fillStyle = '#ffe08a'; ctx.fillRect(-r * 0.4, -r * 0.6, 4, 4); ctx.fillRect(r * 0.2, -r * 0.6, 4, 4); }
    else if (u.type === 'oracle') { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, -r * 1.4); ctx.lineTo(r, r); ctx.lineTo(-r, r); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#e6fdff'; ctx.fillRect(-2, -r * 0.4, 4, 4); }
    else { ctx.fillStyle = c; ctx.fillRect(-r, -r * 0.8, r * 2, r * 1.6); ctx.fillStyle = '#1b1226'; ctx.fillRect(-4, -3, 2, 2); ctx.fillRect(3, -3, 2, 2); }
    if (u.sleep) { ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.fillText('z', r * 0.6, -r - 4 - Math.sin(t * 2) * 3); ctx.fillText('z', r, -r - 12 - Math.sin(t * 2 + 1) * 3); }
  };
  const drawFoe0 = proto.drawFoe;
  proto.drawFoe = function (ctx, u, x, y, r, t, fl) {
    if (u.type === 'phantom') {
      ctx.translate(x, y); ctx.globalAlpha *= 0.85 + 0.15 * Math.sin(t * 6);
      ctx.fillStyle = fl ? '#fff' : '#2a0b1e'; ctx.beginPath(); ctx.arc(0, -4, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ff4f9a'; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = '#29e0e0'; ctx.fillRect(-7, -8, 4, 4); ctx.fillRect(3, -8, 4, 4);
      for (let i = 0; i < 5; i++) { const a = t * 2 + i * 1.26; ctx.fillStyle = i % 2 ? '#ff4f9a' : '#29e0e0'; ctx.fillRect(Math.cos(a) * (r + 6) - 2, Math.sin(a) * (r + 6) - 6, 4, 4); }
      ctx.globalAlpha = 1; ctx.fillStyle = '#ff4f9a'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`幻觉之主 Lv${u.lv || 1}`, 0, -r - 14); ctx.textAlign = 'left';
      return;
    }
    drawFoe0.call(this, ctx, u, x, y, r, t, fl);
  };

  // ---------- HUD：物品栏与加点 ----------
  proto.imHud = function () {
    const g = this, bar = CF.$('#itemBar');
    if (!g.L.immersive) { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    const sig = g.items.join(',') + '|' + g.skillPts + '|' + g.heroLv;
    if (bar._sig === sig) return; bar._sig = sig;
    bar.innerHTML = '';
    for (let i = 0; i < 4; i++) { const k = g.items[i]; const b = CF.h(`<button class="glass item" title="${k ? ITEMS[k].n + '：' + ITEMS[k].d : '空物品栏'}">${k ? ITEMS[k].ic : ''}${k && ITEMS[k].use ? '<i>用</i>' : ''}</button>`); b.onclick = () => g.useItem(i); bar.appendChild(b); }
    if (g.skillPts > 0) ['Q', 'W', 'R'].forEach((k) => { const b = CF.h(`<button class="glass item" style="color:var(--hero2);font-weight:900;width:auto;padding:0 6px;white-space:nowrap" title="升级 ${k} 技能">＋${k}</button>`); b.onclick = () => { g.learnSkill(k); bar._sig = ''; g.imHud(); }; bar.appendChild(b); });
  };
})();

</script>
<script>
/* js/ui.js */
/* 界面：页面切换、征程、设置、战斗 HUD（四角极简）与点击化输入、结算
 * 战斗 UI 规则：art/02-game-ui-constitution.md 第 6 章（UI 占比 ≤ 18%，战斗不遮挡） */
(function () {
  const CF = window.CF;
  const $ = CF.$;
  const UI = (CF.UI = { cur: 'lobby', selDirty: true, touch: false, keys: new Set() });
  const MUSIC = { lobby: 'menu', heroes: 'menu', hero: 'menu', campaign: 'menu', achievements: 'menu', settings: 'menu', help: 'menu', academy: 'academy', profile: 'academy', labs: 'lab', battle: 'battle', quick: 'quick', city: 'city' };
  UI.MUSIC = MUSIC;

  // ================= 页面切换 =================
  UI.show = function (name, arg) {
    if (name !== 'hero' && CF.Audio.mute) CF.Audio.mute.clear(); // 离开英雄档案时恢复合奏的全部声部
    if (UI.cur === 'battle' && name !== 'battle') UI.leaveBattle();
    if (UI.cur === 'quick' && name !== 'quick' && CF.Quick) CF.Quick.stop();
    if (UI.cur === 'city' && name !== 'city' && CF.City) CF.City.leave();
    if (UI.cur !== name) CF.PixelFX.wipe();
    CF.$$('.screen').forEach((s) => s.classList.toggle('active', s.id === 'scr-' + name));
    UI.cur = name;
    if (name !== 'hero') CF.Audio.play(MUSIC[name] || 'menu');
    const R = { lobby: () => CF.Lobby.render(), heroes: () => CF.Lobby.renderHeroes(), hero: () => CF.Lobby.renderHero(arg), campaign: UI.renderCampaign, academy: () => CF.Academy.render(), labs: () => CF.Academy.renderLabs(), profile: () => CF.Academy.renderProfile(), achievements: () => CF.Academy.renderAch(), settings: UI.renderSettings, shop: () => CF.Shop.render(), help: () => CF.Tutorial.renderHelp(), city: () => CF.City.enter() };
    (R[name] || (() => {}))();
    UI.checkRotate();
  };
  CF.bus.on('modal:closed', () => {
    if (UI.cur === 'battle' || UI.cur === 'quick') return;
    setTimeout(() => {
      if (CF.modal.isOpen()) return;
      if (UI.cur !== 'hero') CF.Audio.play(MUSIC[UI.cur] || 'menu');
      ({ labs: () => CF.Academy.renderLabs(), academy: () => CF.Academy.render(), profile: () => CF.Academy.renderProfile(), campaign: UI.renderCampaign, lobby: () => CF.Lobby.render() }[UI.cur] || (() => {}))();
    }, 30);
  });
  UI.initUltrabars = function () {
    CF.$$('.ultrabar').forEach((bar) => {
      bar.innerHTML = `<canvas></canvas><button class="back" title="返回">←</button><div class="ub-title">${bar.dataset.title}<span class="ub-sub">${bar.dataset.sub || ''}</span></div><div class="ub-right"></div>`;
      bar._stage = new CF.PixelFX.Stage(bar.querySelector('canvas'), { mode: 'bar', fx: 0.9, fy: 0.55, cell: 12 });
      bar.querySelector('.back').onclick = () => { CF.Audio.sfx('click'); UI.show(bar.dataset.back || 'lobby'); };
    });
  };
  UI.heroName = () => CF.Heroes.current().name;
  // 安卓返回键 / 浏览器后退：关弹窗 → 战斗与快速模式先暂停 → 子页面回到上一页 → 大厅返回 'exit'
  UI.back = function () {
    if (CF.modal.isOpen()) { CF.modal.close(); return 'ok'; }
    if (UI.cur === 'battle') { UI.battleMenu(); return 'ok'; }
    if (UI.cur === 'quick') { CF.Quick.pause(); return 'ok'; }
    if (UI.cur === 'lobby') return 'exit';
    const bar = document.querySelector(`#scr-${UI.cur} .ultrabar`);
    UI.show((bar && bar.dataset.back) || 'lobby');
    return 'ok';
  };

  // ================= 征程：两大章（普通关 = 次级关 + 小关）+ 组队副本 =================
  const tierPill = (P) => { const [n, c] = CF.Chapters.Diff.tier(P); return `<span class="dpill" style="--dc:${c}">D${Math.round(P)} · ${n}</span>`; };
  UI.renderCampaign = function () {
