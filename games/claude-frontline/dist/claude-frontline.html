<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Claude战线 · 造物者之路</title>
<style>
/* Claude战线 · 造物者之路 —— 样式 */
:root{
  --bg:#0b0a12; --bg2:#110f1b; --panel:#161325; --panel2:#1d1930; --line:#2b2641; --line2:#3a3357;
  --text:#ede6d6; --dim:#9d96ad; --mute:#6c6680;
  --orange:#d97757; --orange2:#f0936f; --gold:#e9b949; --cyan:#3fd0c9; --violet:#9b7bff;
  --pdeep:#241650; --purple:#5b3aa8; --plight:#a99be0;
  --pink:#ff4f9a; --ecyan:#29e0e0; --good:#6fdc8c; --bad:#ff5d6c;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
textarea,input[type=text]{-webkit-user-select:text;user-select:text;touch-action:auto}
.mono{font-family:var(--mono)}
.hidden{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#app.rotated{width:100vh;height:100vw;inset:auto;left:0;top:0;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}

/* ---------- 通用屏幕 ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.active{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.scr-body{flex:1;min-height:0;padding:16px;max-width:1100px;width:100%;margin:0 auto}

/* 紫色像素「Ultra」条 —— 来自参考视频 */
.ultrabar{position:relative;height:64px;margin:12px 16px 0;border-radius:14px;overflow:hidden;flex:none;
  background:linear-gradient(90deg,#2a1a5a,#3b2685 70%,#5a3cb0)}
.ultrabar canvas{position:absolute;inset:0;width:100%;height:100%}
.ultrabar .ub-title{position:absolute;left:56px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 8px #0008}
.ultrabar .ub-sub{font-size:12px;font-weight:400;color:#d7cff5;opacity:.85;margin-left:10px;letter-spacing:0}
.ultrabar .back{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:10px;font-size:22px;color:#fff;background:#0003}
.ultrabar .back:hover{background:#0006}
.ultrabar .ub-right{position:absolute;right:120px;top:50%;transform:translateY(-50%);display:flex;gap:8px;align-items:center}

/* 品牌 */
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:1px;white-space:nowrap}
.brand b{color:var(--orange)}
.spark{width:18px;height:18px;display:inline-block;flex:none;animation:spin 8s linear infinite;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g fill='%23d97757'><rect x='11' y='1.5' width='2' height='10.5' rx='1' transform='rotate(0 12 12)'/><rect x='11' y='4.5' width='2' height='7.5' rx='1' transform='rotate(30 12 12)'/><rect x='11' y='1.5' width='2' height='10.5' rx='1' transform='rotate(60 12 12)'/><rect x='11' y='4.5' width='2' height='7.5' rx='1' transform='rotate(90 12 12)'/><rect x='11' y='1.5' width='2' height='10.5' rx='1' transform='rotate(120 12 12)'/><rect x='11' y='4.5' width='2' height='7.5' rx='1' transform='rotate(150 12 12)'/><rect x='11' y='1.5' width='2' height='10.5' rx='1' transform='rotate(180 12 12)'/><rect x='11' y='4.5' width='2' height='7.5' rx='1' transform='rotate(210 12 12)'/><rect x='11' y='1.5' width='2' height='10.5' rx='1' transform='rotate(240 12 12)'/><rect x='11' y='4.5' width='2' height='7.5' rx='1' transform='rotate(270 12 12)'/><rect x='11' y='1.5' width='2' height='10.5' rx='1' transform='rotate(300 12 12)'/><rect x='11' y='4.5' width='2' height='7.5' rx='1' transform='rotate(330 12 12)'/><circle cx='12' cy='12' r='2.2'/></g></svg>") center/contain no-repeat}
@keyframes spin{to{transform:rotate(360deg)}}
.diamond{width:9px;height:9px;display:inline-block;transform:rotate(45deg);animation:dspin 3s linear infinite;flex:none}
@keyframes dspin{0%{transform:rotate(45deg) scale(1)}50%{transform:rotate(225deg) scale(.75)}100%{transform:rotate(405deg) scale(1)}}
.c-chip{color:var(--gold)} .c-corp{color:var(--cyan)} .c-comp{color:var(--violet)}
.bg-chip{background:var(--gold)} .bg-corp{background:var(--cyan)} .bg-comp{background:var(--violet)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--plight);background:#262043}
.btn.primary{background:linear-gradient(180deg,#e58663,#c9643f);border-color:#f0936f;color:#fff;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.violet{background:linear-gradient(180deg,#6d4cc8,#4b2f99);border-color:#8f74e0;color:#fff;font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;background:#ffffff10;border:1px solid #ffffff1a;white-space:nowrap}
.pill.k{color:var(--cyan);border-color:#3fd0c955;background:#3fd0c914}
.pill.p{color:var(--orange2);border-color:#d9775766;background:#d9775718}
.pill.warn{color:#3a2a08;background:#f5d79a;border-color:#f5d79a}
.tag{font-size:11px;color:var(--dim)}

/* 卡片 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{font-size:15px;margin-bottom:6px}
.card p{font-size:13px;color:var(--dim);line-height:1.6}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--dim)}
.small{font-size:12px}
.sec-title{font-size:13px;color:var(--dim);letter-spacing:2px;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* 进度条 */
.bar{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--orange)}

/* ---------- 主菜单 ---------- */
#scr-menu{background:#140c2c}
#scr-menu canvas.stage-bg{position:absolute;inset:0;width:100%;height:100%}
.menu-wrap{position:relative;z-index:2;padding:6vh 0 0 6vw;display:flex;flex-direction:column;height:100%;width:min(560px,92vw)}
.menu-wrap .brand.big{font-size:44px;gap:14px;text-shadow:0 4px 24px #0009}
.menu-wrap .brand.big .spark{width:40px;height:40px}
.tagline{margin:6px 0 18px 2px;color:#d6ccf7;font-size:15px;letter-spacing:2px;text-shadow:0 2px 10px #000a}
.menu-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-bottom:16px;touch-action:pan-y}
.mbar{position:relative;height:54px;border-radius:13px;overflow:hidden;text-align:left;padding-left:20px;font-size:17px;font-weight:600;
  background:#ffffffd9;color:#1e1636;box-shadow:0 6px 20px #0004;transition:transform .15s;flex:none}
.mbar canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .2s}
.mbar span{position:relative;z-index:1}
.mbar small{position:relative;z-index:1;font-size:12px;font-weight:400;margin-left:10px;opacity:.65}
.mbar.on{color:#fff}
.mbar.on canvas{opacity:1}
.mbar:active{transform:scale(.985)}
.menu-profile{position:absolute;right:18px;top:16px;z-index:3;background:#0d0a1cbb;border:1px solid #ffffff1f;border-radius:12px;padding:10px 14px;min-width:220px;backdrop-filter:blur(6px);font-size:12px}
.menu-profile .rk{font-size:15px;font-weight:700;color:var(--gold)}
.menu-foot{position:absolute;right:18px;bottom:12px;z-index:3;font-size:11px;color:#cfc6ef99}

/* ---------- 战役 ---------- */
.levels{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.lvl{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;min-height:150px;display:flex;flex-direction:column}
.lvl:hover{border-color:var(--plight);transform:translateY(-2px)}
.lvl .no{font-family:var(--mono);color:var(--orange);font-size:12px}
.lvl h3{font-size:17px;margin:4px 0 6px}
.lvl p{font-size:12px;color:var(--dim);line-height:1.6;flex:1}
.lvl .stars{color:var(--gold);letter-spacing:2px;font-size:16px}
.lvl.locked{opacity:.55}
.lvl .req{font-size:11px;color:var(--pink);margin-top:6px;line-height:1.5}
.lvl .req.ok{color:var(--good)}

/* ---------- 学院 ---------- */
.tabs{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;flex:none;touch-action:pan-x}
.tab{padding:8px 14px;border-radius:9px 9px 0 0;font-size:14px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-color:var(--orange);background:#ffffff08}
.ratio{display:flex;align-items:center;gap:10px;font-size:12px}
.ratio .rbar{flex:1;height:12px;border-radius:99px;overflow:hidden;display:flex;position:relative;background:#ffffff10;min-width:120px}
.ratio .rbar .k{background:var(--cyan)} .ratio .rbar .p{background:var(--orange)}
.ratio .rbar .mark{position:absolute;left:30%;top:-3px;bottom:-3px;width:2px;background:#fff}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.task .ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:18px;flex:none;background:#ffffff0d}
.task .bd{flex:1;min-width:0}
.task h4{font-size:14px;margin-bottom:3px}
.task p{font-size:12px;color:var(--dim);line-height:1.6}
.task.done{opacity:.6}
.task.done h4::after{content:" ✓";color:var(--good)}
.quiz-q{font-size:17px;line-height:1.6;margin:8px 0 14px}
.quiz-opts{display:grid;gap:8px}
.quiz-opt{text-align:left;padding:12px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);font-size:14px;line-height:1.5}
.quiz-opt:hover{border-color:var(--plight)}
.quiz-opt.right{border-color:var(--good);background:#6fdc8c1f}
.quiz-opt.wrong{border-color:var(--bad);background:#ff5d6c1a}
.explain{margin-top:12px;padding:12px;border-radius:10px;background:#9b7bff14;border:1px solid #9b7bff44;font-size:13px;line-height:1.7}
.journal-item{border-left:3px solid var(--orange);padding:6px 10px;margin-bottom:8px;background:#ffffff06;border-radius:0 8px 8px 0}
.journal-item .d{font-size:11px;color:var(--mute);font-family:var(--mono)}
textarea.note{width:100%;min-height:80px;background:#0d0b16;border:1px solid var(--line2);border-radius:9px;padding:10px;resize:vertical;font-size:14px;line-height:1.5}
.road-stage{border-left:2px solid var(--line2);margin-left:10px;padding:0 0 14px 18px;position:relative}
.road-stage::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:3px;background:var(--orange);transform:rotate(45deg)}
.road-stage h4{font-size:15px;margin-bottom:4px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:5px 0;color:var(--dim);cursor:pointer;line-height:1.5}
.check input{margin-top:3px;accent-color:var(--orange);width:16px;height:16px;flex:none}
.check.on{color:var(--text)}

/* ---------- 实验室 ---------- */
.labcard{cursor:pointer;transition:.15s;position:relative}
.labcard:hover{border-color:var(--plight);transform:translateY(-2px)}
.labcard .dom{font-size:11px;font-family:var(--mono);color:var(--orange)}
.labcard .st{position:absolute;right:12px;top:12px;color:var(--gold);font-size:14px;letter-spacing:1px}
.lab{display:flex;flex-direction:column;gap:10px;height:100%}
.lab-main{display:flex;gap:14px;flex:1;min-height:0;flex-wrap:wrap}
.lab-cv{flex:1 1 380px;min-height:240px;background:#0d0b16;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
.lab-cv canvas{position:absolute;inset:0;width:100%;height:100%}
.lab-side{flex:0 1 300px;display:flex;flex-direction:column;gap:10px;min-width:240px}
.slider{display:flex;flex-direction:column;gap:4px;font-size:13px}
.slider .row{justify-content:space-between}
.slider b{font-family:var(--mono);color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--orange);touch-action:pan-x;height:24px}
.lab-msg{font-size:13px;line-height:1.6;padding:10px;border-radius:9px;background:#ffffff08;border:1px solid var(--line)}
.lab-msg.ok{border-color:var(--good);background:#6fdc8c14}
.lab-msg.bad{border-color:var(--bad);background:#ff5d6c12}
.prog-list{display:flex;flex-wrap:wrap;gap:4px;min-height:34px;padding:6px;border-radius:8px;background:#0d0b16;border:1px dashed var(--line2)}
.prog-list .op{font-family:var(--mono);font-size:12px;padding:3px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2)}
.prog-list .op.cur{border-color:var(--orange);color:var(--orange2)}
.code{width:100%;min-height:190px;font-family:var(--mono);font-size:13px;line-height:1.55;background:#0a0912;color:#e7e1ff;border:1px solid var(--line2);border-radius:9px;padding:10px;resize:vertical;tab-size:2;white-space:pre}
.testlog{font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;max-height:180px;overflow:auto}
.pix-grid{display:grid;grid-template-columns:repeat(16,1fr);width:min(100%,360px);aspect-ratio:1;border:1px solid var(--line2);touch-action:none;background:repeating-conic-gradient(#1a1729 0 25%,#13111f 0 50%) 0 0/12.5% 12.5%}
.pix-grid div{border:1px solid #ffffff08}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:28px;height:28px;border-radius:7px;border:2px solid transparent}
.swatch.on{border-color:#fff}

/* ---------- 档案 ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .v{font-size:24px;font-weight:800;font-family:var(--mono)}
.kpi .l{font-size:12px;color:var(--dim)}
.ach{display:flex;gap:12px;align-items:center}
.ach .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:#ffffff0a;flex:none;filter:grayscale(1);opacity:.5}
.ach.got .ic{filter:none;opacity:1;background:#e9b9491f;box-shadow:inset 0 0 0 1px #e9b94966}
.ach h4{font-size:14px}
.ach p{font-size:12px;color:var(--dim)}

/* ---------- 设置 ---------- */
.set-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row .nm{width:110px;font-size:14px}
.set-row .ctl{flex:1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:200px}
.set-row .ctl input[type=range]{flex:1;width:auto;min-width:120px}
.set-row select{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;font-size:12px}
.set-row .src{font-size:11px;color:var(--dim);font-family:var(--mono);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 弹窗 ---------- */
.modal{position:absolute;inset:0;z-index:50;background:#05040acc;display:flex;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(3px)}
.modal-card{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px #000a;overflow:hidden}
.modal-card.wide{width:min(1100px,100%);height:100%}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.modal-head h3{flex:1;font-size:16px}
.modal-body{padding:16px;overflow:auto;flex:1;min-height:0;touch-action:pan-y}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.x{width:34px;height:34px;border-radius:8px;font-size:18px;color:var(--dim)}
.x:hover{background:#ffffff10;color:var(--text)}

/* toast */
#toastHost{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{padding:8px 16px;border-radius:99px;background:#1d1930f2;border:1px solid var(--line2);font-size:13px;box-shadow:0 6px 20px #0008;animation:tin .25s ease-out;white-space:nowrap}
.toast.good{border-color:var(--good)} .toast.bad{border-color:var(--bad)} .toast.gold{border-color:var(--gold);color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

/* ---------- 战斗 ---------- */
#scr-battle{background:#07060c}
#hud-top{height:44px;flex:none;display:flex;align-items:center;gap:14px;padding:0 10px;background:linear-gradient(180deg,#14112a,#0e0c1a);border-bottom:1px solid var(--line);font-size:13px;z-index:5}
#hud-top .brand{font-size:15px}
.res{display:flex;gap:12px;font-family:var(--mono)}
.res .r{display:flex;align-items:center;gap:6px}
.res .r b{font-size:14px;min-width:34px}
.res .r i{font-style:normal;font-size:10px;color:var(--dim)}
.wave{display:flex;align-items:center;gap:8px;margin:0 auto;font-family:var(--mono)}
.wave .wn{font-size:15px;font-weight:800}
.wave .cd{color:var(--dim)}
.cores{display:flex;gap:10px;align-items:center;font-size:11px}
.corebar{width:92px}
.corebar .bar{height:7px}
.corebar.mine .bar>i{background:var(--orange)}
.corebar.foe .bar>i{background:linear-gradient(90deg,var(--pink),var(--ecyan))}
.hud-ctl{display:flex;gap:4px}
.hud-ctl button{width:34px;height:30px;border-radius:7px;background:#ffffff0a;border:1px solid var(--line);font-size:13px;font-family:var(--mono)}
.hud-ctl button:hover{border-color:var(--plight)}
#field{position:relative;flex:1;min-height:0;overflow:hidden}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
.obj{position:absolute;left:10px;top:10px;max-width:min(360px,60%);background:#0e0c1ad9;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;cursor:pointer;z-index:3}
.obj .ol{display:flex;gap:6px;line-height:1.6}
.obj .ol.done{color:var(--good)}
.obj .ol.done::before{content:"✓"}
.obj .ol:not(.done)::before{content:"◇";color:var(--orange)}
.obj.collapsed .ol:not(:first-of-type){display:none}
.comms{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;align-items:center;max-width:min(460px,70%);background:#120d26e6;border:1px solid #5b3aa8;border-radius:12px;padding:8px 12px 8px 8px;z-index:3;transition:opacity .3s}
.comms canvas{width:56px;height:56px;border-radius:9px;flex:none}
.comms .who{font-size:11px;color:var(--plight)}
.comms .say{font-size:13px;line-height:1.5}
.bossbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(420px,50%);z-index:3;text-align:center;font-size:12px;color:var(--pink)}
.bossbar .bar{height:9px;margin-top:3px;border:1px solid #ff4f9a66}
.bossbar .bar>i{background:linear-gradient(90deg,var(--pink),var(--ecyan))}
.fab{position:absolute;right:10px;z-index:4;width:58px;height:44px;border-radius:12px;background:#1d1930e6;border:1px solid var(--line2);font-size:12px}
.fab.on{border-color:var(--orange);color:var(--orange2)}
.confirm{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;display:flex;gap:8px;background:#0e0c1af2;border:1px solid var(--line2);border-radius:12px;padding:6px}
.pausebadge{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:28px;font-weight:800;letter-spacing:8px;color:#fff;text-shadow:0 0 20px #9b7bff;z-index:3;pointer-events:none}
#deck{height:150px;flex:none;display:flex;gap:8px;padding:8px;background:linear-gradient(0deg,#14112a,#0e0c1a);border-top:1px solid var(--line);z-index:5}
.mm{height:100%;aspect-ratio:1.6;position:relative;flex:none;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#06050b}
.mm canvas{width:100%;height:100%;display:block;touch-action:none}
.mm .legend{position:absolute;left:4px;bottom:2px;font-size:9px;display:flex;gap:6px;color:var(--dim);pointer-events:none}
.mm .legend i{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:2px}
.info{flex:1;min-width:0;background:#ffffff05;border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.info .nm{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center}
.info .ds{font-size:12px;color:var(--dim);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.info .tags{display:flex;gap:4px;flex-wrap:wrap}
.info .queue{display:flex;gap:4px;align-items:center;font-size:11px}
.info .queue .qi{width:26px;height:26px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;position:relative;overflow:hidden;font-size:10px}
.info .queue .qi i{position:absolute;left:0;bottom:0;height:3px;background:var(--orange)}
.info .hpb{height:6px}
.info .hpb>i{background:var(--good)}
.cmds{width:min(470px,46%);flex:none;display:flex;flex-direction:column;gap:5px}
.cmd-tabs{display:flex;gap:4px}
.cmd-tabs button{flex:1;padding:3px;font-size:12px;border-radius:6px;color:var(--dim);background:#ffffff06;border:1px solid transparent}
.cmd-tabs button.on{color:var(--text);border-color:var(--line2);background:#ffffff10}
.cmd-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:5px;min-height:0}
.cb{position:relative;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;line-height:1.2;overflow:hidden;padding:2px}
.cb:hover{border-color:var(--plight)}

.cb canvas{width:26px;height:26px}

<script>
/* js/config.js */
/*
 * ======================== 你可以改的配置 ========================
 *
 * 背景音乐（BGM）
 *   每个页面都有一首默认的「程序生成吉他曲」。想换成你自己的音乐，有两种方法：
 *
 *   方法 A（最简单）：进游戏 → 设置 → 背景音乐 → 对应页面点「上传」，选一个 mp3/ogg/wav 文件。
 *                    文件保存在浏览器本地，下次打开仍然有效。
 *
 *   方法 B（适合打包分享）：把音乐文件放进 music/ 文件夹，然后在下面填路径，例如
 *                    menu: { file: 'music/menu.mp3', bpm: 96 }
 *                    bpm 是这首歌的每分钟拍数，用来让紫色像素动效跟着节拍跳（不填默认 100）。
 *
 *   优先级：设置里上传的文件 > 这里填的文件 > 程序生成吉他曲
 */
window.CF_CONFIG = {
  bgm: {
    menu:     { file: '', bpm: 96 },   // 主菜单 / 征程 / 成就 / 设置
    academy:  { file: '', bpm: 84 },   // 学院 / 成长档案
    lab:      { file: '', bpm: 100 },  // 实验室
    battle:   { file: '', bpm: 128 },  // 战斗
    boss:     { file: '', bpm: 144 },  // Boss 出现时
    victory:  { file: '', bpm: 120 },  // 胜利结算
    defeat:   { file: '', bpm: 72 },   // 失败结算
  },
  // 默认音量（0~1），玩家在设置里改过后以设置为准
  volume: { master: 0.8, music: 0.55, sfx: 0.7 },
};

</script>
<script>
/* js/core.js */
/* 核心工具：DOM、数学、事件、存档、提示、弹窗 */
(function () {
  const CF = (window.CF = window.CF || {});

  // ---------- DOM ----------
  CF.$ = (s, r = document) => r.querySelector(s);
  CF.$$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  CF.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  CF.h = function (html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };

  // ---------- 数学 ----------
  CF.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  CF.lerp = (a, b, t) => a + (b - a) * t;
  CF.rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  CF.randi = (a, b) => Math.floor(CF.rand(a, b + 1));
  CF.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  CF.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  CF.dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  CF.rng = function (seed) { // mulberry32
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  CF.hashStr = (str) => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  CF.today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  CF.dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  CF.fmtTime = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  CF.fmtNum = (n) => (n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(Math.floor(n)));

  // ---------- 事件 ----------
  const handlers = {};
  CF.bus = {
    on(ev, fn) { (handlers[ev] = handlers[ev] || []).push(fn); },
    off(ev, fn) { handlers[ev] = (handlers[ev] || []).filter((f) => f !== fn); },
    emit(ev, data) { (handlers[ev] || []).slice().forEach((f) => { try { f(data); } catch (e) { console.error(e); } }); },
  };

  // ---------- 存档 ----------
  const KEY = 'cf_save_v1';
  function defaults() {
    return {
      version: 1,
      created: CF.today(),
      xp: { knowledge: 0, practice: 0 },
      dims: { de: 0, zhi: 0, ti: 0, mei: 0, shi: 0, qi: 0 },
      domains: { ai: 0, emb: 0, aero: 0, biz: 0 },
      founder: { fp: 0, long: 0, grit: 0, exec: 0, mission: 0, lead: 0 },
      quiz: { seen: {}, correct: 0, wrong: 0 },
      labs: {},
      code: {},
      quests: { log: [] },
      scenarios: {},
      roadmap: {},
      daily: { date: '', items: [], done: [] },
      streak: { count: 0, last: '', best: 0 },
      campaign: {},
      skirmish: { easy: 0, normal: 0, hard: 0 },
      achievements: {},
      stats: { riffs: 0, kills: 0, battles: 0, wins: 0, playSec: 0 },
      avatar: null,
      settings: { master: CF_CONFIG.volume.master, music: CF_CONFIG.volume.music, sfx: CF_CONFIG.volume.sfx, trial: false, quality: 'high', bgmStyle: {}, bgmBpm: {}, rotateChoice: '' },
    };
  }
  function merge(base, over) {
    if (!over || typeof over !== 'object' || Array.isArray(over)) return over === undefined ? base : over;
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    for (const k in over) out[k] = base && typeof base[k] === 'object' && base[k] !== null && !Array.isArray(base[k]) ? merge(base[k], over[k]) : over[k];
    return out;
  }
  CF.Save = {
    data: defaults(),
    load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) this.data = merge(defaults(), JSON.parse(raw));
      } catch (e) { console.warn('读取存档失败', e); }
      return this.data;
    },
    save() {
      try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { /* 隐私模式等 */ }
    },
    reset() { this.data = defaults(); this.save(); },
    exportText() { return JSON.stringify(this.data, null, 1); },
    importText(txt) {
      const obj = JSON.parse(txt);
      if (!obj || obj.version !== 1) throw new Error('不是有效的 Claude战线 存档');
      this.data = merge(defaults(), obj);
      this.save();
    },
  };

  // ---------- 提示 ----------
  CF.toast = function (msg, type = '', ms = 2200) {
    const host = CF.$('#toastHost');
    if (Array.from(host.children).some((c) => c.textContent === msg && c.style.opacity !== '0')) return;
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    host.appendChild(t);
    while (host.children.length > 3) host.firstChild.remove();
    setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, ms);
  };

  // ---------- 弹窗 ----------
  let onCloseFn = null;
  CF.modal = {
    isOpen: () => !CF.$('#modal').classList.contains('hidden'),
    open({ title = '', body = '', foot = null, wide = false, onClose = null, closable = true }) {
      const card = CF.$('#modalCard');
      card.className = 'modal-card' + (wide ? ' wide' : '');
      card.innerHTML = `<div class="modal-head"><h3>${title}</h3>${closable ? '<button class="x" data-x>✕</button>' : ''}</div><div class="modal-body"></div>`;
      const bd = card.querySelector('.modal-body');
      if (typeof body === 'string') bd.innerHTML = body; else if (body) bd.appendChild(body);
      if (foot && foot.length) {
        const f = document.createElement('div');
        f.className = 'modal-foot';
        foot.forEach((b) => {
          const btn = document.createElement('button');
          btn.className = 'btn ' + (b.cls || '');
          btn.innerHTML = b.text;
          btn.onclick = () => { CF.Audio && CF.Audio.sfx('click'); b.onClick ? b.onClick(btn) : CF.modal.close(); };
          f.appendChild(btn);
        });
        card.appendChild(f);
      }
      const x = card.querySelector('[data-x]');
      if (x) x.onclick = () => { CF.Audio && CF.Audio.sfx('click'); CF.modal.close(); };
      onCloseFn = onClose;
      CF.$('#modal').classList.remove('hidden');
      return bd;
    },
    close() {
      if (!CF.modal.isOpen()) return;
      CF.$('#modal').classList.add('hidden');
      CF.$('#modalCard').innerHTML = '';
      const fn = onCloseFn; onCloseFn = null;
      CF.bus.emit('modal:closed');
      if (fn) fn();
    },
  };

  // ---------- 横屏旋转时的坐标换算 ----------
  CF.rotated = () => document.getElementById('app').classList.contains('rotated');
  // 把屏幕坐标转为 #app 内的坐标
  CF.appPoint = function (cx, cy) {
    if (CF.rotated()) return { x: cy, y: window.innerWidth - cx };
    return { x: cx, y: cy };
  };
  // 元素在 #app 内的矩形（未旋转坐标系）
  CF.appRect = function (el) {
    const r = el.getBoundingClientRect();
    if (!CF.rotated()) return r;
    return { left: r.top, top: window.innerWidth - r.right, width: r.height, height: r.width };
  };
})();

</script>
<script>
/* js/audio.js */
/* 音频引擎：程序生成吉他 BGM（Karplus-Strong 拨弦）、每页面独立曲目、自定义上传、音效、节拍事件 */
(function () {
  const CF = window.CF;

      if (C.analyser) {
        C.analyser.getByteFrequencyData(C.data);
        let e = 0; for (let i = 1; i < 12; i++) e += C.data[i];
        e /= 11 * 255;
        C.avg = C.avg * 0.94 + e * 0.06;
        if (e > C.avg * 1.25 && e > 0.25 && now - C.lastOnset > 0.2) { C.lastOnset = now; out.push({ t: now, s: CF.clamp((e / Math.max(C.avg, 0.01) - 1) * 2, 0.35, 1), strum: true }); }
      }
      return out;
    }
    // 没有声音时，用内部时钟保持动画律动
    const tnow = performance.now() / 1000, bpm = A.curBpm || 100, q = 60 / bpm;
    if (!A.fallbackNext || tnow - A.fallbackNext > 2) A.fallbackNext = tnow;
    while (A.fallbackNext <= tnow) { out.push({ t: A.fallbackNext, s: A.fallbackStep % 4 === 0 ? 1 : 0.5, strum: true }); A.fallbackStep++; A.fallbackNext += q; }
    return out;
  };

  // ---------- 音效 ----------
  const lastSfx = {};
  A.sfx = function (name, vol = 1) {
    if (!A.ctx || A.ctx.state !== 'running') return;
    const ctx = A.ctx, t = ctx.currentTime + 0.005, d = A.sfxBus;
    const now = performance.now();
    const gap = { shoot: 45, hit: 40, boom: 70, laser: 60, hover: 40 }[name] || 0;
    if (gap && now - (lastSfx[name] || 0) < gap) return;
    lastSfx[name] = now;
    switch (name) {
      case 'click': osc('sine', 900, 650, t, 0.06, 0.25 * vol, d); break;
      case 'hover': osc('sine', 1300, 1200, t, 0.025, 0.06 * vol, d); break;
      case 'place': osc('square', 330, 660, t, 0.1, 0.12 * vol, d, { lp: 2000 }); osc('square', 660, 990, t + 0.08, 0.1, 0.1 * vol, d, { lp: 2000 }); break;
      case 'train': osc('triangle', 520, 1040, t, 0.15, 0.2 * vol, d); break;
      case 'shoot': osc('square', 1000, 260, t, 0.06, 0.05 * vol, d, { lp: 2500 }); break;
      case 'laser': osc('sawtooth', 1600, 300, t, 0.12, 0.06 * vol, d, { lp: 3000 }); break;
      case 'hit': noise(t, 0.05, 0.12 * vol, d, 'highpass', 3000); break;
      case 'boom': noise(t, 0.45, 0.45 * vol, d, 'lowpass', 700); osc('sine', 110, 35, t, 0.4, 0.5 * vol, d); break;
      case 'alert': osc('square', 880, 880, t, 0.09, 0.12 * vol, d, { lp: 2400 }); osc('square', 660, 660, t + 0.14, 0.12, 0.12 * vol, d, { lp: 2400 }); break;
      case 'wave': strum([40, 47, 52], t, 0.9 * vol, { bus: d, dist: true, gap: 0.004 }); kick(t, 0.8, d); break;
      case 'riff': { const ns = [40, 47, 52, 55, 59, 64]; strum(ns, t, 1.1 * vol, { bus: d, dist: true, gap: 0.01 }); strum(ns, t + 0.18, 0.9 * vol, { bus: d, dist: true, gap: 0.01, up: true }); crash(t, 0.8, d); kick(t, 1, d); break; }
      case 'chord': strum([52, 59, 64, 67, 71], t, 0.7 * vol, { bus: d, gap: 0.02 }); break;
      case 'correct': [72, 76, 79].forEach((m, i) => pluck(m, t + i * 0.07, 0.7 * vol, { bus: d, verb: false })); break;
      case 'wrong': osc('sawtooth', 150, 110, t, 0.28, 0.14 * vol, d, { lp: 700 }); break;
      case 'levelup': [60, 64, 67, 72, 76].forEach((m, i) => pluck(m, t + i * 0.08, 0.7 * vol, { bus: d, verb: false })); break;
      case 'unlock': [84, 88, 91].forEach((m, i) => osc('triangle', mtof(m), 0, t + i * 0.06, 0.3, 0.12 * vol, d)); break;
      case 'win': strum([48, 55, 60, 64, 67, 72], t, 0.9 * vol, { bus: d, gap: 0.03 }); break;
      case 'lose': strum([45, 52, 57, 60, 64], t, 0.7 * vol, { bus: d, gap: 0.05 }); break;
      case 'error': osc('square', 200, 160, t, 0.12, 0.08 * vol, d, { lp: 900 }); break;
      case 'heal': osc('sine', 600, 1200, t, 0.25, 0.12 * vol, d); break;
    }
  };
})();

<script>
/* js/pixelfx.js */
/* 紫色像素脉冲 + 弹吉他的像素小人（参考视频中的 Ultracode 动效） */
(function () {
  const CF = window.CF;

  // ---------- 调色板 ----------
  const PAL = {
    body: '#d97757', bodyD: '#b85f40', eye: '#1b1226', k: '#1b1226',
    gtr: '#8b80d6', gtrD: '#5e54b0', gtrL: '#b3abea', fret: '#c8c1f2', note: '#f2c14e', gray: '#6b6680',
  };
  const LV = ['', 'rgba(132,112,214,0.34)', 'rgba(160,142,230,0.56)', 'rgba(188,176,240,0.8)'];

  // ---------- 像素小人 ----------
  // p: { bob, strum(0/1), blink, lean, scale }
  function drawClawd(ctx, ox, oy, px, p = {}) {
    const bob = p.bob || 0, lean = p.lean || 0;
    const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(ox + x * px), Math.round(oy + (y + bob) * px), Math.ceil(w * px), Math.ceil(h * px)); };
    const sh = lean > 0.5 ? -1 : 0, sv = lean > 0.5 ? 1 : 0; // 点头：上半身前倾
    const bc = p.tint || PAL.body;
    // 腿
    [2, 4, 9, 11].forEach((x, i) => R(x, 8, 1, 2 - ((p.step || 0) % 2 === i % 2 && p.walk ? 1 : 0), bc));
    // 身体下半
    R(1, 4, 12, 4, bc);
    // 身体上半（可前倾）
    R(1 + sh, 0 + sv, 12, 4, bc);
    R(0 + sh, 3 + sv, 1, 2, bc); // 左手
    R(1 + sh, 0 + sv, 1, 4, p.tintD || PAL.bodyD);
    // 眼睛
    if (p.blink) { R(3 + sh, 3 + sv, 2, 1, PAL.eye); R(8 + sh, 3 + sv, 2, 1, PAL.eye); }
    else { R(3 + sh, 2 + sv, 1, 2, PAL.eye); R(9 + sh, 2 + sv, 1, 2, PAL.eye); }
    if (p.noGuitar) return;
    // 吉他琴颈与琴头
    const neck = [[11, 4], [12, 3], [13, 2], [14, 1], [15, 0], [16, -1], [17, -2]];
    neck.forEach(([x, y], i) => { R(x, y, 1, 1, PAL.k); if (i % 2 === 0) R(x + 1, y, 1, 1, PAL.fret); });
    R(18, -4, 2, 2, PAL.gtr); R(20, -4, 1, 1, PAL.fret); R(18, -5, 1, 1, PAL.fret); R(17, -3, 1, 1, PAL.gtr);
    // 按弦的手
    R(14, 2, 1, 1, bc); R(15, 1, 1, 1, bc);
    // 琴身
    const gx = 6, gy = 4;
    const body = ['..KKKK.', '.KGGGGK', 'KGGgGGK', 'KgGGGGK', 'KKgggK.', '.KKKK..'];
    body.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const c = row[x]; if (c === '.') continue; R(gx + x, gy + y, 1, 1, c === 'K' ? PAL.k : c === 'g' ? PAL.gtrD : PAL.gtr); } });
    R(gx + 3, gy + 2, 1, 1, PAL.k); // 音孔
    // 扫弦的手
    const hy = p.strum ? 7 : 5;
    R(12, hy, 2, 1, bc); R(13, hy - 1, 1, 1, bc);
  }

  const NOTES = [['.XX', '.X.', 'XX.'], ['XX', '.X', 'XX'], ['X.X', 'XXX'], ['XXX', 'X.X', 'XX.']];
  const NOTE2 = ['XXXX', 'X..X', 'X..X', 'XX.XX'];
  function drawPattern(ctx, pat, x, y, px, col) {
    ctx.fillStyle = col;
    pat.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] === 'X') ctx.fillRect(Math.round(x + i * px), Math.round(y + j * px), Math.ceil(px), Math.ceil(px)); });
  }

  // ---------- 舞台 ----------
  class Stage {
    constructor(canvas, opts = {}) {
      this.cv = canvas; this.ctx = canvas.getContext('2d');
      this.o = Object.assign({ mode: 'bar', cell: 14, fx: 0.86, fy: 0.55, charPx: 0, showChar: true, gradient: true, shimmer: true, radius: 60 }, opts);
      this.waves = []; this.parts = []; this.t = 0;
      this.anim = { bob: 0, strum: 0, blink: 0, lean: 0, strumFlip: 0 };
      this.enabled = true; this.w = 0; this.h = 0;
      this.idleBlink = 2 + Math.random() * 3;
      Stage.all.add(this);
    }
    destroy() { Stage.all.delete(this); }
    visible() { return this.enabled && this.cv.isConnected && this.cv.offsetParent !== null && (!this.o.activeFn || this.o.activeFn()); }
    resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, CF.Save.data.settings.quality === 'low' ? 1 : 2);
      const w = this.cv.clientWidth, h = this.cv.clientHeight;
      if (!w || !h) return false;
      if (this.w !== w || this.h !== h || this.dpr !== dpr) {
        this.w = w; this.h = h; this.dpr = dpr;
        this.cv.width = Math.round(w * dpr); this.cv.height = Math.round(h * dpr);
      }
      return true;
    }
    pulse(s, strum) {
      const big = s >= 0.9;
      this.waves.push({ t0: this.t, s, speed: big ? 26 : 18, width: big ? 7 : 4 });
      if (this.waves.length > 8) this.waves.shift();
      if (strum) { this.anim.strum = 1; this.anim.strumFlip ^= 1; }
      this.anim.bob = 1;
      if (big) { this.anim.lean = 1; if (Math.random() < 0.5) this.anim.blink = 0.5; }
      // 粒子
      const lowQ = CF.Save.data.settings.quality === 'low';
      const n = big ? 3 : s > 0.6 ? 2 : 1;
      for (let i = 0; i < (lowQ ? 1 : n); i++) this.parts.push({ k: 'note', pat: CF.pick(NOTES), x: 15 + Math.random() * 6, y: -6 - Math.random() * 2, vx: (Math.random() - 0.3) * 4, vy: -6 - Math.random() * 4, life: 1.2, age: 0 });
      if (strum) for (let i = 0; i < (lowQ ? 2 : 4); i++) { const a = -0.9 + Math.random() * 1.6; this.parts.push({ k: 'spark', x: 14, y: 6, vx: Math.cos(a) * 16, vy: Math.sin(a) * 14, life: 0.35, age: 0 }); }
      if (big && Math.random() < 0.4) this.parts.push({ k: 'gray', x: 21, y: 3, vx: 1, vy: -2, life: 1.4, age: 0 });
      if (this.parts.length > 60) this.parts.splice(0, this.parts.length - 60);
    }
    update(dt) {
      this.t += dt;
      const a = this.anim;
      a.bob = Math.max(0, a.bob - dt * 6); a.strum = Math.max(0, a.strum - dt * 7); a.lean = Math.max(0, a.lean - dt * 3.2); a.blink = Math.max(0, a.blink - dt);
      this.idleBlink -= dt;
      if (this.idleBlink < 0) { a.blink = 0.14; this.idleBlink = 2.5 + Math.random() * 4; }
      this.waves = this.waves.filter((w) => this.t - w.t0 < 2.4);
      this.parts.forEach((p) => { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.k === 'note') p.vx += Math.sin(p.age * 8) * dt * 6; });
      this.parts = this.parts.filter((p) => p.age < p.life);
    }
    charPx() {
      if (this.o.charPx) return this.o.charPx;
      if (this.o.mode === 'bar') return Math.max(2, Math.round((this.h * 0.72) / 15));
      if (this.o.mode === 'portrait') return Math.max(2, Math.floor((this.h * 0.7) / 15));
      return Math.max(4, Math.floor(Math.min(this.w * 0.42, this.h * 0.6) / 22));
    }
    draw() {
      const { ctx, w, h, dpr } = this;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const fx = w * this.o.fx, fy = h * this.o.fy;
      // 底色
      if (this.o.gradient) {
        const g = ctx.createLinearGradient(0, 0, w, 0);
        g.addColorStop(0, '#22144c'); g.addColorStop(0.65, '#33207a'); g.addColorStop(1, '#4a2fa0');
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        const rg = ctx.createRadialGradient(fx, fy, 0, fx, fy, Math.max(w, h) * (this.o.mode === 'full' ? 0.55 : 0.3));
        const e = 0.25 + 0.25 * this.anim.bob;
        rg.addColorStop(0, `rgba(120,86,230,${0.55 + e * 0.4})`); rg.addColorStop(1, 'rgba(60,30,140,0)');
        ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);
      }
      // 像素方格
      const cs = this.o.cell * (CF.Save.data.settings.quality === 'low' ? 1.4 : 1);
      const cols = Math.ceil(w / cs), rows = Math.ceil(h / cs);
      const fcx = fx / cs, fcy = fy / cs;
      const maxR = this.o.radius;
      const t = this.t;
      for (let j = 0; j < rows; j++) {
        for (let i = 0; i < cols; i++) {
          const d = Math.hypot(i + 0.5 - fcx, (j + 0.5 - fcy) * (this.o.mode === 'bar' ? 0.35 : 1));
          let b = 0;
          if (this.o.shimmer) { const band = Math.floor(i / 5); b = 0.1 + 0.11 * Math.sin(t * 1.1 - band * 0.9 + (this.o.mode === 'full' ? Math.floor(j / 5) * 0.7 : 0)); }
          for (const wv of this.waves) {
            const age = t - wv.t0, r = age * wv.speed;
            if (d <= r) { const k = 1 - (r - d) / wv.width; if (k > 0) b += wv.s * k * Math.exp(-age * 1.3) * Math.max(0, 1 - d / maxR) * 1.25; }
          }
          if (b < 0.18) continue;
          const lv = b < 0.42 ? 1 : b < 0.7 ? 2 : 3;
          ctx.fillStyle = LV[lv];
          ctx.fillRect(i * cs + 1, j * cs + 1, cs - 1, cs - 1);
        }
      }
      // 小人
      const px = this.charPx();
      if (this.o.drawChar && this.o.drawChar(ctx, fx, fy, px, this.anim)) { /* 自定义角色 */ }
      else if (this.o.showChar) {
        const cw = 21 * px, chh = 15 * px;
        const ox = fx - cw * 0.45, oy = fy - chh * 0.38;
        const a = this.anim;
        // 脚下光晕
        ctx.fillStyle = 'rgba(30,14,70,0.35)'; ctx.fillRect(ox + px, oy + 10 * px, 12 * px, px);
        drawClawd(ctx, ox, oy, px, { bob: a.bob > 0.5 ? -1 : 0, strum: a.strum > 0.4 ? (a.strumFlip ? 1 : 0) : 0, blink: a.blink > 0, lean: a.lean });
        // 粒子（以小人像素为单位）
        this.parts.forEach((p) => {
          const al = 1 - p.age / p.life;
          ctx.globalAlpha = Math.min(1, al * 1.5);
          const X = ox + p.x * px, Y = oy + p.y * px;
          if (p.k === 'note') drawPattern(ctx, p.pat, X, Y, Math.max(2, px * 0.75), PAL.note);
          else if (p.k === 'gray') drawPattern(ctx, NOTE2, X, Y, Math.max(1.5, px * 0.6), PAL.gray);
          else { ctx.fillStyle = PAL.note; ctx.fillRect(X, Y, px * 0.9, px * 0.6); }
        });
        ctx.globalAlpha = 1;
      }
    }
  }
  Stage.all = new Set();

  // ---------- 全局循环 ----------
  let last = performance.now(), acc = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.1) dt = 0.1;
    const lowQ = CF.Save.data.settings.quality === 'low';
    acc += dt;
    if (lowQ && acc < 1 / 30) return;
    const step = acc; acc = 0;
    const beats = CF.Audio ? CF.Audio.pullBeats() : [];
    for (const st of Stage.all) {
      beats.forEach((b) => st.pulse(b.s, b.strum));
      if (!st.visible()) continue;
      if (!st.resize()) continue;
      st.update(step);
      st.draw();
    }
    CF.bus.emit('frame', step);
  }
  requestAnimationFrame(loop);

  CF.PixelFX = { Stage, drawClawd, drawPattern, PAL, NOTES };
})();

    ['ai', '向量点积 [1,2,3]·[4,5,6] 等于？', ['15', '32', '21', '[4,10,18]'], 1, '1×4 + 2×5 + 3×6 = 32。神经元的计算本质就是「输入 · 权重 + 偏置」。'],
    ['ai', '形状为 2×3 的矩阵乘以 3×4 的矩阵，结果形状是？', ['3×3', '2×4', '4×2', '无法相乘'], 1, '(m×n)·(n×p) = m×p。内侧维度必须相等。'],
    ['ai', 'Softmax 的作用是？', ['排序', '把一组实数变成总和为 1 的概率分布', '去除负数', '计算梯度'], 1, 'softmax(x)ᵢ = e^xᵢ / Σe^xⱼ。分类模型最后一层常用它输出各类别概率。'],
    ['ai', '大语言模型的「幻觉」指？', ['模型过热', '生成看似合理但与事实不符的内容', '显示器闪烁', '训练太慢'], 1, '模型按概率生成文字，并不天然保证真实。所以重要信息要核实，或用检索增强（RAG）提供依据。'],
    ['ai', 'AI Agent 与普通聊天机器人的关键区别是？', ['界面更好看', '能规划并调用工具执行多步任务，根据反馈调整', '只能回答一句话', '不需要模型'], 1, 'Agent = 模型 + 工具 + 循环（感知→规划→行动→观察）。这和具身智能的思路一致。'],
    ['ai', '2012 年 AlexNet 赢得 ImageNet 比赛，它的训练依靠了什么关键硬件？', ['CPU 集群', 'NVIDIA GPU（两块 GTX 580）', '量子计算机', '手机芯片'], 1, '这次胜利让业界看到 GPU + 深度学习的威力，也是英伟达走向 AI 时代的转折点之一。'],
    ['ai', '预测值 [2, 4]，真实值 [1, 5]，均方误差 MSE 是？', ['0', '1', '2', '0.5'], 1, '((2-1)² + (4-5)²) / 2 = (1+1)/2 = 1。'],
    ['ai', '检索增强生成（RAG）主要解决什么问题？', ['让模型跑得更快', '让模型基于检索到的外部资料作答，减少知识过时和幻觉', '压缩模型体积', '替代 GPU'], 1, '先检索相关文档，再把文档放进上下文让模型回答，答案可以追溯来源。'],
    ['ai', '「微调」（fine-tuning）指的是？', ['从零训练新模型', '在预训练模型基础上，用特定数据继续训练', '调显示器亮度', '删除模型参数'], 1, '预训练学通用能力，微调让模型适应具体任务，比如机器人指令理解。'],
    // 具身智能
    ['emb', '「具身智能」（Embodied AI）最核心的特点是？', ['只在服务器上运行', '拥有身体，通过「感知-决策-行动」与物理世界交互', '只处理文字', '不需要传感器'], 1, '智能不只在「脑子」里，也在身体与环境的交互里。人形机器人、自动驾驶、无人机都属于这一领域。'],
    ['emb', 'PID 控制里，D（微分）项的主要作用是？', ['消除稳态误差', '根据误差变化速度提前「刹车」，减小超调和振荡', '增大输出', '测量温度'], 1, 'D 看的是误差变化趋势：快接近目标时减速。实验室「PID 无人机」里亲手调一次就懂了。'],
    ['emb', 'PID 控制里，I（积分）项主要用来？', ['让系统更快', '消除长期存在的稳态误差', '减少计算量', '降低噪声'], 1, '只有 P 时，系统可能停在离目标差一点的地方；I 把历史误差累积起来，慢慢把它推过去。'],
    ['emb', '激光雷达（LiDAR）测距的基本原理是？', ['听声音', '测量激光往返的飞行时间（ToF）', '测温度', '拍照后估计'], 1, '距离 = 光速 × 往返时间 / 2。自动驾驶和机器人常用它建立 3D 点云。'],
    ['emb', 'SLAM 指的是？', ['一种电池', '同时定位与建图', '机械臂型号', '编程语言'], 1, 'Simultaneous Localization And Mapping：机器人在陌生环境里一边画地图，一边确定自己在地图里的位置。'],
    ['emb', 'IMU（惯性测量单元）通常包含？', ['摄像头和麦克风', '加速度计和陀螺仪（有时还有磁力计）', 'GPS 和雷达', '电机和电池'], 1, '手机里就有 IMU。无人机靠它感知姿态。可以用手机 App（如 phyphox）亲手看数据。'],
    ['emb', 'A* 寻路算法 f(n) = g(n) + h(n) 中，h(n) 表示？', ['已走的路程', '从当前点到终点的估计代价（启发函数）', '地图大小', '机器人速度'], 1, 'g 是已花的代价，h 是对剩余代价的估计。h 估得好，搜索就又快又准。'],
    ['emb', '网格地图上从 (1,2) 到 (4,6) 的曼哈顿距离是？', ['5', '7', '25', '12'], 1, '|4-1| + |6-2| = 3 + 4 = 7。只能上下左右走时常用它作 A* 的启发函数。'],
    ['emb', '机器人的「自由度」（DoF）是指？', ['能独立运动的关节/方向数量', '最大速度', '电池容量', '传感器数量'], 0, '人手臂大约有 7 个自由度。自由度越多越灵活，但控制也越难。'],
    ['emb', '「Sim2Real」难题指的是？', ['仿真软件太贵', '在仿真里训练好的策略，迁移到真实世界时性能下降', '实物比仿真快', '无法建模'], 1, '仿真里的摩擦、延迟、噪声都和现实不同。常用「域随机化」等方法缩小差距。'],
    ['emb', 'ROS（Robot Operating System）本质上是？', ['和 Windows 一样的操作系统内核', '一套机器人软件开发框架与通信中间件', '一种机器人硬件', '一个电机品牌'], 1, 'ROS 提供节点、话题、服务等通信机制和大量工具包。现在主流是 ROS 2。'],
    ['emb', '已知机械臂末端要到达的位置，求各关节角度，这叫？', ['正运动学', '逆运动学', '动力学仿真', '路径规划'], 1, '正运动学：角度 → 位置；逆运动学：位置 → 角度。逆运动学可能有多解或无解。'],
    ['emb', '闭环控制与开环控制最大的区别是？', ['闭环更便宜', '闭环利用传感器反馈不断修正输出', '开环更精确', '没有区别'], 1, '恒温空调、平衡车都是闭环：测量 → 比较 → 修正。'],
    ['emb', '舵机（伺服电机）相比普通直流电机的特点是？', ['转得更快', '内置位置反馈，可以精确控制角度', '不需要供电', '只能单向转'], 1, '舵机内部有电位器和控制电路，给一个 PWM 信号就能转到指定角度。做机械臂入门首选。'],
    ['emb', '视觉-语言-动作模型（VLA，如 Google DeepMind 2023 年的 RT-2）的思路是？', ['只识别图片', '把视觉和语言输入直接映射成机器人动作', '只做语音识别', '替代传感器'], 1, '把大模型的常识与机器人控制结合，让机器人能听懂「把可乐递给我」这类指令。'],
    // 航空航天
    ['aero', '近地轨道（LEO）的环绕速度大约是？', ['340 m/s', '7.8 km/s', '30 km/s', '300 km/s'], 1, '约 7.8 km/s，绕地球一圈约 90 分钟。考虑重力和空气阻力损失，入轨总共大约需要 9.3~10 km/s 的 Δv。'],
    ['aero', '火箭方程 Δv = Isp·g₀·ln(m₀/m_f) 告诉我们？', ['火箭越重越快', '质量比越大、比冲越高，能获得的速度增量越大', '燃料越少越好', 'Δv 与发动机无关'], 1, '因为是对数关系，想多要一点 Δv，就要多得多的燃料。实验室「火箭方程」可以亲手设计两级火箭。'],
    ['aero', '比冲（Isp）衡量的是？', ['火箭高度', '发动机效率：单位推进剂产生冲量的能力', '燃料价格', '火箭直径'], 1, '单位常用秒。液氢液氧发动机真空比冲可达约 450 s，煤油发动机约 300 多秒。'],
    ['aero', '从地球表面脱离地球引力所需的最小速度（第二宇宙速度）约为？', ['7.9 km/s', '11.2 km/s', '16.7 km/s', '1 km/s'], 1, '第一宇宙速度 7.9 km/s（环绕），第二 11.2 km/s（脱离地球），第三 16.7 km/s（脱离太阳系）。'],
    ['aero', '机翼产生升力的主要原因是？', ['机翼很轻', '翼型使气流向下偏转，上下表面形成压力差', '发动机向上推', '空气被加热'], 1, '机翼把气流往下「推」（下洗），根据牛顿第三定律空气把机翼往上推；同时上表面压力较低。两种说法描述的是同一现象。'],
    ['aero', '四旋翼无人机如何实现原地转向（偏航）？', ['倾斜机身', '改变顺、逆时针螺旋桨之间的转速差，产生反扭矩差', '关掉一个电机', '用尾舵'], 1, '对角两个桨同向转。让顺时针那组转快，机身就会受到反方向的扭矩而转动。'],
    ['aero', '多级火箭的主要好处是？', ['更好看', '抛掉用完的空壳，减少无用质量，提高总 Δv', '更便宜', '不需要燃料'], 1, '带着空油箱飞是浪费。每级用完就丢，剩下的火箭质量比更好。'],
    ['aero', '猎鹰 9 号一级火箭首次成功在陆地着陆回收是在？', ['2008 年', '2015 年 12 月', '2020 年', '1969 年'], 1, '2015 年 12 月 21 日。可复用火箭让入轨成本大幅下降，是马斯克「第一性原理」的典型案例。'],
    ['aero', '推重比大于 1 意味着？', ['飞行器能垂直起飞/加速上升', '飞行器一定会坠毁', '燃料用完了', '只能滑翔'], 0, '推力 > 重力，合力向上。火箭起飞时推重比通常在 1.2~1.5 左右。'],
    ['aero', '霍曼转移轨道是？', ['最快的转移方式', '两个共面圆轨道之间最省燃料的双脉冲转移', '直线飞行', '着陆方式'], 1, '在低轨道加速进入椭圆转移轨道，到达远地点再加速一次圆化。省燃料但耗时。'],
    ['aero', 'SpaceX 星舰的猛禽（Raptor）发动机使用液氧甲烷，优势之一是？', ['燃料最便宜也最安全', '积碳少、利于复用，且甲烷可在火星就地制取', '比冲最高', '不需要氧化剂'], 1, '甲烷燃烧干净，适合反复使用；火星大气中的 CO₂ 加上水冰理论上可以制造甲烷和氧气。'],
    ['aero', '地球静止轨道的高度大约是？', ['400 km', '35,786 km', '384,400 km', '100 km'], 1, '在这个高度卫星绕地球一圈恰好一天，从地面看静止不动，常用于通信和气象卫星。'],
    ['aero', '火箭在真空中也能加速，是因为？', ['推开了空气', '向后高速喷出燃气，燃气对火箭产生反作用力（牛顿第三定律）', '太空中有风', '靠惯性'], 1, '火箭不需要空气作为「支点」，它推的是自己喷出去的燃气。'],
    ['aero', '飞机「失速」是指？', ['发动机熄火', '迎角过大导致气流从机翼上表面分离，升力骤降', '速度太快', '燃油耗尽'], 1, '失速和速度无直接关系，是迎角超过临界值的结果。'],
    ['aero', '空间站里的航天员「失重」，原因是？', ['太空没有重力', '他们和空间站一起处于持续自由落体（环绕）状态', '空间站在旋转', '穿了特殊衣服'], 1, '400 km 高度的重力仍约为地面的 90%。他们一直在「掉」，只是同时水平速度足够快，总也掉不到地面。'],
    ['aero', '航天器返回地球时最大的挑战之一是？', ['氧气不足', '与大气剧烈摩擦压缩产生的气动加热（高温）', '太冷', '没有信号'], 1, '返回舱表面温度可达上千摄氏度，需要隔热罩（烧蚀材料或防热瓦）。'],

    ['biz', '公司账上有 300 万元，每月净亏损 50 万元，runway（跑道）是？', ['3 个月', '6 个月', '12 个月', '50 个月'], 1, 'Runway = 现金 / 每月净消耗 = 6 个月。融资通常要提前 6 个月以上开始。'],

    ['biz', '2012 年 Facebook 收购 Instagram 的价格大约是？', ['1000 万美元', '10 亿美元', '1000 亿美元', '免费'], 1, '当时 Instagram 只有 13 名员工、没有收入。扎克伯格看中的是移动互联网的平台转移。'],

<script>
/* js/progress.js */
/* 成长系统：经验、3:7 配比引擎、军衔、解锁、每日修炼、成就、战斗加成 */
(function () {
  const CF = window.CF;
  const S = () => CF.Save.data;

  const RANKS = [
    [0, '新兵'], [100, '学徒'], [300, '见习工程师'], [700, '工程师'], [1300, '高级工程师'],
    [2200, '研究员'], [3500, '首席科学家'], [5200, '创始人'], [7500, '连续创业者'], [10000, '造物者'],
  ];
  const LABS = ['gd', 'perceptron', 'pid', 'robot', 'rocket', 'startup', 'code', 'pixel'];
  const TARGET_K = 0.3;

  const P = (CF.P = { RANKS, LABS, TARGET_K });

  P.totalXP = () => S().xp.knowledge + S().xp.practice;
  P.ratio = () => {
    const k = S().xp.knowledge, p = S().xp.practice, t = k + p;
    return { k, p, t, kPct: t ? k / t : 0, pPct: t ? p / t : 0 };
  };
  P.suggestion = () => {
    const r = P.ratio();
    if (r.t < 40) return { type: 'any', text: '刚起步：先做「今日修炼」，知识和实操都来一点。' };
    if (r.kPct > TARGET_K + 0.05) return { type: 'p', text: `知识占比 ${Math.round(r.kPct * 100)}%，偏高。下一项建议做实操：实验室或线下任务。` };
    if (r.kPct < TARGET_K - 0.08) return { type: 'k', text: `知识占比 ${Math.round(r.kPct * 100)}%，偏低。做几道知识题，给实践补上理论。` };
    return { type: 'ok', text: `配比 ${Math.round(r.kPct * 100)} : ${Math.round(r.pPct * 100)}，接近 3:7 的目标，保持节奏。` };
  };
  P.rank = () => {
    const xp = P.totalXP();
    let i = 0;
    while (i + 1 < RANKS.length && xp >= RANKS[i + 1][0]) i++;
    const cur = RANKS[i], next = RANKS[i + 1];
    return { idx: i, name: cur[1], xp, next: next ? next[0] : null, nextName: next ? next[1] : null, prog: next ? (xp - cur[0]) / (next[0] - cur[0]) : 1 };
  };

  // 发放经验。type: 'k' 知识 / 'p' 实操
  P.addXP = function ({ type, amt, dims = {}, domain = null, founder = null, label = '' }) {
    const d = S();
    const before = P.rank().idx;
    amt = Math.round(amt);
    if (type === 'k') d.xp.knowledge += amt; else d.xp.practice += amt;
    for (const k in dims) d.dims[k] = (d.dims[k] || 0) + amt * dims[k] * 0.5;
    if (domain && d.domains[domain] !== undefined) d.domains[domain] += amt;
    if (founder) for (const k in founder) d.founder[k] = (d.founder[k] || 0) + founder[k];
    P.touchStreak();
    CF.Save.save();
    CF.toast(`+${amt} ${type === 'k' ? '知识' : '实操'}经验${label ? ' · ' + label : ''}`, type === 'k' ? '' : 'gold', 1600);
    const after = P.rank();
    if (after.idx > before) { CF.Audio.sfx('levelup'); setTimeout(() => CF.toast(`军衔晋升：${after.name}`, 'gold', 3000), 400); }
    P.checkAch();
    CF.bus.emit('progress');
  };

  P.touchStreak = function () {
    const st = S().streak, today = CF.today();
    if (st.last === today) return;
    st.count = st.last && CF.dayDiff(st.last, today) === 1 ? st.count + 1 : 1;
    st.last = today; st.best = Math.max(st.best || 0, st.count);
  };

  // ---------- 实验 / 任务状态 ----------
  P.labDone = (id) => !!(S().labs[id] && S().labs[id].done);
  P.labStars = (id) => (S().labs[id] ? S().labs[id].stars || 0 : 0);
  P.labsDoneCount = () => LABS.filter(P.labDone).length;
  P.codeDone = () => Object.keys(S().code).filter((k) => S().code[k]).length;
  P.questCount = (dom) => S().quests.log.filter((l) => !dom || l.d === dom).length;
  P.scenarioCount = () => Object.keys(S().scenarios).length;
  P.trial = () => !!S().settings.trial;

  P.finishLab = function (id, stars, info = {}) {
    const d = S(), rec = d.labs[id] || { done: false, stars: 0, count: 0 };
    const first = !rec.done;
    const gain = first ? 40 + stars * 10 : Math.max(0, stars - rec.stars) * 10 + 8;
    rec.done = true; rec.count = (rec.count || 0) + 1; rec.stars = Math.max(rec.stars || 0, stars);
    d.labs[id] = rec;
    const meta = (CF.Labs && CF.Labs.META[id]) || {};
    P.addXP({ type: 'p', amt: gain, dims: Object.assign({ shi: 1, zhi: 0.4 }, meta.dims || {}), domain: meta.d, label: meta.name });
    P.markDaily('lab', id);
    if (first) { CF.Audio.sfx('unlock'); P.announceUnlocks(); }
  };
  P.finishCode = function (id) {
    const d = S();
    if (d.code[id]) { CF.toast('已完成过，复习也很好'); return; }
    d.code[id] = CF.today();
    const c = CF.Content.CODE.find((x) => x.id === id);
    P.addXP({ type: 'p', amt: 35, dims: { shi: 1, zhi: 0.5 }, domain: c ? c.d : 'ai', label: '代码挑战' });
    if (!P.labDone('code') && P.codeDone() >= 3) P.finishLab('code', 3);
    P.markDaily('lab', 'code');
    P.announceUnlocks();
  };
  P.finishQuest = function (q, note) {
    const d = S();
    d.quests.log.unshift({ id: q.id, d: q.d, t: q.t, note: note.slice(0, 600), date: CF.today() });
    const dom = ['ai', 'emb', 'aero', 'biz'].includes(q.d) ? q.d : null;
    P.addXP({ type: 'p', amt: q.xp, dims: q.dims, domain: dom, label: '线下实操' });
    P.markDaily('quest', q.id);
    P.announceUnlocks();
  };
  P.answerQuiz = function (q, correct) {
    const d = S();
    const rec = d.quiz.seen[q.id] || { c: 0, w: 0 };
    if (correct) { rec.c++; d.quiz.correct++; } else { rec.w++; d.quiz.wrong++; }
    rec.last = Date.now();
    d.quiz.seen[q.id] = rec;
    const dims = { zhi: 1 };
    if (q.d === 'biz') dims.qi = 0.6;
    if (q.d === 'whole') { dims.de = 0.4; dims.mei = 0.3; }
    P.addXP({ type: 'k', amt: correct ? 10 : 3, dims, domain: q.d === 'whole' ? null : q.d, label: correct ? '答对' : '答错也有收获' });
  };
  P.decideScenario = function (sc, idx) {
    const d = S(), first = d.scenarios[sc.id] === undefined;
    d.scenarios[sc.id] = idx;
    const op = sc.opts[idx];
    if (!first) { CF.Save.save(); return; }
    const dims = { qi: 1, zhi: 0.3 };
    if (op.de || sc.opts.some((o) => o.de)) dims.de = (op.de || 0) * 0.4 + 0.2;
    if (op.ti) dims.ti = op.ti * 0.4;
    P.addXP({ type: 'p', amt: op.best ? 30 : 20, dims, domain: 'biz', founder: op.f, label: '情景决策' });
    P.markDaily('scenario', sc.id);
    P.announceUnlocks();
  };

  // ---------- 每日修炼 ----------
  P.dailyPlan = function () {
    const d = S(), today = CF.today();
    if (d.daily.date === today && d.daily.items.length) return d.daily;
    const rnd = CF.rng(CF.hashStr(today));
    const pickR = (arr) => arr[Math.floor(rnd() * arr.length)];
    const undone = LABS.filter((l) => !P.labDone(l));
    const lab = undone.length ? undone[0] : pickR(LABS);
    const doms = ['ai', 'emb', 'aero', 'biz'];
    const dom = doms[Math.floor(rnd() * 4)];
    const qMain = pickR(CF.Content.QUESTS.filter((q) => q.d === dom));
    const qBody = pickR(CF.Content.QUESTS.filter((q) => q.d === 'ti'));
    const qSoul = pickR(CF.Content.QUESTS.filter((q) => q.d === (rnd() < 0.5 ? 'de' : 'mei')));
    const scs = CF.Content.SCENARIOS.filter((s) => d.scenarios[s.id] === undefined);
    const items = [
      { kind: 'quiz', id: 'daily', n: 3, label: '知识小测 3 题', type: 'k' },
      { kind: 'lab', id: lab, label: '实验室', type: 'p' },
      { kind: 'quest', id: qMain.id, label: '线下实操', type: 'p' },
      { kind: 'quest', id: qBody.id, label: '体', type: 'p' },
      { kind: 'quest', id: qSoul.id, label: qSoul.d === 'de' ? '德' : '美', type: 'p' },
    ];
    if (scs.length) items.push({ kind: 'scenario', id: pickR(scs).id, label: '企业家修炼', type: 'p' });
    d.daily = { date: today, items, done: [], bonus: false };
    CF.Save.save();
    return d.daily;
  };
  P.markDaily = function (kind, id) {
    const dl = S().daily;
    if (dl.date !== CF.today()) return;
    const it = dl.items.find((x) => x.kind === kind && (x.id === id || kind === 'quiz'));
    if (it && !dl.done.includes(it.kind + ':' + it.id)) {
      dl.done.push(it.kind + ':' + it.id);
      if (dl.done.length >= dl.items.length && !dl.bonus) {
        dl.bonus = true;
        CF.Save.save();
        setTimeout(() => { CF.toast('今日修炼全部完成！下一场战斗起始算力 +50', 'gold', 3200); CF.Audio.sfx('levelup'); }, 600);
      }
      CF.Save.save();
    }
  };

  // ---------- 解锁 ----------
  const LEVEL_REQ = {
    L1: [],
    L2: [['win', 'L1', '通关「第一行代码」'], ['anylab', ['gd', 'perceptron'], '完成「梯度下降」或「感知机」实验'], ['code', 1, '完成 1 个代码挑战（解锁 Agent 工坊）']],
    L3: [['win', 'L2', '通关「守住上下文」'], ['lab', 'robot', '完成「机器人编程」实验']],
    L4: [['win', 'L3', '通关「原型机护送」'], ['lab', 'pid', '完成「PID 无人机」实验（解锁无人机空港）'], ['lab', 'rocket', '完成「火箭方程」实验']],
    L5: [['win', 'L4', '通关「制空权」'], ['lab', 'startup', '完成「创业沙盘」实验'], ['scen', 3, '完成 3 个企业家情景决策']],
  };
  function reqOk(r) {
    const d = S();
    switch (r[0]) {
      case 'win': return !!(d.campaign[r[1]] && d.campaign[r[1]].won);
      case 'lab': return P.labDone(r[1]);
      case 'anylab': return r[1].some(P.labDone);
      case 'code': return P.codeDone() >= r[1];
      case 'scen': return P.scenarioCount() >= r[1];
      case 'quest': return P.questCount(r[1]) >= (r[2] || 1);
    }
    return false;
  }
  P.levelReqs = (id) => (LEVEL_REQ[id] || []).map((r) => ({ ok: reqOk(r), text: r[2] }));
  P.levelUnlocked = (id) => P.trial() || P.levelReqs(id).every((r) => r.ok);

  const BUILD_REQ = {
    repair: [['quest', 'ti', 1, '完成 1 个「体」线下任务（体能 = 修复力）']],
    radar: [['lab', 'perceptron', 0, '完成「感知机」实验（感知 = 雷达）']],
    workshop: [['code', 1, 0, '完成 1 个代码挑战']],
    port: [['lab', 'pid', 0, '完成「PID 无人机」实验']],
  };
  P.buildUnlocked = function (type) {
    if (P.trial()) return { ok: true };
    const reqs = BUILD_REQ[type];
    if (!reqs) return { ok: true };
    for (const r of reqs) {
      const ok = r[0] === 'quest' ? P.questCount(r[1]) >= r[2] : r[0] === 'lab' ? P.labDone(r[1]) : P.codeDone() >= r[1];
      if (!ok) return { ok: false, why: r[3] };
    }
    return { ok: true };
  };
  P._unlockSnapshot = null;
  P.unlockSnapshot = () => ['repair', 'radar', 'workshop', 'port'].filter((t) => P.buildUnlocked(t).ok).concat(['L2', 'L3', 'L4', 'L5'].filter(P.levelUnlocked));
  P.announceUnlocks = function () {
    const now = P.unlockSnapshot();
    const prev = P._unlockSnapshot || [];
    if (P.trial()) { P._unlockSnapshot = now; return; }
    const names = { repair: '修复站', radar: '雷达站', workshop: 'Agent 工坊', port: '无人机空港', L2: '第 2 关', L3: '第 3 关', L4: '第 4 关', L5: '第 5 关' };
    now.filter((x) => !prev.includes(x)).forEach((x, i) => setTimeout(() => { CF.toast('🔓 解锁：' + names[x], 'gold', 3000); CF.Audio.sfx('unlock'); }, 900 + i * 700));
    P._unlockSnapshot = now;
  };

  // ---------- 战斗加成：学习 → 战力 ----------
  P.battleBonus = function () {
    const d = S(), r = P.ratio();
    const dailyBonus = d.daily.date === CF.today() && d.daily.bonus ? 50 : 0;
    return {
      chips: Math.min(200, Math.floor(r.k / 5)),
      corp: Math.min(150, Math.floor(r.p / 10)),
      comp: dailyBonus,
      compRate: 0.15 * P.labsDoneCount() + 0.05 * P.codeDone(),
      riffMul: 1 + Math.min(0.6, P.questCount() * 0.03),
      heroHp: 1 + Math.min(0.5, (d.dims.ti || 0) / 200),
      lines: [
        `知识经验 → 起始晶片 +${Math.min(200, Math.floor(r.k / 5))}`,
        `实操经验 → 起始语料 +${Math.min(150, Math.floor(r.p / 10))}`,
        `完成 ${P.labsDoneCount()} 个实验、${P.codeDone()} 个代码挑战 → 算力产出 +${(0.15 * P.labsDoneCount() + 0.05 * P.codeDone()).toFixed(2)}/s`,
        `线下任务 ${P.questCount()} 个 → Claude 弦振伤害 +${Math.round(Math.min(0.6, P.questCount() * 0.03) * 100)}%`,
        `「体」${Math.round(d.dims.ti || 0)} 点 → Claude 耐久 +${Math.round(Math.min(0.5, (d.dims.ti || 0) / 200) * 100)}%`,
      ].concat(dailyBonus ? ['今日修炼全部完成 → 起始算力 +50'] : []),
    };
  };

  // ---------- 成就 ----------
  const ACH = [
    ['first_win', '🧑‍💻', '第一行代码', '通关第 1 关', () => !!(S().campaign.L1 && S().campaign.L1.won)],
    ['all_campaign', '🏁', '终局胜者', '通关全部 5 关战役', () => ['L1', 'L2', 'L3', 'L4', 'L5'].every((l) => S().campaign[l] && S().campaign[l].won)],
    ['three_star', '⭐', '三星指挥官', '任意关卡获得三星', () => Object.values(S().campaign).some((c) => c.stars >= 3)],
    ['all_three', '🌟', '完美战役', '全部 5 关三星', () => ['L1', 'L2', 'L3', 'L4', 'L5'].every((l) => S().campaign[l] && S().campaign[l].stars >= 3)],
    ['air', '🛩️', '制空权', '通关第 4 关「制空权」', () => !!(S().campaign.L4 && S().campaign.L4.won)],
    ['riff20', '🎸', '弦振大师', '累计释放 20 次弦振冲击', () => S().stats.riffs >= 20],
    ['kills500', '🧹', '清理乱码', '累计消灭 500 个乱码单位', () => S().stats.kills >= 500],
    ['hard', '🔥', '硬核指挥官', '赢得一场困难遭遇战', () => S().skirmish.hard > 0],
    ['quiz50', '📚', '知识猎手', '累计答对 50 题', () => S().quiz.correct >= 50],
    ['lab3', '🔧', '动手派', '完成 3 个实验', () => P.labsDoneCount() >= 3],
    ['lab_all', '🧪', '全能实验员', '完成全部 8 个实验', () => P.labsDoneCount() >= 8],
    ['code5', '⌨️', '会写代码的指挥官', '完成 5 个代码挑战', () => P.codeDone() >= 5],
    ['quest10', '🤝', '知行合一', '完成 10 个线下实操任务', () => P.questCount() >= 10],
    ['ratio', '⚖️', '黄金配比', '总经验 ≥ 300 且实操占比在 65%–75%', () => { const r = P.ratio(); return r.t >= 300 && r.pPct >= 0.65 && r.pPct <= 0.75; }],
    ['streak7', '📅', '七日不辍', '连续 7 天有学习记录', () => S().streak.count >= 7],
    ['whole', '🌱', '德智体美', '德、智、体、美四维都达到 30', () => ['de', 'zhi', 'ti', 'mei'].every((k) => S().dims[k] >= 30)],
    ['founder5', '💡', '第一性原理', '完成 5 个企业家情景决策', () => P.scenarioCount() >= 5],
    ['pixel', '🎨', '像素艺术家', '保存自己的像素头像', () => !!S().avatar],
    ['rank6', '🔬', '首席科学家', '军衔达到「首席科学家」', () => P.rank().idx >= 6],
  ].map((a) => ({ id: a[0], icon: a[1], name: a[2], desc: a[3], test: a[4] }));
  P.ACH = ACH;
  P.checkAch = function () {
    const d = S();
    ACH.forEach((a) => {
      if (d.achievements[a.id]) return;
      let ok = false; try { ok = a.test(); } catch (e) {}
      if (ok) { d.achievements[a.id] = CF.today(); CF.Save.save(); setTimeout(() => { CF.toast(`${a.icon} 成就解锁：${a.name}`, 'gold', 3200); CF.Audio.sfx('unlock'); }, 300); }
    });
  };
})();

</script>
<script>
/* js/labs.js */
/* 实验室：8 个可交互的实操实验 */
(function () {
  const CF = window.CF;
  const META = {
    gd: { name: '梯度下降', d: 'ai', icon: '📉', desc: '亲手训练一条直线：感受学习率太小、刚好、太大的区别。', dims: { zhi: 0.5 } },
    perceptron: { name: '感知机', d: 'ai', icon: '🧠', desc: '调权重把「乱码」和「信号」分开，理解一个神经元在做什么。', dims: { zhi: 0.5 } },
    pid: { name: 'PID 无人机', d: 'emb', icon: '🚁', desc: '调 Kp/Ki/Kd 让载重无人机稳稳悬停在 10 米，还要扛住一阵下压风。', dims: { zhi: 0.4 } },
    robot: { name: '机器人编程', d: 'emb', icon: '🤖', desc: '用指令编程让机器人绕开障碍拿到电池，挑战最少指令数。', dims: { zhi: 0.4 } },
    rocket: { name: '火箭方程', d: 'aero', icon: '🚀', desc: '设计两级火箭把 5 吨卫星送入近地轨道，越轻越好。', dims: { zhi: 0.5 } },
    startup: { name: '创业沙盘', d: 'biz', icon: '💼', desc: '经营一家 AI 初创公司 12 个月：定价、营销、招聘、融资。', dims: { qi: 1 } },
    code: { name: '代码挑战', d: 'ai', icon: '⌨️', desc: '在浏览器里写真代码：ReLU、Softmax、PID、火箭方程……完成 3 个即通关。', dims: { zhi: 0.5 } },
    pixel: { name: '像素工坊', d: null, icon: '🎨', desc: '画一个 16×16 的像素头像，它会出现在战场通讯里。', dims: { mei: 1 } },
  };
  const ORDER = ['gd', 'perceptron', 'pid', 'robot', 'rocket', 'startup', 'code', 'pixel'];
  const L = (CF.Labs = { META, ORDER });

  // ---------- 通用外壳 ----------
  function shell(id, introHtml) {
    const m = META[id];
    const body = CF.h(`<div class="lab"><div class="lab-msg">${introHtml}</div><div class="lab-main"><div class="lab-cv"><canvas></canvas></div><div class="lab-side"></div></div></div>`);
    let ro = null;
    CF.modal.open({ title: `${m.icon} 实验室 · ${m.name}`, body, wide: true, onClose: () => { if (ro) ro.disconnect(); CF.bus.emit('lab:closed'); } });
    const cv = body.querySelector('canvas'), box = body.querySelector('.lab-cv'), side = body.querySelector('.lab-side');
    const msgEl = CF.h('<div class="lab-msg">准备就绪。</div>');
    const ref = {
      body, cv, side, ctx: cv.getContext('2d'), w: 0, h: 0, draw: () => {},
      fit() { const dpr = Math.min(2, window.devicePixelRatio || 1); ref.w = box.clientWidth; ref.h = box.clientHeight; cv.width = Math.max(1, ref.w * dpr); cv.height = Math.max(1, ref.h * dpr); ref.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); },
      msg(html, cls = '') { msgEl.className = 'lab-msg ' + cls; msgEl.innerHTML = html; },
      msgEl,
    };
    if (window.ResizeObserver) { ro = new ResizeObserver(() => { ref.fit(); ref.draw(); }); ro.observe(box); }
    setTimeout(() => { ref.fit(); ref.draw(); }, 30);
    return ref;
  }
  function slider(label, min, max, step, val, fmt, on) {
    const el = CF.h(`<label class="slider"><div class="row"><span>${label}</span><b></b></div><input type="range" min="${min}" max="${max}" step="${step}" value="${val}"></label>`);
    const inp = el.querySelector('input'), b = el.querySelector('b');
    const upd = () => { b.textContent = fmt(+inp.value); };
    inp.addEventListener('input', () => { upd(); on(+inp.value); });
    upd();
    el.set = (v) => { inp.value = v; upd(); };
    return el;
  }
  function btn(text, cls, on) { const b = CF.h(`<button class="btn ${cls || ''}">${text}</button>`); b.onclick = () => { CF.Audio.sfx('click'); on(b); }; return b; }
  function row(...els) { const r = CF.h('<div class="row wrap"></div>'); els.forEach((e) => r.appendChild(e)); return r; }
  const starStr = (n) => '★'.repeat(n) + '☆'.repeat(3 - n);
  function plotFrame(ctx, x, y, w, h, title) {
    ctx.strokeStyle = '#2b2641'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w, h);
    ctx.fillStyle = '#9d96ad'; ctx.font = '11px ui-monospace,monospace'; ctx.fillText(title, x + 6, y + 14);
  }

  // =================== 1. 梯度下降 ===================
  L.gd = function () {
    const rnd = CF.rng(42), xs = [], ys = [];
    for (let i = 0; i < 14; i++) { const x = -3 + (6 * i) / 13; xs.push(x); ys.push(1.5 * x + 2 + (rnd() - 0.5) * 1.6); }
    const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
    let sxy = 0, sxx = 0; xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; });
    const wStar = sxy / sxx, bStar = my - wStar * mx;
    const loss = (w, b) => xs.reduce((s, x, i) => s + (w * x + b - ys[i]) ** 2, 0) / n;
    const minL = loss(wStar, bStar), goal = minL + 0.05;
    const S = { w: -1, b: -1, lr: 0.05, steps: 0, hist: [], touched: false, done: false };
    S.hist.push(loss(S.w, S.b));
    const R = shell('gd', '<b>目标：</b>用梯度下降把损失（MSE）降到 <span class="mono">' + goal.toFixed(2) + '</span> 以下。<br>先拖 w、b 感受「损失地形」，然后点「重置」，只调<b>学习率</b>再训练。步数越少星越多——学习率太大会发散。');
    const wS = slider('w（斜率）', -3, 5, 0.05, S.w, (v) => v.toFixed(2), (v) => { S.w = v; S.touched = true; S.hist.push(loss(S.w, S.b)); R.draw(); info(); });
    const bS = slider('b（截距）', -4, 6, 0.05, S.b, (v) => v.toFixed(2), (v) => { S.b = v; S.touched = true; S.hist.push(loss(S.w, S.b)); R.draw(); info(); });
    const lrS = slider('学习率 η', 0.01, 0.4, 0.01, S.lr, (v) => v.toFixed(2), (v) => { S.lr = v; });
    const kpi = CF.h('<div class="lab-msg mono small"></div>');
    function step() {
      if (S.done) return;
      let gw = 0, gb = 0;
      xs.forEach((x, i) => { const e = S.w * x + S.b - ys[i]; gw += (2 / n) * e * x; gb += (2 / n) * e; });
      S.w -= S.lr * gw; S.b -= S.lr * gb; S.steps++;
      const L0 = loss(S.w, S.b);
      S.hist.push(L0);
      wS.set(CF.clamp(S.w, -3, 5)); bS.set(CF.clamp(S.b, -4, 6));
      if (!isFinite(L0) || L0 > 1e4) { R.msg('💥 <b>发散了！</b>学习率太大，每一步都跨过了谷底并越跳越远。点「重置」换个更小的学习率。', 'bad'); S.done = true; CF.Audio.sfx('wrong'); }
      else if (L0 <= goal) {
        S.done = true;
        if (S.touched) { R.msg('达到目标！但你手动拖过 w/b——点「重置」后只用梯度下降再来一次才算数。'); return; }
        const stars = S.steps <= 6 ? 3 : S.steps <= 15 ? 2 : 1;
        R.msg(`✅ 用 <b>${S.steps}</b> 步收敛，${starStr(stars)}<br>学习率 ${S.lr.toFixed(2)}。最优学习率附近收敛最快；超过约 0.30 就会发散。这就是训练大模型时调「学习率」的意义。`, 'ok');
        CF.Audio.sfx('correct');
        CF.P.finishLab('gd', stars);
      }
    }
    function info() { kpi.innerHTML = `损失 ${S.hist[S.hist.length - 1].toFixed(3)}　目标 ≤ ${goal.toFixed(2)}<br>步数 ${S.steps}　w=${S.w.toFixed(2)} b=${S.b.toFixed(2)}`; }
    let timer = null;
    R.side.append(wS, bS, lrS,
      row(btn('单步', '', () => { step(); R.draw(); info(); }), btn('训练 ▶', 'primary', () => { clearInterval(timer); let k = 0; timer = setInterval(() => { if (S.done || k++ > 60) return clearInterval(timer); step(); R.draw(); info(); }, 120); }), btn('重置', 'ghost', () => { clearInterval(timer); Object.assign(S, { w: -1, b: -1, steps: 0, hist: [loss(-1, -1)], touched: false, done: false }); wS.set(-1); bS.set(-1); R.msg('已重置。只调学习率，然后训练。'); R.draw(); info(); })),
      kpi, R.msgEl);
    info();
    R.draw = function () {
      const { ctx, w, h } = R; ctx.clearRect(0, 0, w, h);
      const pw = w * 0.58, ph = h - 16;
      plotFrame(ctx, 8, 8, pw - 12, ph, '数据与拟合直线');
      const X = (x) => 8 + ((x + 3.5) / 7) * (pw - 12), Y = (y) => 8 + ph - ((y + 4) / 12) * ph;
      ctx.strokeStyle = '#2b2641'; ctx.beginPath(); ctx.moveTo(X(-3.5), Y(0)); ctx.lineTo(X(3.5), Y(0)); ctx.moveTo(X(0), Y(-4)); ctx.lineTo(X(0), Y(8)); ctx.stroke();
      xs.forEach((x, i) => { ctx.fillStyle = '#3fd0c9'; ctx.fillRect(X(x) - 3, Y(ys[i]) - 3, 6, 6); ctx.strokeStyle = '#ff4f9a55'; ctx.beginPath(); ctx.moveTo(X(x), Y(ys[i])); ctx.lineTo(X(x), Y(S.w * x + S.b)); ctx.stroke(); });
      ctx.strokeStyle = '#d97757'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(X(-3.5), Y(S.w * -3.5 + S.b)); ctx.lineTo(X(3.5), Y(S.w * 3.5 + S.b)); ctx.stroke(); ctx.lineWidth = 1;
      const lx = pw + 4, lw = w - pw - 12;
      plotFrame(ctx, lx, 8, lw, ph, '损失曲线（对数）');
      const hs = S.hist.slice(-80), lmax = Math.log10(Math.max(...hs.filter(isFinite), 1) + 1), lmin = Math.log10(minL);
      const LY = (v) => 8 + 20 + (1 - (Math.log10(Math.max(v, minL)) - lmin) / Math.max(0.01, lmax - lmin)) * (ph - 30);
      ctx.strokeStyle = '#6fdc8c88'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(lx, LY(goal)); ctx.lineTo(lx + lw, LY(goal)); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = '#e9b949'; ctx.lineWidth = 2; ctx.beginPath();
      hs.forEach((v, i) => { const px = lx + 6 + (i / Math.max(1, hs.length - 1)) * (lw - 12), py = LY(isFinite(v) ? Math.min(v, 1e4) : 1e4); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
      ctx.stroke(); ctx.lineWidth = 1;
    };
  };

  // =================== 2. 感知机 ===================
  L.perceptron = function () {
    const rnd = CF.rng(7), pts = [];
    while (pts.length < 24) {
      const lab = pts.length % 2 ? 1 : -1, cx = lab > 0 ? 1.2 : -1.1, cy = lab > 0 ? 0.9 : -0.9;
      const x = cx + (rnd() - 0.5) * 2.2, y = cy + (rnd() - 0.5) * 2.2;
      if ((x + y - 0.05) * lab > 0.35) pts.push({ x, y, l: lab });
    }
    const S = { w1: 0.6, w2: -1.2, b: 0.6, auto: 0, done: false };
    const R = shell('perceptron', '<b>感知机 = 最简单的神经元：</b>输出 = sign(w₁·x + w₂·y + b)。<br>橙色方块是我方「信号」，粉色是「乱码」。调三个参数让分界线把它们完全分开（准确率 100%）。纯手动完成得 3 星。');
    const acc = () => pts.filter((p) => Math.sign(S.w1 * p.x + S.w2 * p.y + S.b) === p.l).length / pts.length;
    const kpi = CF.h('<div class="lab-msg mono small"></div>');
    const check = () => {
      const a = acc();
      kpi.innerHTML = `准确率 ${(a * 100).toFixed(0)}%　自动训练轮数 ${S.auto}`;
      if (a === 1 && !S.done) {
        S.done = true;
        const stars = S.auto === 0 ? 3 : S.auto <= 2 ? 2 : 1;
        R.msg(`✅ 全部分对！${starStr(stars)}<br>你刚才做的就是神经网络训练的本质：找到一组权重让预测与标签一致。现代网络有数十亿个这样的权重，由梯度下降自动调整。`, 'ok');
        CF.Audio.sfx('correct'); CF.P.finishLab('perceptron', stars);
      }
    };
    const s1 = slider('w₁', -3, 3, 0.1, S.w1, (v) => v.toFixed(1), (v) => { S.w1 = v; R.draw(); check(); });
    const s2 = slider('w₂', -3, 3, 0.1, S.w2, (v) => v.toFixed(1), (v) => { S.w2 = v; R.draw(); check(); });
    const s3 = slider('b（偏置）', -3, 3, 0.1, S.b, (v) => v.toFixed(1), (v) => { S.b = v; R.draw(); check(); });
    R.side.append(s1, s2, s3, row(btn('自动训练 1 轮', '', () => {
      S.auto++;
      pts.forEach((p) => { const o = Math.sign(S.w1 * p.x + S.w2 * p.y + S.b) || 1; if (o !== p.l) { S.w1 += 0.3 * p.l * p.x; S.w2 += 0.3 * p.l * p.y; S.b += 0.3 * p.l; } });
      S.w1 = CF.clamp(S.w1, -3, 3); S.w2 = CF.clamp(S.w2, -3, 3); S.b = CF.clamp(S.b, -3, 3);
      s1.set(S.w1); s2.set(S.w2); s3.set(S.b);
      R.msg('感知机学习规则：对每个分错的点，w ← w + η·标签·输入。错了就往正确方向挪一点。');
      R.draw(); check();
    })), kpi, R.msgEl);
    check();
    R.draw = function () {

      slider('二级推进剂', 10, 120, 5, C.p2, (v) => v + ' t', (v) => { C.p2 = v; upd(); }), kpi, row(btn('🚀 发射', 'primary', launch)), R.msgEl);
    R.draw = function () {
      const { ctx, w, h } = R; ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = '#3fd0c955'; ctx.beginPath(); ctx.arc(w / 2, h + w * 1.2, w * 1.3, 0, Math.PI * 2); ctx.fill();

  // =================== 6. 创业沙盘 ===================

  // =================== 7. 代码挑战 ===================
  const WORKER_SRC = `onmessage=function(e){var d=e.data,f;try{f=new Function(d.code+"\\n;return typeof "+d.fn+"==='function'?"+d.fn+":null;")();}catch(err){postMessage({error:'语法错误：'+err.message});return;}if(!f){postMessage({error:'没有找到函数 '+d.fn+'，请保留函数名'});return;}var res=d.tests.map(function(t){try{return{got:f.apply(null,JSON.parse(JSON.stringify(t[0])))};}catch(err){return{err:String(err&&err.message||err)};}});postMessage({res:res});};`;
  function runTests(c, code) {
    return new Promise((resolve) => {
      let w = null;
      try { w = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }))); } catch (e) { w = null; }

      if (!w) { // 退化：同步执行

  const close = (a, b) => {
    if (Array.isArray(b)) return Array.isArray(a) && a.length === b.length && a.every((x, i) => close(x, b[i]));

  L.code = function () {
    const body = CF.h('<div class="lab"><div class="lab-msg">在浏览器里写真正的 JavaScript。完成任意 <b>3</b> 个挑战即通关本实验（每个挑战都有实操经验）。<br><span class="muted">AI 领域主流语言是 Python——这些函数在线下任务里请再用 Python 写一遍。</span></div><div class="lab-main"><div class="lab-side" style="flex:0 1 230px" id="cList"></div><div style="flex:1 1 380px;display:flex;flex-direction:column;gap:8px;min-width:0"><div id="cDesc" class="lab-msg"></div><textarea class="code" id="cCode" spellcheck="false"></textarea><div class="row"><button class="btn primary" id="cRun">▶ 运行测试</button><button class="btn ghost" id="cReset">恢复初始代码</button></div><div class="lab-msg testlog" id="cLog">—</div></div></div></div>');

  const PIX_PAL = ['transparent', '#d97757', '#b85f40', '#1b1226', '#ede6d6', '#8b80d6', '#5b3aa8', '#e9b949', '#3fd0c9', '#ff4f9a', '#6fdc8c'];

<script>
/* js/academy.js */
/* 学院、实验室列表、成长档案、成就页面 */
(function () {
  const CF = window.CF;
  const C = () => CF.Content;
  const S = () => CF.Save.data;
  const A = (CF.Academy = { tab: 'daily' });

  // ---------- 配比条 ----------
  A.ratioHtml = function () {
    const r = CF.P.ratio(), k = Math.round(r.kPct * 100), p = 100 - k;
    return `<div class="ratio"><span class="c-corp">知识 ${r.t ? k : 0}%</span><div class="rbar"><i class="k" style="width:${r.t ? k : 30}%"></i><i class="p" style="width:${r.t ? p : 70}%"></i><b class="mark" title="目标 30%"></b></div><span style="color:var(--orange2)">实操 ${r.t ? p : 0}%</span></div><div class="small muted" style="margin-top:6px">${CF.P.suggestion().text}</div>`;
  };

  // ---------- 测验 ----------
  A.pickQuestions = function (domain, n) {
    const seen = S().quiz.seen;
    let pool = C().QUIZ.filter((q) => !domain || domain === 'all' || q.d === domain);
    if (domain === 'wrong') pool = C().QUIZ.filter((q) => seen[q.id] && seen[q.id].w > seen[q.id].c);
    const score = (q) => { const s = seen[q.id]; if (!s) return Math.random(); return 1 + s.c * 2 - s.w * 1.5 + Math.random() * 1.5 + (Date.now() - (s.last || 0) < 3600e3 ? 5 : 0); };
    return pool.map((q) => [score(q), q]).sort((a, b) => a[0] - b[0]).slice(0, n).map((x) => x[1]);
  };
  A.quiz = function ({ domain = 'all', n = 5, onDone = null, title = '知识测验', inBattle = false } = {}) {
    const qs = A.pickQuestions(domain, n);
    if (!qs.length) { CF.toast('这个分类暂时没有题目（错题本是空的）'); return; }
    let i = 0, right = 0;
    const body = CF.modal.open({ title, closable: !inBattle, onClose: () => { if (inBattle && i < qs.length) onDone && onDone(right, qs.length); } });
    const render = () => {
      const q = qs[i];
      const order = CF.shuffle(q.o.map((t, k) => k));
      body.innerHTML = `<div class="row between small muted"><span>${C().DOMAINS[q.d].icon} ${C().DOMAINS[q.d].name}</span><span>${i + 1} / ${qs.length}</span></div><div class="quiz-q">${CF.esc(q.q)}</div><div class="quiz-opts"></div><div class="nextwrap"></div>`;
      const box = body.querySelector('.quiz-opts');
      order.forEach((k, idx) => {
        const b = CF.h(`<button class="quiz-opt"><span class="mono muted">${'ABCD'[idx]}.</span> ${CF.esc(q.o[k])}</button>`);
        b.onclick = () => {
          if (box.dataset.done) return; box.dataset.done = 1;
          const ok = k === q.a;
          if (ok) right++;
          CF.$$('.quiz-opt', box).forEach((el, j) => { if (order[j] === q.a) el.classList.add('right'); });
          if (!ok) b.classList.add('wrong');
          CF.Audio.sfx(ok ? 'correct' : 'wrong');
          CF.P.answerQuiz(q, ok);
          const nx = body.querySelector('.nextwrap');
          nx.innerHTML = `<div class="explain">${ok ? '✅ 正确！' : '❌ 正确答案已标出。'}<br>${CF.esc(q.e)}</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary">${i + 1 < qs.length ? '下一题 →' : '完成'}</button></div>`;
          nx.querySelector('button').onclick = () => { CF.Audio.sfx('click'); i++; if (i < qs.length) render(); else finish(); };
        };
        box.appendChild(b);
      });
    };
    const finish = () => {
      if (onDone) { CF.modal.close(); onDone(right, qs.length); return; }
      body.innerHTML = `<div style="text-align:center;padding:20px"><div style="font-size:42px">${right === qs.length ? '🏆' : right >= qs.length / 2 ? '👍' : '📖'}</div><h3 style="margin:10px 0">答对 ${right} / ${qs.length}</h3><p class="muted small">知识是地图，实操是走路。记得按 3:7 去实验室或做线下任务。</p><div class="row" style="justify-content:center;margin-top:16px;gap:8px"><button class="btn" data-a="again">再来一组</button><button class="btn primary" data-a="lab">去实验室</button></div></div>`;

      body.querySelector('[data-a=lab]').onclick = () => { CF.modal.close(); CF.UI.show('labs'); };
