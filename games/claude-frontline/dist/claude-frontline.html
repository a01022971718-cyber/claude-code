<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>造月之路</title>
<style>
/* X-S战线 · 造物者之路 —— 样式
 * 设计依据：art/01-typography-constitution.md（字体美术宪法）与 art/02-game-ui-constitution.md（游戏界面视觉宪法） */
:root{
  /* 表面与文字 */
  --bg:#0b0a12; --bg2:#110f1b; --panel:#161325; --panel2:#1d1930; --line:#2b2641; --line2:#3a3357;
  --text:#ede6d6; --dim:#9d96ad; --mute:#6c6680;
  /* X-S 品牌：紫夜（未知）· 破晓（新生）· 探索青（探索） */
  --night:#22144c; --night2:#33207a; --dawn1:#ff7a45; --dawn2:#ffb14a; --dawn3:#ffe08a; --explore:#4ef0ff;
  --dawn:linear-gradient(0deg,var(--dawn1),var(--dawn2) 60%,var(--dawn3));
  /* 资源与阵营 */
  --orange:#ec8a5e; --orange2:#ff9a6c; --gold:#e9b949; --cyan:#3fd0c9; --violet:#9b7bff;
  --pdeep:#241650; --purple:#5b3aa8; --plight:#a99be0;
  --pink:#ff4f9a; --ecyan:#29e0e0; --good:#6fdc8c; --bad:#ff5d6c;
  /* 英雄主题（由 JS 按当前英雄写入） */
  --hero:#9b7bff; --hero2:#ff9a5c; --hero-rgb:155,123,255; --hero2-rgb:255,154,92; --hero-bg0:#22144c; --hero-bg1:#33207a; --hero-bg2:#4a2fa0;
  --beat:0;
  /* 字体 */
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --display:"Avenir Next","Segoe UI Variable Display","Segoe UI","Helvetica Neue",Arial,var(--sans);
  --fs-xs:11px; --fs-sm:12px; --fs-md:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:25px; --fs-3xl:31px; --fs-4xl:39px; --fs-5xl:49px;
  /* 动效 */
  --d1:120ms; --d2:200ms; --d3:320ms; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
textarea,input[type=text]{-webkit-user-select:text;user-select:text;touch-action:auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#app.rotated{width:100vh;height:100vw;inset:auto;left:0;top:0;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.reduce-motion *{animation-duration:.01ms!important;transition-duration:.01ms!important}

/* ================= 字体美术宪法：可复用字体类 ================= */
.wm{display:inline-flex;align-items:center;gap:.32em;font-family:var(--display);font-weight:900;letter-spacing:.02em;line-height:1;white-space:nowrap}
.wm-mark{width:1.15em;height:1.15em;flex:none;filter:drop-shadow(0 0 calc(4px + var(--beat)*10px) rgba(255,160,80,.55))}
.wm-mark .star{transform-origin:24px 24px;transform:scale(calc(1 + var(--beat)*.12))}
.wm-latin{background:var(--dawn);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.wm-cjk{color:var(--text);font-family:var(--sans);font-weight:800;letter-spacing:.06em}
.wm-shadow{filter:drop-shadow(0 3px 0 rgba(10,6,30,.65)) drop-shadow(0 0 18px rgba(var(--hero-rgb),calc(.25 + var(--beat)*.35)))}
.pi{--ic2:var(--hero);display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;overflow:visible;filter:drop-shadow(0 1px 0 rgba(10,6,30,.55))}
.pi-wrap{white-space:pre-wrap}
.kl{display:block;height:1em;width:auto;overflow:visible;filter:drop-shadow(0 0 calc(10px + var(--beat)*14px) rgba(var(--hero-rgb),calc(.25 + var(--beat)*.35)))}
.kl .kl-spin{transform-box:fill-box;transform-origin:50% 57%;transform:scale(calc(1 + var(--beat)*.05))}
.gicon{width:1em;height:1em;display:inline-block}
.kl .kl-glow{opacity:calc(.75 + var(--beat)*.25)}
.kl .kl-sheen{animation:klSheen 6s cubic-bezier(.4,0,.2,1) infinite}
.kl .kl-px{transform-box:fill-box;transform-origin:center;animation:klPx 3.6s linear infinite;opacity:0}
@keyframes klSheen{0%{transform:translateY(1150px)}16%,100%{transform:translateY(-260px)}}
@keyframes klPx{0%{transform:translateY(160px);opacity:0}15%{opacity:.9}70%{opacity:.6}100%{transform:translateY(-120px);opacity:0}}
.reduce-motion .kl *{animation:none!important}
@media (prefers-reduced-motion:reduce){.kl *{animation:none!important}}
.t-display{font-size:var(--fs-5xl);font-weight:900;line-height:1.05;letter-spacing:.04em}
.t-h1{font-size:var(--fs-3xl);font-weight:800;line-height:1.15;letter-spacing:.05em}
.t-h2{font-size:var(--fs-xl);font-weight:800;line-height:1.25;letter-spacing:.04em}
.t-h3{font-size:var(--fs-lg);font-weight:700;line-height:1.3}
.t-body{font-size:var(--fs-md);line-height:1.7}
.t-cap{font-size:var(--fs-sm);color:var(--dim);line-height:1.6}
.t-tag{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--hero2)}
.t-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
.t-quote{font-size:var(--fs-lg);font-weight:600;letter-spacing:.04em}
.t-quote::before{content:"「";color:var(--hero2)} .t-quote::after{content:"」";color:var(--hero2)}
.t-rise > span{display:inline-block;animation:rise var(--d3) var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.accent{color:var(--hero2)}

/* ---------- 通用屏幕 ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.active{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.scr-body{flex:1;min-height:0;padding:16px;max-width:1100px;width:100%;margin:0 auto}
/* 页面底纹：随节拍呼吸的像素网格（全 UI 共享） */
.screen:not(#scr-lobby):not(#scr-battle):not(#scr-quick){background:
  linear-gradient(rgba(var(--hero-rgb),calc(.025 + var(--beat)*.03)) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,rgba(var(--hero-rgb),calc(.025 + var(--beat)*.03)) 1px,transparent 1px) 0 0/24px 24px,
  radial-gradient(1200px 600px at 85% -10%,rgba(var(--hero-rgb),.12),transparent 60%),var(--bg)}

/* 紫色像素「Ultra」条 —— 来自参考视频，所有页眉共用 */
.ultrabar{position:relative;height:64px;margin:12px 16px 0;border-radius:14px;overflow:hidden;flex:none;background:linear-gradient(90deg,var(--hero-bg0),var(--hero-bg1) 70%,var(--hero-bg2));box-shadow:0 0 calc(var(--beat)*24px) rgba(var(--hero-rgb),.35)}
.ultrabar canvas{position:absolute;inset:0;width:100%;height:100%}
.ultrabar .ub-title{position:absolute;left:56px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:800;letter-spacing:.08em;text-shadow:0 2px 0 rgba(10,6,30,.6)}
.ultrabar .ub-sub{font-size:12px;font-weight:400;color:#ffffffcc;margin-left:10px;letter-spacing:.02em}
.ultrabar .back{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:10px;font-size:22px;color:#fff;background:#0003}
.ultrabar .back:hover{background:#0006}
.ultrabar .ub-right{position:absolute;right:120px;top:50%;transform:translateY(-50%);display:flex;gap:8px;align-items:center}

/* 品牌小标（HUD 等处） */
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:1px;white-space:nowrap}
.diamond{width:9px;height:9px;display:inline-block;transform:rotate(45deg);animation:dspin 3s linear infinite;flex:none}
@keyframes dspin{0%{transform:rotate(45deg) scale(1)}50%{transform:rotate(225deg) scale(.75)}100%{transform:rotate(405deg) scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.c-chip{color:var(--gold)} .c-corp{color:var(--cyan)} .c-comp{color:var(--violet)}
.bg-chip{background:var(--gold)} .bg-corp{background:var(--cyan)} .bg-comp{background:var(--violet)}

/* 按钮：主按钮使用破晓渐变 + 像素微光 + 节拍光晕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);font-size:14px;transition:var(--d1) var(--ease);white-space:nowrap}
.btn:hover{border-color:rgba(var(--hero-rgb),.8);background:#262043}
.btn:active{transform:scale(.97)}
.btn.primary{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--dawn2),var(--dawn1));border-color:#ffc27a;color:#2a1206;font-weight:800;box-shadow:0 0 calc(var(--beat)*16px) rgba(255,154,80,.55)}
.btn.primary::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.18) 6px 8px);transform:translateX(-100%);animation:shimmer 2.4s steps(12) infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.violet{background:linear-gradient(180deg,rgba(var(--hero-rgb),.95),rgba(var(--hero-rgb),.6));border-color:rgba(var(--hero-rgb),1);color:#fff;font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;background:#ffffff10;border:1px solid #ffffff1a;white-space:nowrap}
.pill.k{color:var(--cyan);border-color:#3fd0c955;background:#3fd0c914}
.pill.p{color:var(--orange2);border-color:#d9775766;background:#d9775718}


/* 卡片 */
/* 卡片 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{font-size:15px;margin-bottom:6px}
.card p{font-size:13px;color:var(--dim);line-height:1.6}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--dim)}
.small{font-size:12px}
.sec-title{font-size:13px;color:var(--dim);letter-spacing:2px;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* 进度条 */
.bar{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--orange)}


/* ================= 大厅（功能枢纽：信息密度高，中央留给英雄） ================= */
#scr-lobby{background:var(--hero-bg0)}
#scr-lobby canvas.stage-bg{position:absolute;inset:0;width:100%;height:100%}
.lob{position:absolute;z-index:2}
.lob-tl{left:20px;top:16px;display:flex;flex-direction:column;gap:10px}
.lob-logo{font-size:84px;line-height:1;margin-left:-6px}
.lob-sub{font-size:13px;letter-spacing:.32em;color:#ffffffcc;margin-top:-2px;padding-left:2px}
.lob-prof{display:flex;align-items:center;gap:10px;background:#0b0820b3;border:1px solid #ffffff1f;border-radius:14px;padding:8px 12px;backdrop-filter:blur(6px);width:max-content;cursor:pointer}
.lob-prof canvas{width:40px;height:40px;border-radius:10px;background:rgba(var(--hero-rgb),.25)}
.lob-prof .rk{font-weight:800;color:var(--gold);font-size:14px}
.lob-prof .bar{width:140px;height:5px;margin-top:4px}
.lob-tr{right:16px;top:14px;display:flex;gap:8px;align-items:center}
.lob-res{display:flex;gap:10px;background:#0b0820b3;border:1px solid #ffffff1f;border-radius:99px;padding:6px 12px;font-family:var(--mono);font-size:13px}
.lob-res span{display:flex;align-items:center;gap:5px}
.lob-stam{display:flex;align-items:baseline;gap:3px;background:#0b0820b3;border:1px solid #ffffff1f;border-radius:99px;padding:6px 12px;font-size:13px;color:#ffe08a}
.lob-stam b{font-size:14px}.lob-stam .small{color:#ffffffaa}
.lob-stam .bank{font-style:normal;font-size:10px;color:#2a1206;background:var(--gold);border-radius:6px;padding:0 4px;margin-left:4px}
.learn-timer{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:#0b0820e6;border:1px solid rgba(var(--hero-rgb),.6);font-size:12px;box-shadow:0 0 calc(6px + var(--beat)*10px) rgba(var(--hero-rgb),.4);pointer-events:none}
.learn-timer i{width:80px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--hero2) var(--p),#ffffff22 var(--p))}
.learn-timer.hidden{display:none}
.learn-timer.top{bottom:18px;left:auto;right:24px;transform:none}
.land .lob-stam{padding:4px 8px;font-size:11px}
.icon-btn{width:38px;height:38px;border-radius:11px;background:#0b0820b3;border:1px solid #ffffff1f;font-size:16px;display:grid;place-items:center;transition:var(--d1)}
.icon-btn:hover{border-color:rgba(var(--hero-rgb),.9)}
.lob-hero{left:4vw;bottom:96px;max-width:min(520px,44vw)}
.lob-hero .side{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--hero2)}
.lob-hero .nm{font-size:var(--fs-4xl);font-weight:900;letter-spacing:.08em;text-shadow:0 3px 0 rgba(10,6,30,.6)}
.lob-hero .nm small{font-size:var(--fs-lg);font-weight:600;margin-left:10px;color:#ffffffcc;letter-spacing:.1em}
.lob-hero .q{margin-top:6px;color:#fff}
.lob-hero .row{margin-top:10px}
.hero-arrow{position:absolute;top:50%;z-index:3;width:44px;height:64px;border-radius:12px;background:#0b082088;border:1px solid #ffffff22;font-size:22px;color:#fff;transform:translateY(-50%)}
.hero-arrow:hover{border-color:rgba(var(--hero-rgb),1)}
.lob-modes{right:28px;top:50%;transform:translateY(-38%);display:flex;flex-direction:column;gap:10px;perspective:900px;width:min(380px,40vw)}
.mode{position:relative;height:74px;border-radius:14px;overflow:hidden;text-align:left;padding:0 20px;background:#ffffffde;color:#1e1636;box-shadow:0 10px 30px #0006;transform:rotateY(-14deg) translateZ(0);transform-origin:right center;transition:transform var(--d2) var(--spring),filter var(--d2)}
.mode canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity var(--d2)}
.mode .mt{position:relative;z-index:1;font-size:21px;font-weight:900;letter-spacing:.08em;display:block;margin-top:22px}
.mode .ms{position:relative;z-index:1;font-size:12px;opacity:.7;letter-spacing:.04em}
.mode .tag{position:absolute;z-index:1;left:20px;top:9px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#ff6a3d}
.mode.on{color:#fff;transform:rotateY(-6deg) translateX(-8px)}
.mode.on canvas{opacity:1}
.mode.on .tag{color:var(--dawn3)}
.mode.big{height:92px}
.mode.big .mt{font-size:26px;margin-top:26px}
.lob-side{right:28px;top:66px;display:flex;gap:8px;width:min(380px,40vw)}
.lob-side .act{flex:1;min-width:0}
.act{background:#0b0820b3;border:1px solid #ffffff1f;border-radius:12px;padding:9px 12px;text-align:left;font-size:12px;backdrop-filter:blur(6px);transition:var(--d1)}
.act:hover{border-color:rgba(var(--hero-rgb),.9)}
.act b{display:block;font-size:14px;margin-bottom:3px}
.act .bar{height:4px;margin-top:6px}
.lob-nav{left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;background:#0b0820c7;border:1px solid #ffffff1f;border-radius:16px;padding:6px;backdrop-filter:blur(8px)}
.lob-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:6px 8px;border-radius:11px;font-size:11px;color:#ffffffcc;transition:var(--d1)}
.lob-nav button span{font-size:18px;line-height:1}
.lob-nav button:hover,.lob-nav button.on{background:rgba(var(--hero-rgb),.25);color:#fff}
.bubble{position:absolute;z-index:4;max-width:260px;background:#fff;color:#1e1636;border-radius:14px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:0 6px 20px #0006;animation:pop var(--d3) var(--spring)}
.bubble::after{content:"";position:absolute;left:24px;bottom:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.9)}}

/* ================= 英雄图鉴与详情（菜单界面：信息密度是正面品质） ================= */
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.hcard{position:relative;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:transform var(--d2) var(--spring),border-color var(--d1)}
.hcard:hover{transform:translateY(-3px)}
.hcard canvas{display:block;width:100%;height:150px}
.hcard .hbody{padding:10px 12px}
.hcard .hn{font-size:18px;font-weight:900;letter-spacing:.06em}
.hcard .hn small{font-size:12px;font-weight:500;color:var(--dim);margin-left:6px}
.hcard .hi{font-size:12px;color:var(--dim);margin-top:2px}
.hcard .sw{display:flex;gap:3px;margin-top:8px}
.hcard .sw i{width:14px;height:14px;border-radius:3px}
.hcard .cur{position:absolute;right:10px;top:10px;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--dawn2);color:#2a1206;font-weight:800}
.hcard .side{position:absolute;left:10px;top:10px;font-size:11px;padding:2px 8px;border-radius:99px;background:#0008;color:#fff;font-family:var(--mono)}
.hd{display:flex;gap:16px;flex-wrap:wrap}
.hd-stage{flex:1 1 380px;min-height:320px;border-radius:16px;overflow:hidden;position:relative}
.hd-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.hd-stage .nm{position:absolute;left:18px;bottom:14px;z-index:1}
.hd-info{flex:1 1 380px;min-width:0}
.skill{display:flex;gap:12px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.skill .k{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--mono);font-weight:900;font-size:16px;flex:none;background:rgba(var(--hero-rgb),.18);border:1px solid rgba(var(--hero-rgb),.6);color:#fff}
.skill h4{font-size:15px}
.skill p{font-size:12px;color:var(--dim);line-height:1.6;margin-top:2px}
.skill .meta{font-family:var(--mono);font-size:11px;color:var(--hero2);margin-top:3px}
.swatches-big{display:flex;gap:6px;flex-wrap:wrap}
.swatches-big div{width:46px;text-align:center;font-family:var(--mono);font-size:9px;color:var(--dim)}
.swatches-big i{display:block;width:46px;height:30px;border-radius:7px;margin-bottom:3px;border:1px solid #ffffff22}

/* ================= 弹窗页眉：每个弹窗都有一条英雄像素动效 ================= */
.modal-head{position:relative;overflow:hidden}
.modal-head canvas.mh-fx{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.modal-head h3,.modal-head .x{position:relative;z-index:1}
.modal-head h3{text-shadow:0 2px 0 rgba(10,6,30,.6);letter-spacing:.04em}
.modal-card{box-shadow:0 20px 60px #000a,0 0 calc(var(--beat)*30px) rgba(var(--hero-rgb),.3)}

/* ================= 战斗界面：UI ≤ 18%，四角布局，中央留给战场 ================= */
#scr-battle{background:#07060c}
#field{position:absolute;inset:0;overflow:hidden}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
.hud{position:absolute;z-index:5;pointer-events:none}
.hud > *{pointer-events:auto}
.glass{background:rgba(9,7,20,.62);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);border-radius:12px}
.hud-tl{left:10px;top:10px;display:flex;flex-direction:column;gap:6px;transform-origin:top left}
.hud-res{display:flex;gap:12px;padding:6px 12px;font-family:var(--mono);font-size:13px;align-items:center}
.hud-res .r{display:flex;align-items:center;gap:5px}
.hud-res .r b{min-width:30px}
.hud-res .r i{font-style:normal;font-size:10px;color:var(--dim)}
.hud-res .sup{font-size:11px;color:var(--dim);border-left:1px solid #ffffff22;padding-left:10px}
.hud-cores{display:flex;gap:10px;padding:5px 10px;font-size:10px;align-items:center;width:max-content}
.hud-cores .cb2{width:88px}
.hud-cores .bar{height:5px}
.hud-cores .mine .bar>i{background:var(--orange)}
.hud-cores .foe .bar>i{background:linear-gradient(90deg,var(--pink),var(--ecyan))}
.hud-tc{left:50%;top:8px;transform:translateX(-50%);text-align:center;pointer-events:auto}
.hud-wave{font-family:var(--mono);font-size:13px;text-shadow:0 1px 3px #000;white-space:nowrap}
.hud-wave b{font-size:16px}
.hud-obj{font-size:12px;color:#ffffffd9;text-shadow:0 1px 3px #000;margin-top:2px;cursor:pointer;white-space:nowrap}
.hud-obj.open{white-space:normal;background:rgba(9,7,20,.75);border-radius:10px;padding:6px 10px;text-align:left;max-width:360px}
.hud-tr{right:10px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;transform-origin:top right}
.hud-btns{display:flex;gap:5px}
.hb{width:34px;height:32px;border-radius:9px;font-size:13px;font-family:var(--mono);display:grid;place-items:center}
.hb:hover{border-color:rgba(var(--hero-rgb),.9)}
.hb.on{border-color:var(--hero2);color:var(--hero2)}
.mm{position:relative;width:176px;height:110px;border-radius:10px;overflow:hidden;background:#06050bcc;border:1px solid rgba(255,255,255,.12)}
.mm canvas{width:100%;height:100%;display:block;touch-action:none}
.mm.min{display:none}
.hud-bl{left:10px;bottom:10px;display:flex;align-items:flex-end;gap:8px;transform-origin:bottom left}
.fabx{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:22px;position:relative}
.fabx small{position:absolute;bottom:-2px;left:0;right:0;font-size:9px;text-align:center;color:#ffffffcc}
.fabx.on{border-color:var(--hero2);box-shadow:0 0 12px rgba(var(--hero2-rgb),.6)}
.selchip{padding:6px 10px;font-size:12px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-br{right:14px;bottom:14px;display:flex;align-items:flex-end;gap:10px;transform-origin:bottom right}
.portrait{position:relative;width:66px;height:66px;border-radius:50%;overflow:hidden;cursor:pointer;border:2px solid rgba(var(--hero-rgb),.9);background:radial-gradient(circle,var(--hero-bg2),var(--hero-bg0));box-shadow:0 0 calc(6px + var(--beat)*14px) rgba(var(--hero-rgb),.6)}
.portrait canvas{width:100%;height:100%}
.portrait .lv{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;background:#000a;border-radius:6px;padding:0 4px}
.hpring{position:absolute;inset:-2px;border-radius:50%;pointer-events:none}
.skills{display:flex;gap:8px;align-items:flex-end}
.sk{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:20px;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(var(--hero-rgb),.55),rgba(9,7,20,.85));border:2px solid rgba(var(--hero-rgb),.85);box-shadow:0 0 calc(var(--beat)*12px) rgba(var(--hero-rgb),.7);transition:transform var(--d1) var(--spring)}
.sk.r{width:68px;height:68px;font-size:24px;border-color:var(--hero2)}
.sk:active{transform:scale(.92)}
.sk .key{position:absolute;top:3px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:#ffffffbb}
.sk .cost{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--violet);text-shadow:0 1px 2px #000}
.sk .cdm{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--cd,0%),transparent 0);pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:800;text-shadow:0 1px 3px #000}
.sk.na{filter:grayscale(.7) brightness(.7)}
.sk.aim{border-color:#fff;box-shadow:0 0 16px #fff}
.sk .pas{font-size:9px}
.items{display:flex;gap:4px}
.item{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;position:relative}
.item i{position:absolute;right:1px;bottom:0;font-size:8px;font-style:normal;font-family:var(--mono)}
.comms{position:absolute;left:10px;top:96px;display:flex;gap:8px;align-items:center;max-width:min(380px,46%);padding:6px 10px 6px 6px;z-index:4;transition:opacity .3s;pointer-events:none}
.comms canvas{width:44px;height:44px;border-radius:9px;flex:none}
.comms .who{font-size:10px;color:rgba(var(--hero-rgb),1)}
.comms .say{font-size:12px;line-height:1.45}
.bossbar{position:absolute;left:50%;top:54px;transform:translateX(-50%);width:min(380px,46%);z-index:3;text-align:center;font-size:11px;color:var(--pink);pointer-events:none}
.bossbar .bar{height:7px;margin-top:3px;border:1px solid #ff4f9a66}
.bossbar .bar>i{background:linear-gradient(90deg,var(--pink),var(--ecyan))}
.pausebadge{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:28px;font-weight:900;letter-spacing:8px;color:#fff;text-shadow:0 0 20px rgba(var(--hero-rgb),1);z-index:3;pointer-events:none}
/* 环形菜单：长按/右键空地呼出建造；选中建筑时呼出训练 */
.radial{position:absolute;z-index:8;width:0;height:0}
.radial .rc{position:absolute;left:-23px;top:-23px;width:46px;height:46px;border-radius:50%;border:2px dashed rgba(var(--hero-rgb),.8);pointer-events:none;animation:pop var(--d2) var(--spring)}
.rb{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.1;background:rgba(14,11,28,.92);border:1.5px solid rgba(var(--hero-rgb),.75);box-shadow:0 4px 14px #0008;animation:pop var(--d2) var(--spring) both;color:#fff}
.rb canvas{width:24px;height:24px}
.rb .c{font-family:var(--mono);font-size:8.5px;color:var(--gold)}
.rb:hover{border-color:var(--hero2);transform:scale(1.08)}
.rb.na{opacity:.45}
.rb.lock::after{content:"🔒";position:absolute;top:-4px;right:-2px;font-size:11px}
.rb .q{position:absolute;bottom:-6px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--hero2);color:#2a1206;font-size:10px;font-weight:800;display:grid;place-items:center}
/* 新手教程 */
.tut{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:9;width:min(460px,92%);padding:12px 14px;border-radius:14px;background:rgba(14,10,32,.94);border:1.5px solid rgba(var(--hero-rgb),.9);box-shadow:0 10px 30px #000a,0 0 calc(var(--beat)*20px) rgba(var(--hero-rgb),.5);animation:pop var(--d3) var(--spring)}
.tut .st{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--hero2)}
.tut h4{font-size:15px;margin:2px 0 4px}
.tut p{font-size:12.5px;line-height:1.6;color:#ffffffd9}
.tut .row{justify-content:space-between;margin-top:8px}
.tut-hand{position:absolute;z-index:9;pointer-events:none;width:44px;height:44px;margin:-6px 0 0 -6px;font-size:30px;animation:tap 1.1s var(--ease) infinite;filter:drop-shadow(0 2px 4px #000)}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,8px) scale(.9)}}
.tut-ring{position:absolute;z-index:8;pointer-events:none;border-radius:50%;border:3px solid var(--hero2);box-shadow:0 0 0 4000px rgba(0,0,0,.25),0 0 18px var(--hero2);animation:ringp 1.2s ease-in-out infinite}
@keyframes ringp{50%{transform:scale(1.08)}}
.gest{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.gest .card{display:flex;gap:12px;align-items:flex-start}
.gest .gi{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:24px;background:rgba(var(--hero-rgb),.18);border:1px solid rgba(var(--hero-rgb),.5)}

/* ================= 快速模式（通勤爽局） ================= */
#scr-quick{background:#05040a}
#quickCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.q-top{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;gap:10px;z-index:3;pointer-events:none;font-family:var(--mono)}
.q-score{font-size:24px;font-weight:900;text-shadow:0 2px 0 #0008,0 0 12px rgba(var(--hero-rgb),.8)}
.q-time{font-size:14px;padding-top:7px;color:#ffffffcc}
.q-xp{position:absolute;left:12px;right:12px;top:42px;height:5px;border-radius:9px;background:#ffffff14;z-index:3;overflow:hidden;pointer-events:none}
.q-xp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--hero),var(--hero2))}
.q-combo{position:absolute;right:14px;top:56px;z-index:3;text-align:right;font-family:var(--mono);pointer-events:none}
.q-combo b{display:block;font-size:30px;font-weight:900;color:var(--hero2);text-shadow:0 2px 0 #0008}
.q-combo span{font-size:11px;letter-spacing:.2em}
.q-fever{position:absolute;right:16px;bottom:22px;z-index:4;width:86px;height:86px;border-radius:50%;font-size:14px;font-weight:900;color:#fff;background:conic-gradient(var(--hero2) var(--fv,0%),rgba(255,255,255,.08) 0);border:2px solid rgba(var(--hero-rgb),.9);box-shadow:0 0 calc(var(--beat)*18px) rgba(var(--hero-rgb),.8)}
.q-fever span{display:grid;place-items:center;position:absolute;inset:6px;border-radius:50%;background:rgba(9,7,20,.9)}
.q-fever.ready{animation:ready .5s ease-in-out infinite alternate}
@keyframes ready{to{transform:scale(1.08);box-shadow:0 0 30px var(--hero2)}}
.q-pause{position:absolute;right:12px;top:8px;z-index:4}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.upc{border-radius:14px;padding:14px 10px;text-align:center;background:var(--panel2);border:1.5px solid rgba(var(--hero-rgb),.6);transition:transform var(--d2) var(--spring);animation:pop var(--d3) var(--spring) both}
.upc:hover{transform:translateY(-4px) scale(1.03);border-color:var(--hero2)}
.upc .ic{font-size:30px}
.upc h4{font-size:14px;margin:6px 0 4px}
.upc p{font-size:11.5px;color:var(--dim);line-height:1.5}
.upc .lv{font-family:var(--mono);font-size:10px;color:var(--hero2)}
.rank-big{font-size:72px;font-weight:900;text-align:center;line-height:1;background:var(--dawn);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ================= 主城 ================= */
#scr-city{background:#0a0d18}
#cityCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.city-top{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;z-index:3;pointer-events:none}
.city-top > *{pointer-events:auto}
.city-res{display:flex;gap:12px;padding:7px 12px;font-family:var(--mono);font-size:13px}
.city-res .cap{font-size:10px;color:var(--dim)}
.city-bottom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;z-index:3;padding:6px;max-width:calc(100% - 20px);overflow-x:auto;touch-action:pan-x}
.cbtn{min-width:70px;padding:6px 6px 5px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;background:rgba(255,255,255,.04);border:1px solid transparent}
.cbtn canvas{width:34px;height:34px}
.cbtn .c{font-family:var(--mono);font-size:9px;color:var(--gold)}
.cbtn:hover{border-color:rgba(var(--hero-rgb),.8)}
.cbtn.na{opacity:.45}
.city-panel{position:absolute;right:12px;top:64px;z-index:3;width:min(300px,calc(100% - 24px));padding:12px}
.city-panel h4{font-size:16px}
.city-panel p{font-size:12px;color:var(--dim);line-height:1.6;margin:4px 0}
.timer{font-family:var(--mono);font-size:12px;color:var(--hero2)}
.floaty{position:absolute;z-index:6;pointer-events:none;font-family:var(--mono);font-weight:900;font-size:16px;text-shadow:0 2px 0 #000a;animation:floaty 1.1s var(--ease) forwards}
@keyframes floaty{to{transform:translateY(-46px);opacity:0}}

/* ================= 模式卡片（征程页） ================= */
.lvl{box-shadow:0 0 0 rgba(var(--hero-rgb),0)}
.lvl:hover{box-shadow:0 0 calc(8px + var(--beat)*14px) rgba(var(--hero-rgb),.35)}
.labcard:hover,.card.labcard:hover{box-shadow:0 0 calc(6px + var(--beat)*12px) rgba(var(--hero-rgb),.3)}
.tab.on{border-color:var(--hero2)}
.hero-pick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;touch-action:pan-x}
.hero-pick button{flex:none;width:86px;border-radius:12px;padding:6px 4px;background:var(--panel2);border:1.5px solid var(--line2);font-size:12px;text-align:center}
.hero-pick button canvas{width:72px;height:56px;display:block;margin:0 auto 2px}
.hero-pick button.on{border-color:var(--hero2);box-shadow:0 0 10px rgba(var(--hero2-rgb),.5)}

/* ---------- 战役 ---------- */
.levels{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
/* 征程：章节与关卡路径 */
.chap{margin:6px 0 18px}
.chap-hd{position:relative;height:74px;border-radius:14px;overflow:hidden;background:var(--hero-bg1);display:flex;align-items:center;gap:14px;padding:0 18px;border:1px solid rgba(var(--hero-rgb),.35)}
.chap-hd canvas{position:absolute;inset:0;width:100%;height:100%}
.chap-t{position:relative;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.chap-t b{font-size:var(--fs-xl);font-weight:800;letter-spacing:.04em;text-shadow:0 2px 0 #0007}
.chap-t .small{color:#ffffffcc}
.chap-p{position:relative;display:flex;flex-direction:column;align-items:flex-end}
.chap-drop{position:relative;display:flex;flex-direction:column;align-items:flex-end;margin-right:6px;padding:4px 10px;border-radius:10px;background:#0b0820aa;border:1px solid #ffffff22}
.chap-drop b{font-size:12px;color:var(--gold)}
.chap.shut .chap-hd{filter:saturate(.35) brightness(.75)}
@media (max-width:760px){.chap-drop{display:none}}
.chap-p b{font-size:22px;color:var(--gold)}
.stage-path{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-top:10px}
.stg{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px 10px 9px;border-radius:12px;background:var(--panel);border:1.5px solid var(--line2);min-height:108px;transition:transform var(--d1) var(--ease),box-shadow var(--d1)}
.stg:hover{transform:translateY(-2px);box-shadow:0 0 calc(6px + var(--beat)*12px) rgba(var(--hero-rgb),.35)}
.stg b{font-size:14px;font-weight:800;line-height:1.25}
.stg-no{font-size:11px;color:var(--dim)}
.stg-kind{font-size:10px;letter-spacing:.12em;color:var(--hero2);font-family:var(--mono)}
.stg.story{border-color:#ffb14a77;background:linear-gradient(160deg,#ffb14a1c,var(--panel) 60%)}
.stg.story .stg-kind{color:var(--gold)}
.stg.dungeon{border-color:#ff4f9a88;background:linear-gradient(160deg,#ff4f9a24,var(--panel) 65%);grid-column:span 2;min-height:108px}
.stg.dungeon .stg-kind{color:var(--pink)}
.stg .stars{font-size:11px;color:var(--gold);letter-spacing:1px}.stg .stars i{font-style:normal;color:#3a3357}
.stg.won{border-style:solid}
.stg.locked{opacity:.46;filter:saturate(.4)}
.stg .lock{position:absolute;right:8px;top:8px;width:16px;height:16px;color:#fff}
.stg .lock svg{width:16px;height:16px}
.stg .stamp{position:absolute;right:8px;bottom:8px;font-size:10px;font-weight:800;color:#6fdc8c;border:1.5px solid #6fdc8c;border-radius:6px;padding:0 5px;transform:rotate(-8deg)}
.stg .gift{font-size:10px;color:#2a1206;background:var(--gold);border-radius:6px;padding:1px 6px;font-weight:700}
.dpill{display:inline-block;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:99px;color:var(--dc);border:1px solid var(--dc);background:color-mix(in srgb,var(--dc) 12%,transparent)}
.drw{display:flex;gap:3px}.drw i{font-style:normal;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;background:#ffffff14;border:1px solid #ffffff2a}.drw i:last-child{background:var(--gold);color:#2a1206;border-color:var(--gold)}
.wv{display:flex;align-items:flex-end;gap:6px;height:64px;padding:4px 0}
.wv div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.wv i{width:100%;max-width:38px;border-radius:5px 5px 2px 2px;background:linear-gradient(0deg,#ff4f9a,#ffb14a)}
.wv span{font-size:10px;font-family:var(--mono);color:var(--dim)}
.hcard.locked canvas{filter:grayscale(.85) brightness(.55)}
.hcard .how{position:absolute;left:8px;right:8px;top:44%;text-align:center;font-size:11px;font-weight:700;color:#fff;background:#0b0820cc;border:1px solid #ffffff2a;border-radius:8px;padding:4px 6px}
.hcard .nofb{position:absolute;right:10px;top:124px;font-size:10px;color:#ffd2e8;background:#ff4f9a33;border:1px solid #ff4f9a77;border-radius:6px;padding:0 5px}
.sk.nofb{filter:grayscale(.9) brightness(.6)}
.sk.nofb::after{content:'';position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(135deg,#0000 0 6px,#0006 6px 8px)}
.hero-pick button.locked{opacity:.45;filter:grayscale(.7)}
.hero-pick button small{display:block;font-size:9px;color:var(--dim)}
.explain.gold{background:#ffb14a14;border-color:#ffb14a55}
.ens-secs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.ens-sec{display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px;border-radius:10px;background:var(--panel2);border:1.5px solid var(--line2);font-size:11px;color:var(--dim)}
.ens-sec b{font-size:13px;color:var(--text)}
.ens-sec.on{border-color:var(--hero2);box-shadow:0 0 calc(6px + var(--beat)*12px) rgba(var(--hero2-rgb),.5)}
.ens-inst{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-top:10px}
.ens-i{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 3px;border-radius:10px;background:var(--panel2);border:1.5px solid var(--line2);font-size:12px;opacity:.45;filter:grayscale(.8)}
.ens-i canvas{width:64px;height:48px;border-radius:6px}
.ens-i small{font-size:10px;color:var(--dim)}
.ens-i.on{opacity:1;filter:none;border-color:rgba(var(--hero-rgb),.8)}
@media (max-width:760px){.ens-secs{grid-template-columns:1fr 1fr}}
.place-bar{position:absolute;z-index:6;transform:translate(-50%,0);display:flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:99px;font-size:12px;white-space:nowrap;border:1px solid #6fdc8c88}
.place-bar.bad{border-color:#ff5d6c99}
.place-bar .c span{margin-left:3px}
.place-bar .pb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:900;background:#ffffff14}
.place-bar .pb.ok{background:#6fdc8c;color:#0b1a10}.place-bar.bad .pb.ok{background:#4a4458;color:#9d96ad}
.place-bar .pb.no{background:#ff5d6c33;color:#ffb3bb}
.place-bar.hidden{display:none}
.shop-wallet{display:flex;align-items:baseline;gap:10px;font-size:15px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.shop-item{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line2)}
.shop-item canvas{width:144px;height:112px;border-radius:10px;align-self:center}
.shop-item b small{font-weight:400;color:var(--dim);font-size:11px;margin-left:4px}
.shop-ic{font-size:40px;text-align:center;line-height:1.2}
.bless-list{display:flex;flex-wrap:wrap;gap:6px}
.plant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.plant{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line2)}

@media (max-width:900px){.cw-main{grid-template-columns:1fr;grid-template-rows:auto minmax(240px,1fr) auto;overflow:auto}.cw-list{flex-direction:row;overflow-x:auto}.cw-lab{min-width:140px}.cw-side{max-height:none}}
.land .cw-main{grid-template-columns:150px 1fr 230px}.land .cw-top{padding:4px 8px}.land .cw-title .small{display:none}.land .cw-tray{margin:4px 8px 6px;padding:4px}.land .cw-part{min-width:52px;padding:3px}

.quiz-opt:hover{border-color:var(--plight)}

.explain{margin-top:12px;padding:12px;border-radius:10px;background:#9b7bff14;border:1px solid #9b7bff44;font-size:13px;line-height:1.7}
.journal-item{border-left:3px solid var(--orange);padding:6px 10px;margin-bottom:8px;background:#ffffff06;border-radius:0 8px 8px 0}
.journal-item .d{font-size:11px;color:var(--mute);font-family:var(--mono)}
textarea.note{width:100%;min-height:80px;background:#0d0b16;border:1px solid var(--line2);border-radius:9px;padding:10px;resize:vertical;font-size:14px;line-height:1.5}
.road-stage{border-left:2px solid var(--line2);margin-left:10px;padding:0 0 14px 18px;position:relative}
.road-stage::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:3px;background:var(--orange);transform:rotate(45deg)}

/* ---------- 实验室 ---------- */
.labcard{cursor:pointer;transition:.15s;position:relative}
.labcard:hover{border-color:var(--plight);transform:translateY(-2px)}
.labcard .dom{font-size:11px;font-family:var(--mono);color:var(--orange)}

input[type=range]{width:100%;accent-color:var(--orange);touch-action:pan-x;height:24px}
.lab-msg{font-size:13px;line-height:1.6;padding:10px;border-radius:9px;background:#ffffff08;border:1px solid var(--line)}

.prog-list{display:flex;flex-wrap:wrap;gap:4px;min-height:34px;padding:6px;border-radius:8px;background:#0d0b16;border:1px dashed var(--line2)}

.pix-grid{display:grid;grid-template-columns:repeat(16,1fr);width:min(100%,360px);aspect-ratio:1;border:1px solid var(--line2);touch-action:none;background:repeating-conic-gradient(#1a1729 0 25%,#13111f 0 50%) 0 0/12.5% 12.5%}

/* ---------- 档案 ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

/* ---------- 弹窗 ---------- */
.modal{position:absolute;inset:0;z-index:50;background:#05040acc;display:flex;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(3px)}

<script>
/* js/config.js */
/*
 * ======================== 你可以改的配置 ========================
 *
 * 背景音乐（BGM）
 *   每个页面都有一首默认的程序生成曲；大厅、战斗、快速模式、主城默认播放「当前英雄的主题曲」。想换成你自己的音乐，有两种方法：
 *
 *   方法 A（最简单）：进游戏 → 设置 → 背景音乐 → 对应页面点「上传」，选一个 mp3/ogg/wav 文件。
 *                    文件保存在浏览器本地，下次打开仍然有效。
 *
 *   方法 B（适合打包分享）：把音乐文件放进 music/ 文件夹，然后在下面填路径，例如
 *                    menu: { file: 'music/menu.mp3', bpm: 96 }
 *                    bpm 是这首歌的每分钟拍数，用来让紫色像素动效跟着节拍跳（不填默认 100）。
 *
 *   优先级：设置里上传的文件 > 这里填的文件 > 程序生成吉他曲
 */
window.CF_CONFIG = {

    quick:    { file: '', bpm: 120 },  // 快速模式

    boss:     { file: '', bpm: 144 },  // Boss 出现时
    victory:  { file: '', bpm: 120 },  // 胜利结算
    defeat:   { file: '', bpm: 72 },   // 失败结算
  },

<script>
/* js/core.js */
/* 核心工具：DOM、数学、事件、存档、提示、弹窗 */
(function () {
  const CF = (window.CF = window.CF || {});

  // ---------- DOM ----------
  CF.$ = (s, r = document) => r.querySelector(s);
  CF.$$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  CF.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  CF.h = function (html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };

  // ---------- 数学 ----------
  CF.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  CF.lerp = (a, b, t) => a + (b - a) * t;
  CF.rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  CF.randi = (a, b) => Math.floor(CF.rand(a, b + 1));
  CF.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  CF.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  CF.dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  CF.rng = function (seed) { // mulberry32
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  CF.hashStr = (str) => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  CF.today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  CF.dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  CF.fmtTime = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  CF.fmtNum = (n) => (n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(Math.floor(n)));

  // ---------- 事件 ----------
  const handlers = {};
  CF.bus = {
    on(ev, fn) { (handlers[ev] = handlers[ev] || []).push(fn); },
    off(ev, fn) { handlers[ev] = (handlers[ev] || []).filter((f) => f !== fn); },
    emit(ev, data) { (handlers[ev] || []).slice().forEach((f) => { try { f(data); } catch (e) { console.error(e); } }); },
  };

  // ---------- 存档 ----------
  const KEY = 'cf_save_v1';
  function defaults() {
    return {
      version: 1,
      created: CF.today(),
      xp: { knowledge: 0, practice: 0 },
      dims: { de: 0, zhi: 0, ti: 0, mei: 0, shi: 0, qi: 0 },
      domains: { ai: 0, emb: 0, aero: 0, biz: 0 },
      founder: { fp: 0, long: 0, grit: 0, exec: 0, mission: 0, lead: 0 },
      quiz: { seen: {}, correct: 0, wrong: 0 },
      labs: {},
      code: {},
      quests: { log: [] },
      scenarios: {},
      roadmap: {},
      daily: { date: '', items: [], done: [] },
      streak: { count: 0, last: '', best: 0 },
      campaign: {},
      skirmish: { easy: 0, normal: 0, hard: 0 },
      achievements: {},
      stats: { riffs: 0, kills: 0, battles: 0, wins: 0, playSec: 0 },
      avatar: null,
      hero: 'riot', // 开局英雄（主角 X-S 走特殊渠道获得）
      tutorial: { done: false },
      quick: { best: 0, runs: 0, bestRank: '' },
      city: null,
      boosts: 0,
      heroStats: {},
      roster: null, // { owned: [], frags: {}, treasures: [] }，见 js/roster.js
      chapters: { seed: 0, stages: {} },
      dungeon: {},
      settings: { master: CF_CONFIG.volume.master, music: CF_CONFIG.volume.music, sfx: CF_CONFIG.volume.sfx, trial: false, quality: 'high', bgmStyle: {}, bgmBpm: {}, rotateChoice: '', reduceMotion: false },
    };
  }
  function merge(base, over) {
    if (!over || typeof over !== 'object' || Array.isArray(over)) return over === undefined ? base : over;
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    for (const k in over) out[k] = base && typeof base[k] === 'object' && base[k] !== null && !Array.isArray(base[k]) ? merge(base[k], over[k]) : over[k];
    return out;
  }
  CF.Save = {
    data: defaults(),
    load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) this.data = merge(defaults(), JSON.parse(raw));
      } catch (e) { console.warn('读取存档失败', e); }
      return this.data;
    },
    save() {
      try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { /* 隐私模式等 */ }
    },
    reset() { this.data = defaults(); this.save(); },
    exportText() { return JSON.stringify(this.data, null, 1); },
    importText(txt) {
      const obj = JSON.parse(txt);
      if (!obj || obj.version !== 1) throw new Error('不是有效的《造月之路》存档');
      this.data = merge(defaults(), obj);
      this.save();
    },
  };

  // ---------- 提示 ----------
  CF.toast = function (msg, type = '', ms = 2200) {
    const host = CF.$('#toastHost');
    if (Array.from(host.children).some((c) => c.textContent === msg && c.style.opacity !== '0')) return;
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    host.appendChild(t);
    while (host.children.length > 3) host.firstChild.remove();
    setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, ms);
  };

  // ---------- 弹窗 ----------
  let onCloseFn = null;
  CF.modal = {
    isOpen: () => !CF.$('#modal').classList.contains('hidden'),
    open({ title = '', body = '', foot = null, wide = false, onClose = null, closable = true, hero = 'current' }) {
      const card = CF.$('#modalCard');
      if (CF.modal._stage) { CF.modal._stage.destroy(); CF.modal._stage = null; }
      card.className = 'modal-card' + (wide ? ' wide' : '');
      card.innerHTML = `<div class="modal-head"><canvas class="mh-fx"></canvas><h3>${title}</h3>${closable ? '<button class="x" data-x>✕</button>' : ''}</div><div class="modal-body"></div>`;
      if (CF.PixelFX) CF.modal._stage = new CF.PixelFX.Stage(card.querySelector('.mh-fx'), { mode: 'bar', fx: closable ? 0.86 : 0.93, fy: 0.56, cell: 10, hero });
      const bd = card.querySelector('.modal-body');
      if (typeof body === 'string') bd.innerHTML = body; else if (body) bd.appendChild(body);
      if (foot && foot.length) {
        const f = document.createElement('div');
        f.className = 'modal-foot';
        foot.forEach((b) => {
          const btn = document.createElement('button');
          btn.className = 'btn ' + (b.cls || '');
          btn.innerHTML = b.text;
          btn.onclick = () => { CF.Audio && CF.Audio.sfx('click'); b.onClick ? b.onClick(btn) : CF.modal.close(); };
          f.appendChild(btn);
        });
        card.appendChild(f);
      }
      const x = card.querySelector('[data-x]');
      if (x) x.onclick = () => { CF.Audio && CF.Audio.sfx('click'); CF.modal.close(); };
      onCloseFn = onClose;
      CF.$('#modal').classList.remove('hidden');
      return bd;
    },
    close() {
      if (!CF.modal.isOpen()) return;
      CF.$('#modal').classList.add('hidden');
      CF.$('#modalCard').innerHTML = '';
      if (CF.modal._stage) { CF.modal._stage.destroy(); CF.modal._stage = null; }
      const fn = onCloseFn; onCloseFn = null;
      CF.bus.emit('modal:closed');
      if (fn) fn();
    },
  };

  // ---------- 横屏旋转时的坐标换算 ----------
  CF.rotated = () => document.getElementById('app').classList.contains('rotated');
  // 把屏幕坐标转为 #app 内的坐标
  CF.appPoint = function (cx, cy) {
    if (CF.rotated()) return { x: cy, y: window.innerWidth - cx };
    return { x: cx, y: cy };
  };
  // 元素在 #app 内的矩形（未旋转坐标系）
  CF.appRect = function (el) {
    const r = el.getBoundingClientRect();
    if (!CF.rotated()) return r;
    return { left: r.top, top: window.innerWidth - r.right, width: r.height, height: r.width };
  };
})();

</script>

    abyss: { gender: 'm', age: 40, pitch: 0.6, rate: 0.82, tone: '低沉、冷静、惜字如金' },
    luna: { gender: 'f', age: 26, pitch: 1.04, rate: 0.9, tone: '清冷、克制' },
    pearl: { gender: 'f', age: 16, pitch: 1.34, rate: 1.12, tone: '好奇、俏皮、问题多' },

  // 公开发布模式：灵感来源只保留特点描述，去掉真实产品与公司名（括号与「灵感来源：xxx——」前缀）
  if (window.CF_CONFIG && window.CF_CONFIG.publicRelease) HEROES.forEach((h) => { if (!h.protagonist) h.inspire = '灵感取自知名 AI 大模型的公开特点（原创形象，与任何公司无关）——' + (h.inspire.split('——')[1] || ''); });
  const byId = {};
  HEROES.forEach((h) => {

    const raw = h.draw;
    h.draw = function (ctx, ox, oy, px, a = {}) { return raw.call(h, ctx, ox, oy, px, !a.noInst && !a.showInst && CF.Treasure && !CF.Treasure.has(h.id) ? Object.assign({}, a, { noInst: true }) : a); };
  });
  const H = (CF.Heroes = {
    list: HEROES,
    get: (id) => byId[id] || byId.xs,
    current: () => byId[CF.Save.data.hero] || byId.riot,
    rgb: (hex) => { const n = parseInt(hex.slice(1, 7), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
  });

  // 发电巡航无人机「伏特」：以造乐的配色设计——白色机身、青柠能量核心、青色旋翼与小闪电
  H.drawDrone = function (ctx, ox, oy, px, t, over) {
    const P = byId.zaole.pal, R = pen(ctx, ox, oy, px, 0), spin = Math.floor(t * 20) % 2;
    R(0, 0, 2 + spin, 1, P.cyan); R(4 - spin, 0, 2 + spin, 1, P.cyan); R(2, 0, 2, 1, P.whiteD);
    R(1, 1, 4, 2, P.white); R(2, 1, 2, 2, over ? '#ffffff' : P.lime); R(0, 2, 1, 1, P.whiteD); R(5, 2, 1, 1, P.whiteD);
    R(2, 3, 1, 1, P.cyan); R(3, 4, 1, 1, P.lime); R(2, 5, 1, 1, P.cyan);
  };
  // 九位乐手的主光色（造乐的「起拍」「众声向上」按这个顺序着色）
  H.ENSEMBLE_IDS = ['xs', 'omni', 'twin', 'riot', 'llama', 'abyss', 'luna', 'pearl', 'bun'];
  H.ensembleColors = () => H.ENSEMBLE_IDS.map((id) => byId[id].pal.glow);

  // 主题：把当前英雄的配色写进 CSS 变量，让全部 UI 跟着英雄换色
  H.applyTheme = function (id) {
    const h = id ? H.get(id) : H.current(), p = h.pal, r = document.documentElement.style;
    r.setProperty('--hero', p.glow); r.setProperty('--hero2', p.accent);
    r.setProperty('--hero-rgb', H.rgb(p.glow).join(','));
    r.setProperty('--hero2-rgb', H.rgb(p.accent).join(','));
    r.setProperty('--hero-bg0', p.bg[0]); r.setProperty('--hero-bg1', p.bg[1]); r.setProperty('--hero-bg2', p.bg[2]);
    // 主标题《造月之路》的图标渐变：英雄点缀色 → 主光色（可用 pal.logo 单独指定）
    const lg = p.logo || [p.accent, p.glow]; r.setProperty('--logo-a', lg[0]); r.setProperty('--logo-b', lg[1]);
    CF.bus.emit('hero:theme', h);
  };
})();

<script>
/* js/voice.js */
/* 英雄配音（v1，《英雄设计宪法》第 13 章）
 * 用现有台词（选中 / 攻击 / 技能 / 濒危 + 口头禅）。按英雄的性别、年龄、性格设定音高与语速：
 *   ① 安卓安装包：调用系统中文语音合成（XSNative 桥）；
 *   ② 浏览器：Web Speech API 的中文语音；
 *   ③ 都没有时：「像素音」——按字发出的短促合成音（类似复古游戏的对话音），每位英雄音色不同。
 * 多次点击随机切换台词，不会连续重复同一句。标志性动作与表演效果在下一版本加入。 */
(function () {
  const CF = window.CF;
  const last = {};
  const mode = () => (CF.Save.data.settings.voice || 'auto');
  const native = () => window.XSNative && typeof window.XSNative.speak === 'function';
  const synth = () => window.speechSynthesis && typeof window.SpeechSynthesisUtterance === 'function';
  const FEMALE = /ting|xiao|hui|yao|mei|female|女|普通话/i, MALE = /kang|yun|zhi|male|男/i;
  let zhVoices = [];
  const loadVoices = () => { try { zhVoices = (window.speechSynthesis.getVoices() || []).filter((v) => /zh|cmn/i.test(v.lang)); } catch (e) { zhVoices = []; } };
  if (synth()) { loadVoices(); try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch (e) { /* 旧浏览器 */ } }

  // 像素音：每个字一记带共振峰的短音，音高轮廓由字本身决定（同一句台词每次听起来一样）
  const TIMBRE = { zaole: 'triangle', xs: 'triangle', omni: 'sine', twin: 'triangle', riot: 'square', llama: 'sine', abyss: 'sine', luna: 'triangle', pearl: 'square', bun: 'triangle' };
  function pixelVoice(h, text, pitchMul = 1) {
    const A = CF.Audio; if (!A.ctx || A.ctx.state !== 'running') return;
    const v = h.voice || {}, base = (v.gender === 'm' ? 150 : v.gender === 'f' ? 250 : 300) * (v.age && v.age < 13 ? 1.25 : v.age > 39 ? 0.85 : 1) * (v.pitch || 1) * pitchMul;
    const step = 0.085 / (v.rate || 1); let t = A.ctx.currentTime + 0.02;
    for (const ch of text) {
      if (/[，。！？、…—\s,.!?「」]/.test(ch)) { t += step * 1.6; continue; }
      const code = ch.charCodeAt(0), semi = ((code * 7) % 9) - 4, f = base * Math.pow(2, semi / 12);
      const o = A.ctx.createOscillator(), g = A.ctx.createGain(), bp = A.ctx.createBiquadFilter();
      o.type = TIMBRE[h.id] || 'triangle'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.92, t + step * 0.8);
      bp.type = 'bandpass'; bp.frequency.value = 900 + (code % 5) * 260; bp.Q.value = 1.2;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + step * 0.85);
      o.connect(bp); bp.connect(g); g.connect(A.sfxBus); o.start(t); o.stop(t + step);
      t += step;
    }
  }
  const V = (CF.Voice = {
    lines: (h) => [h.lines.pick, h.lines.attack, h.lines.skill, h.lines.low, h.quote].filter((x, i, a) => x && a.indexOf(x) === i),
    // 随机一句，不和上一句重复
    pick(h) { const ls = V.lines(h); let s; do { s = ls[Math.floor(Math.random() * ls.length)]; } while (ls.length > 1 && s === last[h.id]); last[h.id] = s; return s; },
    say(h, text) {
      if (!h || !text || mode() === 'off') return;
      const v = h.voice || {};
      // 双子：「——」前后由两姐妹交替说
      const parts = h.id === 'twin' ? text.split('——') : [text];
      if (mode() !== 'pixel' && native()) { try { window.XSNative.speak(text, v.pitch || 1, v.rate || 1); return; } catch (e) { /* 继续兜底 */ } }
      if (mode() !== 'pixel' && synth() && zhVoices.length) {
        try {
          window.speechSynthesis.cancel();
          parts.forEach((p, i) => {
            const u = new SpeechSynthesisUtterance(p); u.lang = 'zh-CN';
            const want = v.gender === 'm' ? MALE : FEMALE, pickV = zhVoices.find((x) => want.test(x.name)) || zhVoices[0];
            if (pickV) u.voice = pickV;
            u.pitch = Math.max(0.1, Math.min(2, (v.pitch || 1) * (i % 2 && v.alt ? v.alt / (v.pitch || 1) : 1))); u.rate = Math.max(0.5, Math.min(1.6, v.rate || 1)); u.volume = CF.Save.data.settings.sfx;
            window.speechSynthesis.speak(u);
          });
          return;
        } catch (e) { /* 兜底为像素音 */ }
      }
      let delay = 0; parts.forEach((p, i) => { setTimeout(() => pixelVoice(h, p, i % 2 && v.alt ? v.alt / (v.pitch || 1) : 1), delay); delay += (p.length * 85) / (v.rate || 1) + 160; });
    },
    line(h) { const s = V.pick(h); V.say(h, s); return s; },
    engine: () => (mode() === 'off' ? '关闭' : mode() === 'pixel' ? '像素音' : native() ? '系统语音（安卓）' : synth() && zhVoices.length ? '浏览器语音' : '像素音（当前设备没有中文语音）'),
  });
})();

</script>
<script>
/* js/roster.js */
/* 英雄获取与法宝（v1.1）
 * - 开局英雄是狂想；第一章第 3 个小关送万象，第 5 个小关送珠问；
 * - 主角 X-S 只能通过特殊渠道获得（高等级 VIP、限时活动——后续版本开放），保持稀缺；
 * - 其余英雄：组队副本第 5 波掉落英雄碎片，集齐 10 片解锁；
 * - 法宝 = 英雄的乐器（《英雄设计宪法》第 6 章）：没有法宝时形象不带乐器、R 技能不能用。
 *   开局英雄的法宝在第一章终章获得；X-S 的电吉他随 X-S 一起获得；其他英雄带着他出战并打完一次组队副本 5 波获得。
 * - 体验模式下全部解锁。详细获取规则在下一版本细化（见 NEXT.md）。 */
(function () {
  const CF = window.CF;
  const FRAG_NEED = 10, STARTER = 'riot';
  const VALID = (id) => CF.Heroes.list.some((h) => h.id === id);
  const data = () => {
    const d = CF.Save.data;
    if (!d.roster) {
      // 旧存档迁移：保留玩家正在用的主英雄，避免进来后英雄消失
      const owned = [STARTER]; if (d.hero && d.hero !== STARTER && VALID(d.hero) && d.campaign && Object.keys(d.campaign).length) owned.push(d.hero);
      d.roster = { owned, frags: {}, treasures: [] };
    }
    // 清理已经删除的英雄（v3 的「星芒」已并入 X-S）
    if (d.roster.owned.some((id) => !VALID(id))) { d.roster.owned = d.roster.owned.filter(VALID); if (!d.roster.owned.length) d.roster.owned.push(STARTER); }
    return d.roster;
  };
  const trial = () => !!(CF.P && CF.P.trial && CF.P.trial());

  // 获取途径（显示在锁定的英雄卡上）
  const HOW = { riot: '初始英雄', zaole: '主角 · 特殊渠道：高等级 VIP · 限时活动（后续版本开放）', omni: '第一章章节掉落碎片（第 3 个小关首通时集齐）', pearl: '第一章 · 第 5 个小关首通赠送', xs: '第四章章节掉落碎片', abyss: '第五章章节掉落碎片' };
  const R = (CF.Roster = {
    FRAG_NEED, STARTER,
    special: (id) => id === 'zaole',
    owns: (id) => trial() || data().owned.includes(id),
    ownsReal: (id) => data().owned.includes(id),
    ownedList: () => CF.Heroes.list.filter((h) => R.owns(h.id)),
    frags: (id) => data().frags[id] || 0,
    how: (id) => (HOW[id] || '商城每日轮换出售碎片') + (id !== STARTER && id !== 'zaole' && id !== 'pearl' ? `（${Math.min(FRAG_NEED, R.frags(id))}/${FRAG_NEED}）` : ''),
    // 碎片只对普通英雄有效；X-S 不进入任何掉落池
    grant(id, why) {
      const r = data();
      if (r.owned.includes(id)) return false;
      r.owned.push(id); CF.Save.save();
      const h = CF.Heroes.get(id);
      setTimeout(() => {
        CF.Audio.sfx('unlock'); CF.Audio.lick(id);
        CF.modal.open({ title: `获得英雄 · ${h.name}`, body: `<div class="grant"><canvas width="220" height="150"></canvas><p class="t-quote">${CF.esc(h.quote)}</p><p class="small muted">${why || ''}</p><p class="small">${h.title} · ${h.role} · 法宝「${h.instrument}」尚未获得</p></div>`, foot: [{ text: '好的', cls: 'ghost' }, { text: '设为主英雄', cls: 'primary', onClick: () => { CF.modal.close(); CF.Lobby.setHero(id); } }] });
        const cv = document.querySelector('.modal .grant canvas');
        if (cv) { const x = cv.getContext('2d'); x.fillStyle = h.pal.bg[1]; x.fillRect(0, 0, 220, 150); h.draw(x, 40, 60, 6.5, { t: 0 }); }
      }, 400);
      return true;
    },
    addFrag(id, n) {
      const r = data();
      if (r.owned.includes(id)) return 0;
      r.frags[id] = (r.frags[id] || 0) + n; CF.Save.save();
      if (r.frags[id] >= FRAG_NEED) R.grant(id, `集齐 ${FRAG_NEED} 片英雄碎片`);
      return n;
    },
  });

  CF.Treasure = {
    has: (id) => trial() || data().treasures.includes(id),
    name: (id) => '法宝 · ' + CF.Heroes.get(id).instrument,
    how: (id) => (id === STARTER ? '通关第一章终章「原型机护送」获得' : id === 'zaole' ? '指挥棒随造乐一起通过特殊渠道获得' : '带该英雄打完一次组队副本 5 波，或用 10 片赐福法宝碎片兑换'),
    grant(id) {
      const r = data();
      if (r.treasures.includes(id)) return false;
      r.treasures.push(id); CF.Save.save();
      const h = CF.Heroes.get(id);
      setTimeout(() => {
        CF.Audio.sfx('unlock'); CF.Audio.preview(h.music.style, 0.7);
        CF.modal.open({ title: `获得法宝 · ${h.instrument}`, body: `<div class="grant"><canvas width="220" height="150"></canvas><p class="t-quote">${CF.esc(h.name)}的${h.instrument}觉醒了</p><p class="small">终极技能「${h.skills[2].name}」已解锁；形象、演奏动画与专属粒子同步出现。</p></div>`, foot: [{ text: '收下', cls: 'primary' }] });
        const cv = document.querySelector('.modal .grant canvas');
        if (cv) { const x = cv.getContext('2d'); x.fillStyle = h.pal.bg[1]; x.fillRect(0, 0, 220, 150); h.draw(x, 40, 60, 6.5, { t: 0, strum: 1 }); }
      }, 500);
      return true;
    },
  };
})();

</script>
<script>
/* js/collect.js */
/* 收藏与道具：发电厂图鉴、法宝锦囊、赐福法宝碎片（v1）
 * - 发电厂遵循《英雄设计宪法》第 14 章：只有像素形象 + 文案介绍，没有战斗能力；形象尺寸是英雄的 0.618 倍（13 × 11 格）。
 * - 第二章掉落「火力发电厂」碎片（参考 1882 年的珍珠街电站），第三章掉落「核能发电厂」碎片（参考 1954 年的奥布宁斯克核电站），各 10 片解锁。
 * - 第六章掉落「法宝锦囊」：打开有 35% 概率得到「赐福法宝碎片」，集齐 10 片可以为一位已拥有的英雄赐福一件法宝。 */
(function () {
  const CF = window.CF;
  const NEED = 10;
  const S = () => { const d = CF.Save.data; if (!d.collect) d.collect = { frags: {}, owned: [], pouch: 0, bless: 0 }; return d.collect; };
  const pen = (ctx, ox, oy, px) => (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(ox + x * px), Math.round(oy + y * px), Math.ceil(w * px), Math.ceil(h * px)); };
  const grid = (R, rows, map, y0 = 0) => rows.forEach((row, j) => { for (let x = 0; x < row.length; x++) { const c = row[x]; if (c !== '.' && map[c]) R(x, y0 + j, 1, 1, map[c]); } });

  const PLANTS = {
    plant_thermal: {
      name: '珍珠街电站', en: 'Pearl Street Station', kind: '火力发电厂', era: '1882 · 美国纽约', chapter: 2,
      pal: { K: '#2a1a14', B: '#a8452e', b: '#7a2e1e', R: '#8a3a26', Y: '#ffd27a', D: '#4a2a1a', G: '#2b2b2b', g: '#4a4a4a' },
      intro: '1882 年 9 月 4 日，爱迪生的公司在纽约曼哈顿的珍珠街启用了这座电站——世界上最早的商用中心发电站之一。它用燃煤锅炉产生蒸汽，带动蒸汽机和绰号「巨无霸（Jumbo）」的直流发电机，通过埋在街道下的铜线，给曼哈顿下城最初的几十位用户送去约 110 伏的直流电。',
      how: '火力发电 = 烧煤 → 把水烧成蒸汽 → 蒸汽推动机器旋转 → 线圈在磁场里旋转、切割磁感线 → 产生电流（法拉第电磁感应）。',
      fact: '它输出的是直流电。后来交流电因为方便用变压器升压、远距离输送，成为电网的主流——这就是历史上著名的「电流之战」。',
      draw(ctx, ox, oy, px, a = {}) {
        const R = pen(ctx, ox, oy, px), P = this.pal, t = a.t || 0, lit = a.beat > 0.5 ? '#fff1b8' : P.Y;
        grid(R, ['..KK....KK...', '..RR....RR...', '..RR....RR...', 'KKRRKKKKRRKKK', 'KBBBBBBBBBBBK', 'KBYBBYBBYBBYK', 'KBbBBbBBbBBbK', 'KBYBBYBBYBBYK', 'KBBBBDDDBBBBK', 'KBBBBDDDBBBBK', 'GGgGGGgGGGgGG'], { K: P.K, B: P.B, b: P.b, R: P.R, Y: lit, D: P.D, G: P.G, g: P.g });
        // 两根烟囱冒出的烟（向上飘散）
        for (let i = 0; i < 3; i++) { const k = (t * 0.8 + i / 3) % 1; ctx.globalAlpha = 0.6 * (1 - k); R(2 + Math.round(Math.sin(t + i) * 0.6), -1 - k * 4, 2, 1, '#c8c0b8'); R(8 + Math.round(Math.cos(t + i) * 0.6), -1 - k * 4, 2, 1, '#c8c0b8'); }
        ctx.globalAlpha = 1;
      },
    },
    plant_nuclear: {
      name: '奥布宁斯克核电站', en: 'Obninsk', kind: '核能发电厂', era: '1954 · 苏联奥布宁斯克', chapter: 3,
      pal: { W: '#e8e2d0', w: '#b8b09c', S: '#c9c4b8', s: '#8f8a80', C: '#4ef0ff', A: '#9ffbff', D: '#5a5448', P: '#3e5a3a', K: '#2a2620' },
      intro: '1954 年 6 月，苏联的奥布宁斯克核电站开始向电网送电，成为世界上第一座并网发电的核电站。它的反应堆叫 AM-1（意为「和平原子」），电功率约 5 兆瓦，一直运行到 2002 年。',
      how: '核能发电 = 铀原子核裂变放出热量 → 把水烧成蒸汽 → 推动汽轮机 → 带动发电机。和火电相比，只是「烧水」的方式不同；一小块铀燃料就能放出相当于大量煤炭的能量。',
      fact: '核电运行时几乎不排放二氧化碳，但必须解决安全运行和核废料处理的问题——这是工程师至今仍在攻克的课题。',
      draw(ctx, ox, oy, px, a = {}) {
        const R = pen(ctx, ox, oy, px), P = this.pal, glow = a.beat > 0.5 ? '#ffffff' : P.A;
        grid(R, ['..........S..', '..........S..', '..........s..', '..........S..', '.KKKKKKKK.S..', '.WCCWWCCW.S..', 'KWWWWWWWWWSWK', 'WwwWWAAWWwwWW', 'WwwWWAAWWwwWW', 'WWWWWDDWWWWWW', 'PPPPPPPPPPPPP'], { S: P.S, s: P.s, K: P.K, W: P.W, w: P.w, C: P.C, A: glow, D: P.D, P: P.P });
        // 反应堆的切连科夫蓝光，随节拍呼吸
        ctx.globalAlpha = 0.25 + 0.25 * (a.beat || 0); R(4, 6, 5, 4, P.C); ctx.globalAlpha = 1;
      },
    },
  };

  const C = (CF.Collect = {
    PLANTS, NEED,

    openPouch() {
      const s = S(); if (s.pouch <= 0) return null;

      if (Math.random() < 0.35) { const n = Math.random() < 0.3 ? 2 : 1; s.bless += n; txt = `赐福法宝碎片 ×${n}（${s.bless}/${NEED}）`; }
      else { const r = CF.pick([{ chip: 300 }, { corp: 200 }, { comp: 80 }]); CF.City.add(r); const k = Object.keys(r)[0]; txt = `${{ chip: '晶片', corp: '语料', comp: '算力' }[k]} ×${r[k]}`; }

    },
    // 用 10 片赐福法宝碎片为一位英雄赐福法宝
    redeem(heroId) {
      const s = S(); if (s.bless < NEED || CF.Treasure.has(heroId) || !CF.Roster.ownsReal(heroId)) return false;
      s.bless -= NEED; CF.Save.save(); CF.Treasure.grant(heroId); return true;
    },
  });
  // 发电厂图鉴（英雄页底部）
  C.renderPlants = function (host) {
    const box = CF.h('<div><div class="sec-title">发电厂图鉴 · 能源的历史</div><p class="small muted" style="margin-bottom:10px;line-height:1.7">发电厂只有形象和介绍，不参与战斗；形象是英雄的 0.618 倍。第二章掉落火力发电厂碎片，第三章掉落核能发电厂碎片，各 10 片解锁。</p><div class="plant-grid"></div></div>');
    const grid2 = box.querySelector('.plant-grid');
    Object.entries(PLANTS).forEach(([id, P]) => {
      const own = C.owns(id) || CF.P.trial();
      const el = CF.h(`<div class="plant ${own ? '' : 'locked'}"><canvas width="168" height="120"></canvas><div class="pb"><div class="t-tag">${P.kind} · ${P.era}</div><b>${P.name}</b><span class="small muted">${P.en}</span>${own ? `<p>${P.intro}</p><p class="small"><b>原理：</b>${P.how}</p><p class="small muted">${P.fact}</p>` : `<p class="small">第${['', '一', '二', '三'][P.chapter]}章章节掉落碎片：<b class="t-num">${Math.min(NEED, C.frags(id))}/${NEED}</b></p>`}</div></div>`);
      const cv = el.querySelector('canvas'), x = cv.getContext('2d'); let raf2 = 0;
      const loop = () => { if (!cv.isConnected) return cancelAnimationFrame(raf2); x.clearRect(0, 0, 168, 120); P.draw(x, 32, 28, 8, { t: performance.now() / 1000, beat: CF.PixelFX.beat() }); raf2 = requestAnimationFrame(loop); };
      loop();
      grid2.appendChild(el);
    });
    host.appendChild(box);
  };
})();

</script>
<script>
/* js/pixelfx.js */
/* 像素脉冲舞台：英雄配色的像素方格随节拍波动 + 英雄演奏乐器（参考视频中的紫色吉他动效）
 * 规则见 art/02-game-ui-constitution.md */
(function () {
  const CF = window.CF;

  // ---------- 通用小人（Agent 等小兵使用） ----------
  const PAL = { body: '#d97757', bodyD: '#b85f40', eye: '#1b1226', k: '#1b1226', gtr: '#8b80d6', gtrD: '#5e54b0', gtrL: '#b3abea', fret: '#c8c1f2', note: '#f2c14e', gray: '#6b6680' };
  function drawClawd(ctx, ox, oy, px, p = {}) {
    const bob = p.bob || 0;
    const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(ox + x * px), Math.round(oy + (y + bob) * px), Math.ceil(w * px), Math.ceil(h * px)); };
    const bc = p.tint || PAL.body;
    [2, 4, 9, 11].forEach((x, i) => R(x, 8, 1, 2 - ((p.step || 0) % 2 === i % 2 && p.walk ? 1 : 0), bc));
    R(1, 4, 12, 4, bc); R(1, 0, 12, 4, bc); R(0, 3, 1, 2, bc); R(1, 0, 1, 4, p.tintD || PAL.bodyD);
    if (p.blink) { R(3, 3, 2, 1, PAL.eye); R(8, 3, 2, 1, PAL.eye); } else { R(3, 2, 1, 2, PAL.eye); R(9, 2, 1, 2, PAL.eye); }
  }
  const NOTES = [['.XX', '.X.', 'XX.'], ['XX', '.X', 'XX'], ['X.X', 'XXX'], ['XXX', 'X.X', 'XX.']];
  const NOTE2 = ['XXXX', 'X..X', 'X..X', 'XX.XX'];
  function drawPattern(ctx, pat, x, y, px, col) {
    ctx.fillStyle = col;
    pat.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] === 'X') ctx.fillRect(Math.round(x + i * px), Math.round(y + j * px), Math.ceil(px), Math.ceil(px)); });
  }
  const reduced = () => CF.Save.data.settings.reduceMotion || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const lowQ = () => CF.Save.data.settings.quality === 'low';
  function levels(rgb) { return ['', `rgba(${rgb},0.34)`, `rgba(${rgb},0.56)`, `rgba(${rgb},0.8)`]; }
  function lighten(rgb, k) { return rgb.map((v) => Math.round(v + (255 - v) * k)); }

  // ---------- 舞台 ----------
  class Stage {
    constructor(canvas, opts = {}) {
      this.cv = canvas; this.ctx = canvas.getContext('2d');
      this.o = Object.assign({ mode: 'bar', cell: 14, fx: 0.86, fy: 0.55, charPx: 0, showChar: true, gradient: true, shimmer: true, radius: 60, hero: 'current' }, opts);
      this.waves = []; this.parts = []; this.t = Math.random() * 10;
      this.anim = { bob: 0, strum: 0, blink: 0, lean: 0, strumFlip: 0, t: 0 };
      this.enabled = true; this.w = 0; this.h = 0;
      this.idleBlink = 2 + Math.random() * 3;
      Stage.all.add(this);
    }
    destroy() { Stage.all.delete(this); }
    hero() { return this.o.hero === 'current' ? CF.Heroes.current() : CF.Heroes.get(this.o.hero); }
    visible() { return this.enabled && this.cv.isConnected && this.cv.offsetParent !== null && (!this.o.activeFn || this.o.activeFn()); }
    resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, lowQ() ? 1 : 2);
      const w = this.cv.clientWidth, h = this.cv.clientHeight;
      if (!w || !h) return false;
      if (this.w !== w || this.h !== h || this.dpr !== dpr) { this.w = w; this.h = h; this.dpr = dpr; this.cv.width = Math.round(w * dpr); this.cv.height = Math.round(h * dpr); }
      return true;
    }
    pulse(s, strum) {
      const big = s >= 0.9, rm = reduced();
      if (!rm || big) this.waves.push({ t0: this.t, s: rm ? s * 0.5 : s, speed: big ? 26 : 18, width: big ? 7 : 4 });
      if (this.waves.length > 8) this.waves.shift();
      if (strum) { this.anim.strum = 1; this.anim.strumFlip ^= 1; }
      this.anim.bob = 1;
      if (big) { this.anim.lean = 1; if (Math.random() < 0.5) this.anim.blink = 0.5; }
      const h = this.hero(), fx = h.fx, [sx, sy] = fx.src;
      const n = lowQ() || rm ? 1 : big ? 3 : s > 0.6 ? 2 : 1;
      for (let i = 0; i < n; i++) { const k = Math.floor(Math.random() * fx.pats.length); this.parts.push({ k: 'note', pat: fx.pats[k], col: fx.cols[k % fx.cols.length], x: sx + Math.random() * 4 - 1, y: sy - 4 - Math.random() * 2, vx: (Math.random() - 0.3) * 4, vy: (fx.rise ? -4 : -6) - Math.random() * 4, life: 1.3, age: 0 }); }
      if (strum && !rm) for (let i = 0; i < (lowQ() ? 2 : 4); i++) { const a = -0.9 + Math.random() * 1.6; this.parts.push({ k: 'spark', col: h.pal.note, x: sx - 1, y: sy + 2, vx: Math.cos(a) * 16, vy: Math.sin(a) * 14, life: 0.35, age: 0 }); }
      if (big && Math.random() < 0.35) this.parts.push({ k: 'gray', x: sx + 6, y: sy - 1, vx: 1, vy: -2, life: 1.4, age: 0 });
      if (this.parts.length > 60) this.parts.splice(0, this.parts.length - 60);
    }
    update(dt) {
      this.t += dt;
      const a = this.anim; a.t = this.t;
      a.bob = Math.max(0, a.bob - dt * 6); a.strum = Math.max(0, a.strum - dt * 7); a.lean = Math.max(0, a.lean - dt * 3.2); a.blink = Math.max(0, a.blink - dt);
      this.idleBlink -= dt;
      if (this.idleBlink < 0) { a.blink = 0.14; this.idleBlink = 2.5 + Math.random() * 4; }
      this.waves = this.waves.filter((w) => this.t - w.t0 < 2.4);
      this.parts.forEach((p) => { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.k === 'note') p.vx += Math.sin(p.age * 8) * dt * 6; });
      this.parts = this.parts.filter((p) => p.age < p.life);
    }
    charPx() {
      if (this.o.charPx) return this.o.charPx;
      if (this.o.mode === 'bar') return Math.max(2, Math.round((this.h * 0.72) / 16));
      if (this.o.mode === 'portrait') return Math.max(2, Math.floor((this.h * 0.7) / 17));
      return Math.max(4, Math.floor(Math.min(this.w * 0.32, this.h * 0.5) / 22));
    }
    draw() {
      const { ctx, w, h, dpr } = this, hero = this.hero(), pal = hero.pal;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const fx = w * this.o.fx, fy = h * this.o.fy;
      if (this.o.gradient) {
        const g = ctx.createLinearGradient(0, 0, w, 0);
        g.addColorStop(0, pal.bg[0]); g.addColorStop(0.65, pal.bg[1]); g.addColorStop(1, pal.bg[2]);
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        const rg = ctx.createRadialGradient(fx, fy, 0, fx, fy, Math.max(w, h) * (this.o.mode === 'full' ? 0.55 : 0.3));
        const e = 0.25 + 0.25 * this.anim.bob, gl = lighten(pal.grid, 0.05);
        rg.addColorStop(0, `rgba(${gl},${0.4 + e * 0.4})`); rg.addColorStop(1, `rgba(${pal.grid},0)`);
        ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);
      } else ctx.clearRect(0, 0, w, h);
      const LV = levels(lighten(pal.grid, 0.15));
      const cs = this.o.cell * (lowQ() ? 1.4 : 1);
      const cols = Math.ceil(w / cs), rows = Math.ceil(h / cs), fcx = fx / cs, fcy = fy / cs, maxR = this.o.radius, t = this.t;
      for (let j = 0; j < rows; j++) {
        for (let i = 0; i < cols; i++) {
          const d = Math.hypot(i + 0.5 - fcx, (j + 0.5 - fcy) * (this.o.mode === 'bar' ? 0.35 : 1));
          let b = 0;
          if (this.o.shimmer) { const band = Math.floor(i / 5); b = 0.1 + 0.11 * Math.sin(t * 1.1 - band * 0.9 + (this.o.mode === 'full' ? Math.floor(j / 5) * 0.7 : 0)); }
          for (const wv of this.waves) { const age = t - wv.t0, r = age * wv.speed; if (d <= r) { const k = 1 - (r - d) / wv.width; if (k > 0) b += wv.s * k * Math.exp(-age * 1.3) * Math.max(0, 1 - d / maxR) * 1.25; } }
          if (b < 0.18) continue;
          ctx.fillStyle = LV[b < 0.42 ? 1 : b < 0.7 ? 2 : 3];
          ctx.fillRect(i * cs + 1, j * cs + 1, cs - 1, cs - 1);
        }
      }
      const px = this.charPx();
      if (this.o.drawChar && this.o.drawChar(ctx, fx, fy, px, this.anim)) { /* 自定义 */ }
      else if (this.o.showChar) {
        const ox = fx - 21 * px * 0.45, oy = fy - 15 * px * 0.38, a = this.anim;
        ctx.fillStyle = 'rgba(10,6,30,0.35)'; ctx.fillRect(ox + px, oy + 10.5 * px, 14 * px, px);
        hero.draw(ctx, ox, oy, px, { bob: a.bob, strum: a.strum > 0.4 ? (a.strumFlip ? 1 : 0) : 0, blink: a.blink > 0, lean: hero.id === 'xs' ? a.lean : 0, t: a.t });
        this.parts.forEach((p) => {
          ctx.globalAlpha = Math.min(1, (1 - p.age / p.life) * 1.5);
          const X = ox + p.x * px, Y = oy + p.y * px;
          if (p.k === 'note') drawPattern(ctx, p.pat, X, Y, Math.max(2, px * (this.o.mode === 'full' ? 0.5 : 0.75)), p.col);
          else if (p.k === 'gray') drawPattern(ctx, NOTE2, X, Y, Math.max(1.5, px * 0.6), PAL.gray);
          else { ctx.fillStyle = p.col; ctx.fillRect(X, Y, px * 0.9, px * 0.6); }
        });
        ctx.globalAlpha = 1;
      }
    }
  }
  Stage.all = new Set();

  // ---------- 像素转场（切换页面时英雄色方块擦过屏幕） ----------
  const wipe = { cv: null, t: -1 };
  function startWipe() {
    if (reduced()) return;
    if (!wipe.cv) { wipe.cv = document.createElement('canvas'); wipe.cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120'; document.body.appendChild(wipe.cv); }

    if (wipe.t < 0) return;

    const D = 0.42, p = wipe.t / D, cs = Math.max(28, Math.round(w / 34)), pal = CF.Heroes.current().pal;
    if (p >= 1) { wipe.t = -1; x.clearRect(0, 0, w, h); return; }
    const cols = Math.ceil(w / cs), rows = Math.ceil(h / cs);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const k = (i / cols) * 0.55 + ((j * 7 + i * 3) % 5) * 0.03;
      const v = Math.sin(Math.PI * CF.clamp((p - k) / 0.45, 0, 1));
      if (v <= 0.02) continue;
      x.globalAlpha = v * 0.92; x.fillStyle = v > 0.7 ? pal.bg[2] : pal.bg[1];
      const s = cs * (0.4 + 0.6 * v); x.fillRect(i * cs + (cs - s) / 2, j * cs + (cs - s) / 2, s - 1, s - 1);

  }

  let last = performance.now(), acc = 0, beatEnv = 0, lastCss = -1;

    requestAnimationFrame(loop);
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.1) dt = 0.1;
    acc += dt;

    const step = acc; acc = 0;
    const beats = CF.Audio ? CF.Audio.pullBeats() : [];
    beats.forEach((b) => (beatEnv = Math.max(beatEnv, b.s)));
    beatEnv = Math.max(0, beatEnv - step * 3.2);
    const v = reduced() ? 0 : Math.round(beatEnv * 20) / 20;
    if (v !== lastCss) { root.style.setProperty('--beat', v); lastCss = v; }
    for (const st of Stage.all) {

      if (!st.visible()) continue;
      if (!st.resize()) continue;
      st.update(step);
      st.draw();
    }
    drawWipe(step);
    CF.bus.emit('frame', step);
  }
  requestAnimationFrame(loop);

  CF.PixelFX = { Stage, drawClawd, drawPattern, PAL, NOTES, wipe: startWipe, beat: () => beatEnv };
})();
