    body.innerHTML = `<div id="chapList"></div><div class="sec-title">沉浸模式 · 烧脑策略</div><div class="grid g2" id="imGrid"></div><div class="sec-title">遭遇战</div><div class="grid g3" id="skGrid"></div><p class="small muted" style="margin-top:14px;line-height:1.7">次级关（剧情关、第三章起为首领关）通关后不能重复挑战，剧情关还需要完成对应的学习才能解锁；小关可以反复挑战，积攒长期补给。每章固定掉落一种碎片或道具，已拥有的英雄碎片会自动转化为晶片。想先体验全部内容，可在「设置」里打开体验模式。</p>`;
    const host = $('#chapList');
    const afterName = (id) => { const L = CF.Levels.get(id); if (L) return L.name; const f = C.find(id); return f ? f.st.name : id; };
    C.CHAPTERS.forEach((ch) => {
      const list = C.stages(ch), won = list.filter((s) => C.cleared(s.id)).length, open = C.unlocked(ch, list[0]);
      const sec = CF.h(`<section class="chap ${open ? '' : 'shut'}"><div class="chap-hd"><canvas></canvas><div class="chap-t"><span class="t-tag">CHAPTER 0${ch.no} · ${ch.en}</span><b>第${'一二三四五六七'[ch.no - 1]}章「${ch.name}」</b><span class="small">${ch.sub}</span></div><div class="chap-drop"><span class="small">本章掉落</span><b>${C.fragName(ch)}</b><span class="small t-num">${C.fragProgress(ch)}</span></div><div class="chap-p"><b class="t-num">${won}/${list.length}</b><span class="small">普通关</span></div></div><div class="stage-path"></div></section>`);
      new CF.PixelFX.Stage(sec.querySelector('canvas'), { mode: 'bar', fx: 0.9, fy: 0.55, cell: 12 });
      const path = sec.querySelector('.stage-path');
      if (!open) { path.appendChild(CF.h(`<p class="small muted" style="grid-column:1/-1">通关第${'一二三四五六七'[ch.no - 2]}章全部普通关后开放（共 ${list.length} 关：${list.filter((x) => x.kind !== 'minor').length} 个次级关 + ${list.filter((x) => x.kind === 'minor').length} 个小关 + 1 个组队副本）。</p>`)); host.appendChild(sec); return; }
      list.forEach((st) => {
        const r = d.campaign[st.id] || {}, un = C.unlocked(ch, st), story = st.kind !== 'minor', L = st.kind === 'story' ? st.L : null;
        const name = L ? L.name : st.kind === 'boss' ? st.name : ch.names[(st.minorNo - 1) % ch.names.length];
        const gift = ch.no === 1 && !story && (st.minorNo === 3 || st.minorNo === 5) ? (st.minorNo === 3 ? 'omni' : 'pearl') : null;
        const el = CF.h(`<button class="stg ${story ? 'story' : 'minor'} ${un ? '' : 'locked'} ${r.won ? 'won' : ''}"><span class="stg-no t-num">${ch.no}-${st.i + 1}</span><span class="stg-kind">${st.kind === 'boss' ? '次级关 · 首领' : story ? '次级关' : '小关 ' + st.minorNo}</span><b>${name}</b><span class="stars">${'★'.repeat(r.stars || 0)}<i>${'★'.repeat(3 - (r.stars || 0))}</i></span>${tierPill(st.P)}${gift && !CF.Roster.owns(gift) ? `<span class="gift">${gift === 'omni' ? '首通集齐「万象」碎片' : '首通送「珠问」'}</span>` : ''}${story && r.won ? '<span class="stamp">已通关</span>' : ''}${!un ? `<span class="lock">${CF.Icons ? CF.Icons.svg('lock') : '🔒'}</span>` : ''}</button>`);
        el.onclick = () => {
          CF.Audio.sfx('click');
          if (!un) { const req = st.kind === 'story' ? C.storyReqs(st).filter((x) => !x.ok).map((x) => x.text) : []; CF.toast(req.length ? '解锁条件：' + req.join('；') : '先通关上一关', 'bad', 3200); CF.Audio.sfx('error'); return; }
          if (story && r.won && !CF.P.trial()) { CF.toast('次级关通关后不能重复挑战——去小关积攒补给吧'); return; }
          UI.briefing(C.level(ch, st));
        };
        path.appendChild(el);
      });
      // 组队副本
      const du = C.dungeonUnlocked(ch), left = C.attempts(ch), rw = C.dungeonRewards(ch);
      const dg = CF.h(`<button class="stg dungeon ${du ? '' : 'locked'}"><span class="stg-no t-num">${ch.no}-副本</span><span class="stg-kind">组队副本 · 5 波</span><b>${ch.dungeon.name}</b>${tierPill(ch.dungeon.P)}<span class="small">${du ? `今日剩余 ${left}/${C.ATTEMPTS} 次` : `通关「${afterName(ch.dungeon.after)}」后开放`}</span><span class="drw">${rw.map((x) => `<i title="${C.rewardText(x, ch)}">${x.wave}</i>`).join('')}</span><span class="gift">第 5 波：${C.fragName(ch)} ×3</span>${!du ? `<span class="lock">${CF.Icons ? CF.Icons.svg('lock') : '🔒'}</span>` : ''}</button>`);
      dg.onclick = () => { CF.Audio.sfx('click'); if (!du) { CF.toast(`先通关「${afterName(ch.dungeon.after)}」`, 'bad'); return; } if (left <= 0 && !CF.P.trial()) { CF.toast('今天的挑战次数用完了，明天再来（稀缺性规则：每天 3 次）'); return; } UI.briefing(C.dungeonLevel(ch, [])); };
      path.appendChild(dg);
      host.appendChild(sec);
    });
    const im = $('#imGrid');
    (CF.Immersive ? CF.Immersive.LEVELS : []).forEach((L) => {
      const rec = d.campaign[L.id] || {};
      const el = CF.h(`<div class="card labcard"><div class="t-tag">IMMERSIVE · 参考魔兽争霸 3</div><h3 style="margin-top:4px">${L.name} <span class="stars" style="color:var(--gold)">${'★'.repeat(rec.stars || 0)}</span></h3><p>${L.brief}</p><p class="small" style="margin-top:6px;color:var(--hero2)">战争迷雾 · 野怪营地 · 英雄升级与物品 · 攻防类型 · 人口维护费 · 科技等级 · AI 对手 · 昼夜</p></div>`);
      el.onclick = () => { CF.Audio.sfx('click'); UI.briefing(L); };
      im.appendChild(el);
    });
    const sk = $('#skGrid');
    Object.keys(CF.Levels.DIFF).forEach((k) => {
      const D = CF.Levels.DIFF[k];
      const el = CF.h(`<div class="card labcard"><div class="t-tag">SKIRMISH</div><h3>${D.name}</h3><p>随机地形，摧毁乱码主脑获胜。敌军强度 ×${D.mul}，波次间隔 ${D.gap}s。已获胜 ${d.skirmish[k] || 0} 次。</p></div>`);
      el.onclick = () => { CF.Audio.sfx('click'); UI.briefing(CF.Levels.skirmish(k)); };
      sk.appendChild(el);
    });
  };
  // 出征前选英雄：只能选已拥有的英雄（同时成为大厅的当前英雄与界面主题）
  UI.heroPicker = function (onPick) {
    const box = CF.h('<div class="hero-pick"></div>');
    if (!CF.Roster.owns(CF.Save.data.hero)) { CF.Save.data.hero = CF.Roster.STARTER; CF.Heroes.applyTheme(CF.Roster.STARTER); }

      box.appendChild(b);
    });
    return box;
  };
  // 组队副本：选 2 位队友（已拥有的英雄优先；不够时由「援军」试用英雄补位）

    const box = CF.h('<div class="hero-pick mates"></div>');

      box.innerHTML = '';
      const main = CF.Save.data.hero;
      L.team = (L.team || []).filter((id) => id !== main);
      const pool = CF.Heroes.list.filter((h) => h.id !== main && (CF.Roster.owns(h.id) || GUESTS.includes(h.id)));
      if (!L._auto) { L._auto = true; pool.sort((a, b) => CF.Roster.owns(b.id) - CF.Roster.owns(a.id)).slice(0, 2).forEach((h) => L.team.push(h.id)); }

  UI.briefing = function (L) {

    const waves = L.waves && !L.immersive ? L.waves : null, maxT = waves ? Math.max(...waves.map(C.Diff.threatOf)) : 1;
    const kind = L.dungeon ? '组队副本 · 5 波 · 每波都有奖励' : L.story ? '次级关 · 3 波 · 通关后不可重复挑战' : L.minor ? '小关 · 3 波 · 可重复挑战' : '';
    const rewards = L.dungeon ? C.dungeonRewards(ch).map((r) => `<div class="small" style="line-height:1.9"><span class="c-chip">第 ${r.wave} 波</span> ${C.rewardText(r, ch)}</div>`).join('') : L.minor ? `<div class="small" style="line-height:1.9">每次通关：主城补给（晶片 / 语料 / 算力，按难度与星级）；首通双倍 + 学习加速 ×1</div>` : L.story ? `<div class="small" style="line-height:1.9">首通：主城补给${L.id === 'L3' ? ` + ${CF.Heroes.get(CF.Roster.STARTER).name}的法宝「${CF.Heroes.get(CF.Roster.STARTER).instrument}」` : ''}</div>` : '';

    let mates = null;
    const info = () => { const h = CF.Heroes.current(); body.querySelector('#bfHero').innerHTML = `<b style="color:var(--hero2)">${h.name}</b> · ${h.role} · 专属小兵「${h.minion.name}」· 专属建筑「${h.building.name}」${CF.Treasure.has(h.id) ? '' : ` · <span style="color:var(--pink)">未获得法宝「${h.instrument}」，终极技能不可用</span>`}`; if (mates) mates.redraw(); };
    body.querySelector('#bfPick').appendChild(UI.heroPicker(info));
    if (L.dungeon) { mates = UI.matePicker(L); body.querySelector('#bfMates').appendChild(mates); }
    info();
    const start = () => {
      if (L.dungeon && !CF.P.trial() && C.attempts(ch) <= 0) return CF.toast('今天的挑战次数用完了', 'bad');

      if (!CF.Stamina.spend(L)) return;
      if (L.dungeon && !CF.P.trial()) { CF.Save.data.dungeon[L.id].used++; CF.Save.save(); }

  };

  // ================= 战斗：开始 / 离开 =================
  let raf = 0, lastT = 0, frameN = 0;
  UI.startBattle = function (L, paid) {
    if (!paid && !CF.Stamina.spend(L)) return; // 体力：开战前扣除（学习类内容不消耗）
    if (CF.Game.current) CF.Game.current.destroy();
    UI.show('battle');
    const g = (CF.Game.current = new CF.Game.Game(L));
    if (g.imInit) g.imInit();
    if (L.onInit) L.onInit(g);

      const row = CF.h(`<div class="set-row"><span class="nm">${n}</span><div class="ctl"><input type="range" min="0" max="1" step="0.05" value="${s[k]}"><span class="mono small" style="width:40px">${Math.round(s[k] * 100)}%</span></div></div>`);
      const inp = row.querySelector('input');
      inp.oninput = () => { s[k] = +inp.value; row.querySelector('.mono').textContent = Math.round(s[k] * 100) + '%'; A.applyVolumes(); CF.Save.save(); };
      vols.appendChild(row);
    });
    const rows = $('#bgmRows');
    for (const key of Object.keys(A.SCREENS)) {
      const src = await A.customSource(key);
      const style = (s.bgmStyle || {})[key] || A.DEFAULT_STYLE[key];
      const row = CF.h(`<div class="set-row"><span class="nm">${A.SCREENS[key]}</span><div class="ctl">
        <select class="sty">${['hero'].concat(Object.keys(A.STYLES)).map((k) => `<option value="${k}" ${k === style ? 'selected' : ''}>${k === 'hero' ? '当前英雄主题曲' : A.STYLES[k].name}</option>`).join('')}</select>
        <span class="src">${src ? '🎵 ' + CF.esc(src.name) : '程序吉他曲'}</span>
        <button class="btn sm up">本地文件</button>${src && src.kind === 'blob' ? '<button class="btn sm ghost clr">清除</button>' : ''}<button class="btn sm ghost tr">▶ 试听</button>
        <input type="file" accept="audio/*" class="hidden"></div></div>`);
      const file = row.querySelector('input[type=file]');
      row.querySelector('.sty').onchange = (e) => { s.bgmStyle = Object.assign({}, s.bgmStyle, { [key]: e.target.value }); CF.Save.save(); if (A.screen === key) A.restart(); };
      row.querySelector('.up').onclick = () => file.click();
      file.onchange = async () => {
        const f = file.files[0]; if (!f) return;
        if (f.size > 40 * 1024 * 1024) { CF.toast('文件太大（上限 40MB）', 'bad'); return; }
        try { await A.DB.put(key, { name: f.name, blob: f }); CF.toast(`已设置「${A.SCREENS[key]}」的背景音乐`, 'good'); if (A.screen === key) A.restart(); UI.renderSettings(); }
        catch (e) { CF.toast('保存失败：浏览器不支持本地存储', 'bad'); }
      };
      const clr = row.querySelector('.clr');
      if (clr) clr.onclick = async () => { await A.DB.del(key); CF.toast('已恢复程序吉他曲'); if (A.screen === key) A.restart(); UI.renderSettings(); };
      row.querySelector('.tr').onclick = () => { A.unlock(); const prev = A.screen; A.screen = null; A.play(key); CF.toast(`试听：${A.SCREENS[key]}（离开设置页恢复）`); UI._restoreMusic = prev; };
      rows.appendChild(row);
    }
    $('#setVoice').value = s.voice || 'auto'; $('#setVoiceEng').textContent = '当前：' + CF.Voice.engine(); $('#setVoice').onchange = (e) => { s.voice = e.target.value; CF.Save.save(); $('#setVoiceEng').textContent = '当前：' + CF.Voice.engine(); };
    $('#setVoiceTry').onclick = () => { CF.Audio.unlock(); CF.Voice.line(CF.Heroes.current()); };
    $('#setHeroSfx').checked = s.heroSfx !== false; $('#setHeroSfx').onchange = (e) => { s.heroSfx = e.target.checked; CF.Save.save(); };
    $('#setRM').checked = !!s.reduceMotion; $('#setRM').onchange = (e) => { s.reduceMotion = e.target.checked; document.body.classList.toggle('reduce-motion', s.reduceMotion); CF.Save.save(); };
    $('#setQ').value = s.quality; $('#setQ').onchange = (e) => { s.quality = e.target.value; CF.Save.save(); };
    $('#setTrial').checked = !!s.trial; $('#setTrial').onchange = (e) => { s.trial = e.target.checked; CF.Save.save(); CF.P._unlockSnapshot = CF.P.unlockSnapshot(); CF.toast(s.trial ? '体验模式已开启' : '体验模式已关闭'); };
    $('#goProfile').onclick = () => UI.show('profile');
    $('#resetSave').onclick = () => CF.modal.open({ title: '清空全部进度？', body: '<p>经验、实验、实践日志、战役记录都会被删除，且无法恢复。建议先导出存档。</p>', foot: [{ text: '取消', cls: 'ghost' }, { text: '确认清空', cls: 'primary', onClick: () => { CF.Save.reset(); CF.modal.close(); CF.toast('已清空'); UI.show('lobby'); } }] });
  };

  UI.endScreen = function (g, win, stars, why) {
    if (CF.Game.current !== g) return;
    if (CF.Tutorial) CF.Tutorial.stop();
    UI.closeRadial();
    CF.Audio.play(win ? 'victory' : 'defeat');
    CF.Audio.sfx(win ? 'win' : 'lose');
    const L = g.L, next = L.chapter && win ? CF.Chapters.next(L.id) : null;
    const st = g.stats;
    const advice = win ? (CF.P.ratio().kPct > 0.35 ? '下一步：去实验室做一个实验，把知识变成手上的能力。' : '下一步：去学院完成今日修炼，解锁更多关卡与建筑。') : '失败也是数据。复盘：经济是否太慢？防线是否放在峡口？技能是否在敌人密集时释放？';
    const body = CF.h(`<div class="endstats">
      <div class="ultrabar" style="margin:0 0 12px;height:70px"><canvas></canvas><div class="ub-title" style="left:18px">${win ? '胜利' : '失败'}<span class="ub-sub">${win ? L.name : why || ''}</span></div></div>
      <div class="stars-big">${[0, 1, 2].map((i) => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('')}</div>
      <div class="small muted" style="text-align:center;margin-bottom:10px">${L.stars.map((s, i) => `${i < stars ? '✓' : '○'} ${s[0]}`).join('　')}</div>
      ${(g.stageRewards || g.waveRewards || []).length ? `<div class="explain gold" style="margin-bottom:10px">${(g.stageRewards || []).concat(g.waveRewards || []).map((l) => `<div>🎁 ${l}</div>`).join('')}</div>` : ''}
      ${g.cityReward ? `<div class="explain" style="margin-bottom:10px">🏰 主城仓库入账：<span class="c-chip">+${g.cityReward.chip}</span> <span class="c-corp">+${g.cityReward.corp}</span> <span class="c-comp">+${g.cityReward.comp}</span></div>` : ''}
      <div class="kpis"><div class="kpi"><div class="l">用时</div><div class="v">${CF.fmtTime(g.time)}</div></div><div class="kpi"><div class="l">消灭乱码</div><div class="v">${st.kills}</div></div><div class="kpi"><div class="l">我方损失</div><div class="v">${st.lost}</div></div><div class="kpi"><div class="l">建造 / 训练</div><div class="v">${st.built} / ${st.trained}</div></div><div class="kpi"><div class="l">技能释放</div><div class="v">${st.riffs}</div></div><div class="kpi"><div class="l">采集</div><div class="v" style="font-size:15px"><span class="c-chip">${Math.round(st.gathered.chip)}</span> <span class="c-corp">${Math.round(st.gathered.corp)}</span> <span class="c-comp">${Math.round(st.gathered.comp)}</span></div></div></div>
      <div class="sec-title">兵力曲线（单位总耐久）</div><canvas class="chart" id="chArmy"></canvas>
      <div class="sec-title">波次战损</div><canvas class="chart" id="chWave"></canvas>
      <div class="explain" style="margin-top:12px">📘 ${advice}</div></div>`);
    new CF.PixelFX.Stage(body.querySelector('.ultrabar canvas'), { mode: 'bar', fx: 0.86, fy: 0.55, cell: 12 });
    const foot = [{ text: '返回征程', cls: 'ghost', onClick: () => { CF.modal.close(); UI.show('campaign'); } }];
    if (!(L.story && win) && !L.dungeon) foot.push({ text: '再来一次', onClick: () => { CF.modal.close(); UI.startBattle(UI.relevel(L)); } });
    if (win && next) foot.push({ text: '下一关 ▶', cls: 'primary', onClick: () => { CF.modal.close(); UI.briefing(next); } });
    else if (win) foot.push({ text: '去学院', cls: 'primary', onClick: () => { CF.modal.close(); UI.show('academy'); } });
    CF.modal.open({ title: win ? '作战报告 · 胜利' : '作战报告 · 失败', body, foot, closable: false });
    setTimeout(() => { UI.chartArmy(body.querySelector('#chArmy'), st.army); UI.chartWave(body.querySelector('#chWave'), st.waves); }, 40);
  };
  function chartSetup(cv) { const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight; cv.width = w * dpr; cv.height = h * dpr; const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); return [x, w, h]; }
  UI.chartArmy = function (cv, data) {
    const [x, w, h] = chartSetup(cv), pad = 28;
    if (data.length < 2) { x.fillStyle = '#9d96ad'; x.fillText('数据不足', 12, 20); return; }
    const T = data[data.length - 1].t || 1, M = Math.max(1, ...data.map((d) => Math.max(d.me, d.foe)));
    const X = (t) => pad + (t / T) * (w - pad - 10), Y = (v) => h - 20 - (v / M) * (h - 34);
    x.strokeStyle = '#2b2641'; for (let i = 0; i <= 4; i++) { x.beginPath(); x.moveTo(pad, Y((M * i) / 4)); x.lineTo(w - 10, Y((M * i) / 4)); x.stroke(); }
    [['me', '#d97757', '我方'], ['foe', '#ff4f9a', '乱码']].forEach(([k, c, n], j) => {
      x.strokeStyle = c; x.lineWidth = 2; x.beginPath(); data.forEach((d, i) => (i ? x.lineTo(X(d.t), Y(d[k])) : x.moveTo(X(d.t), Y(d[k])))); x.stroke();
      x.fillStyle = c; x.fillRect(w - 110 + j * 52, 8, 10, 3); x.fillStyle = '#ede6d6'; x.font = '11px sans-serif'; x.fillText(n, w - 96 + j * 52, 13);
    });
    x.lineWidth = 1; x.fillStyle = '#9d96ad'; x.font = '10px ui-monospace,monospace'; x.fillText('0', pad - 10, h - 18); x.fillText(CF.fmtTime(T), w - 40, h - 6);
  };
  UI.chartWave = function (cv, waves) {
    const [x, w, h] = chartSetup(cv), pad = 28;
    if (!waves.length) { x.fillStyle = '#9d96ad'; x.fillText('没有波次数据', 12, 20); return; }
    const M = Math.max(1, ...waves.map((d) => Math.max(d.lost, d.killed))), bw = Math.min(40, (w - pad - 10) / waves.length);
    waves.forEach((d, i) => {
      const bx = pad + i * bw + 3, hk = (d.killed / M) * (h - 36), hl = (d.lost / M) * (h - 36);
      x.fillStyle = '#ff4f9a'; x.fillRect(bx, h - 20 - hk, bw / 2 - 3, hk);
      x.fillStyle = '#d97757'; x.fillRect(bx + bw / 2 - 2, h - 20 - hl, bw / 2 - 3, hl);
      x.fillStyle = '#9d96ad'; x.font = '10px ui-monospace,monospace'; x.fillText(String(d.n), bx + bw / 2 - 6, h - 6);
    });
    x.fillStyle = '#ff4f9a'; x.fillRect(w - 150, 8, 10, 3); x.fillStyle = '#ede6d6'; x.font = '11px sans-serif'; x.fillText('消灭乱码', w - 136, 13);
    x.fillStyle = '#d97757'; x.fillRect(w - 76, 8, 10, 3); x.fillStyle = '#ede6d6'; x.fillText('我方损失', w - 62, 13);
  };

  // ================= 通讯头像 =================
  UI.initComms = function () {
    new CF.PixelFX.Stage($('#commsCv'), {
      mode: 'portrait', fx: 0.42, fy: 0.62, cell: 8, radius: 14,
      drawChar(ctx, fx, fy, px) {
        const who = UI.commsWho;
        if (who === '侦察Agent') { CF.PixelFX.drawClawd(ctx, fx - 6.5 * px, fy - 6 * px, px, { noGuitar: true, tint: '#f0a080' }); ctx.fillStyle = '#b3abea'; ctx.fillRect(fx, fy - 9 * px, px, 3 * px); return true; }
        if (who === '乱码') { ctx.fillStyle = '#ff4f9a'; ctx.font = `bold ${px * 10}px ui-monospace,monospace`; ctx.fillText('#?%'[Math.floor(performance.now() / 120) % 3], fx - px * 4, fy + px * 3); return true; }
        if (who === '指挥官' && CF.Labs.drawAvatar(ctx, fx - px * 7, fy - px * 8, px * 14)) return true;
        return false;
      },
    });
  };

  // ================= 横屏提示 =================
  let stayPortrait = false;
  UI.checkRotate = function () {
    const app = $('#app'), portrait = window.innerHeight > window.innerWidth, coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
    if (!portrait) app.classList.remove('rotated');
    UI.compact();
    const need = UI.cur === 'battle' && portrait && coarse && !app.classList.contains('rotated') && !stayPortrait;
    $('#rotateHint').classList.toggle('show', need);
    if (UI.cur === 'battle') setTimeout(UI.resizeBattle, 60); else UI.compact();
  };
  UI.initRotate = function () {
    $('#rhRotate').onclick = async () => {
      CF.Audio.unlock();
      try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) { /* 不支持则用 CSS 旋转 */ }
      setTimeout(() => { if (window.innerHeight > window.innerWidth) $('#app').classList.add('rotated'); UI.checkRotate(); }, 350);
    };
    $('#rhStay').onclick = () => { stayPortrait = true; UI.checkRotate(); };
    window.addEventListener('resize', UI.checkRotate);
    window.addEventListener('orientationchange', () => setTimeout(UI.checkRotate, 200));
  };

  // ================= 健康提醒 =================
  UI.initBreak = function () {
    let active = 0;
    setInterval(() => {
      if (document.hidden) return;
      active += 10; CF.Save.data.stats.playSec += 10;
      if (active % 60 === 0) CF.Save.save();
      if (active >= 25 * 60) {
        active = 0;
        CF.toast('已专注 25 分钟：起身远眺 20 秒，拉伸肩颈 💪', 'gold', 6000);
        if (UI.cur === 'battle') UI.say('HERO', '指挥官，休息一下眼睛吧。体能也是战斗力。');
      }
    }, 10000);
  };
})();

</script>
<script>
/* js/lobby.js */
/* 大厅（王者荣耀式：四周功能分区，中央展示英雄；QQ 飞车式：玩法入口透视倾斜给角色让位）与英雄图鉴 */
(function () {
  const CF = window.CF;
  const $ = CF.$;
  const L = (CF.Lobby = {});
  const MODES = [
    ['quick', '快速模式', '90 秒节奏爽局 · 通勤一局', 'COMMUTE', true],
    ['immersive', '沉浸模式', '迷雾 · 野怪 · 英雄成长 · AI 对手', 'STRATEGY'],
    ['campaign', '征程', '七章 · 组队副本 · 遭遇战', 'CAMPAIGN'],
    ['city', '主城 · 电路工坊', '高中到大学电路 · 电网产出', 'CIRCUIT'],
  ];
  const NAV = [['heroes', '🎸', '英雄'], ['city', '🏰', '主城'], ['academy', '📚', '学院'], ['labs', '🧪', '实验室'], ['profile', '📈', '档案'], ['achievements', '🏆', '成就'], ['shop', '🛒', '商城'], ['help', '❔', '说明']];
  let active = 0, stage = null;

  function go(id) {
    CF.Audio.unlock(); CF.Audio.sfx('click');
    if (id === 'quick') return CF.Quick.start();
    if (id === 'immersive') return CF.UI.briefing(CF.Immersive.get('IM1'));
    CF.UI.show(id);
  }
  L.init = function () {
    stage = new CF.PixelFX.Stage($('#lobbyStage'), { mode: 'full', fx: 0.36, fy: 0.5, cell: 28, radius: 34 });
    const fit = () => { const w = window.innerWidth, h = window.innerHeight; if (w > h && h <= 520) { stage.o.fx = 0.34; stage.o.fy = 0.43; stage.o.charPx = Math.max(3, Math.floor((h * 0.3) / 20)); } else if (w < 760 || h > w) { stage.o.fx = 0.5; stage.o.fy = 0.3; stage.o.charPx = Math.max(4, Math.floor(Math.min(w, h * 0.8) / 34)); } else { stage.o.fx = 0.36; stage.o.fy = 0.5; stage.o.charPx = 0; } };
    fit(); window.addEventListener('resize', fit);
    $('#lobbyLogo').innerHTML = CF.Brand.keyLogo();
    const modes = $('#lobbyModes');
    const bars = MODES.map(([id, n, sub, tag, big], i) => {
      const b = CF.h(`<button class="mode ${big ? 'big' : ''}"><canvas></canvas><span class="tag">${tag}</span><span class="mt">${n}</span><span class="ms">${sub}</span></button>`);
      new CF.PixelFX.Stage(b.querySelector('canvas'), { mode: 'bar', fx: 0.86, fy: 0.55, cell: 11, activeFn: () => active === i && CF.UI.cur === 'lobby' });
      b.onmouseenter = () => { if (active !== i) { active = i; sync(); CF.Audio.sfx('hover'); } };
      b.onfocus = () => { active = i; sync(); };
      b.onclick = () => go(id);
      modes.appendChild(b);
      return b;
    });
    const sync = () => bars.forEach((b, i) => b.classList.toggle('on', i === active));
    sync();
    const nav = $('#lobbyNav');
    NAV.forEach(([id, ic, n]) => { const b = CF.h(`<button><span>${ic}</span>${n}</button>`); b.onclick = () => go(id); nav.appendChild(b); });
    $('#lobbyHelp').onclick = () => go('help');
    $('#lobbyStamina').onclick = () => { CF.Audio.sfx('click'); CF.Stamina.open(); };
    $('#lobbySettings').onclick = () => go('settings');
    $('#lobbyProfile').onclick = () => go('profile');
    $('#heroPrev').onclick = () => L.cycle(-1);
    $('#heroNext').onclick = () => L.cycle(1);
    // 点英雄：弹一段招牌乐句 + 口头禅
    $('#lobbyStage').addEventListener('click', (e) => {
      const r = $('#lobbyStage').getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      if (Math.abs(x - stage.o.fx) < 0.18 && Math.abs(y - stage.o.fy) < 0.25) L.poke();
    });
    window.addEventListener('keydown', (e) => {
      if (CF.UI.cur !== 'lobby' || CF.modal.isOpen()) return;
      if (e.key === 'ArrowDown') { active = (active + 1) % bars.length; sync(); bars[active].focus(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { active = (active + bars.length - 1) % bars.length; sync(); bars[active].focus(); e.preventDefault(); }
      if (e.key === 'ArrowLeft') L.cycle(-1);
      if (e.key === 'ArrowRight') L.cycle(1);
    });
  };
  L.poke = function () {
    const h = CF.Heroes.current();
    CF.Audio.unlock(); CF.Audio.lick(h.id);
    stage.pulse(1, true); setTimeout(() => stage.pulse(0.8, true), 180);
    const old = document.querySelector('#scr-lobby .bubble'); if (old) old.remove();
    const line = CF.Voice.pick(h); CF.Voice.say(h, line); // 配音：多次点击随机切换，不连续重复
    const b = CF.h(`<div class="bubble">${CF.esc(line)}</div>`);
    const r = $('#lobbyStage').getBoundingClientRect();
    b.style.left = r.width * stage.o.fx - 30 + 'px'; b.style.top = r.height * stage.o.fy - stage.charPx() * 14 + 'px';
    $('#scr-lobby').appendChild(b); setTimeout(() => b.remove(), 2600);
  };
  L.cycle = function (d) {
    const list = CF.Roster.ownedList(), i = list.findIndex((h) => h.id === CF.Heroes.current().id);
    if (list.length < 2) { CF.toast(`目前只拥有${CF.Heroes.current().name}——第一章第 3 个小关送「万象」`); return; }
    const h = list[(i + d + list.length) % list.length];
    L.setHero(h.id);
  };
  L.setHero = function (id) {
    if (!CF.Roster.owns(id)) { CF.toast(`${CF.Heroes.get(id).name}：${CF.Roster.how(id)}`, 'bad', 2800); return; }
    CF.Save.data.hero = id; CF.Save.save();
    CF.Heroes.applyTheme(id);
    CF.PixelFX.wipe();
    CF.Audio.restart();
    if (CF.UI.cur === 'lobby') { L.render(); setTimeout(L.poke, 350); }
  };
  L.render = function () {
    const h = CF.Heroes.current(), rk = CF.P.rank(), d = CF.Save.data, plan = CF.P.dailyPlan(), r = CF.P.ratio();
    $('#heroPlate').innerHTML = `<div class="side">${h.protagonist ? '主角 · PROTAGONIST' : h.side === '中' ? 'CN · 中国' : 'US · 美国'} · ${h.instrument}</div><div class="nm">${CF.Brand.rise(h.name)}<small>${h.title}</small></div><div class="t-quote q">${CF.esc(h.quote)}</div><div class="row wrap"><span class="pill">${h.role}</span><span class="pill">♪ ${CF.Audio.STYLES[h.music.style].name.split('·')[1] || ''}</span><button class="btn sm" id="lobHeroInfo">英雄档案</button></div>`;
    $('#lobHeroInfo').onclick = () => CF.UI.show('hero', h.id);
    const pc = document.createElement('canvas'); pc.width = pc.height = 80; const x = pc.getContext('2d');
    if (!CF.Labs.drawAvatar(x, 4, 4, 72)) h.draw(x, 6, 26, 3.2, { t: 0, noInst: true });
    $('#lobbyProfile').innerHTML = ''; $('#lobbyProfile').appendChild(pc);
    $('#lobbyProfile').appendChild(CF.h(`<div><div class="rk">${rk.name} <span class="mono muted" style="font-size:11px">${rk.xp} XP</span></div><div class="bar"><i style="width:${rk.prog * 100}%;background:var(--gold)"></i></div><div class="small muted" style="margin-top:3px">连续 ${d.streak.count} 天 · 知识:实操 ${r.t ? Math.round(r.kPct * 100) + ':' + Math.round(r.pPct * 100) : '—'}</div></div>`));
    const cr = CF.City ? CF.City.storage() : { chip: 0, corp: 0, comp: 0 };
    $('#lobbyRes').innerHTML = `<span class="c-chip">◆ ${CF.fmtNum(cr.chip)}</span><span class="c-corp">◆ ${CF.fmtNum(cr.corp)}</span><span class="c-comp">◆ ${CF.fmtNum(cr.comp)}</span>`;
    const qb = d.quick.best;
    $('#lobbySide').innerHTML = '';
    [['academy', '今日修炼', `${plan.done.length}/${plan.items.length} 已完成`, plan.done.length / plan.items.length], ['labs', '实验室', `${CF.P.labsDoneCount()}/8 个实验`, CF.P.labsDoneCount() / 8], ['quick', '快速模式纪录', qb ? `${qb} 分 · ${d.quick.bestRank}` : '还没有纪录', 0]].forEach(([id, t, s2, p]) => {

      <div class="ens-secs">${CF.Audio.SECTIONS.map(([n, b, d], i) => `<button class="ens-sec" data-bar="${b}"><b>${i + 1} · ${n}</b><span>${d}</span></button>`).join('')}</div>

  };

<script>
/* js/tutorial.js */
/* 新手教程（第一关首次进入自动开始）与「操作说明」页面 */
(function () {
  const CF = window.CF;
  const $ = CF.$;
  const T = (CF.Tutorial = { active: false, i: 0, flags: {} });
  const touch = () => CF.UI.touch || (window.matchMedia && window.matchMedia('(pointer:coarse)').matches);

  function steps(g) {
    const n0 = g.nodes[0], n1 = g.nodes.find((n) => n !== n0 && n.type === 'chip' && CF.dist(n.x, n.y, g.core.x, g.core.y) < 340) || g.nodes[1];
    const choke = [g.core.x + 330, g.core.y];
    return [
      { t: '欢迎，指挥官', d: `这是你的主脑（橙色六边形）和英雄 <b>${g.heroDef.name}</b>。战斗界面只占屏幕四个角，中间都留给战场。`, btn: '开始' },
      { t: '① 点资源点，建矿机', d: '点一下<b>金色的晶片矿</b>，再点弹出的「矿机」。不需要找按钮——点哪里就在哪里建。', at: () => [n0.x, n0.y], ok: () => g.count('miner') >= 1 },
      { t: '② 再建一座', d: '另一个金色矿点也建上矿机，收入翻倍。', at: () => [n1.x, n1.y], ok: () => g.count('miner') >= 2 },
      { t: '③ 长按空地，拖放炮塔', d: touch() ? '在峡口附近的空地上<b>长按</b>，松手后弹出环形建造菜单，选「炮塔」，把虚影<b>拖到</b>想放的格子，点 ✓ 放置（也可以按住「炮塔」直接拖到战场上）。' : '在峡口附近的空地上<b>右键</b>（或按住左键半秒），弹出环形建造菜单，选「炮塔」，虚影跟着鼠标走，<b>左键</b>放置（按住 Shift 连续建造）。', at: () => choke, ok: () => g.count('turret') >= 1 },
      { t: '④ 选中英雄', d: '点一下英雄，或点右下角的圆形头像。', at: () => (g.hero.dead ? null : [g.hero.x, g.hero.y]), ok: () => g.sel.includes(g.hero.id) },
      { t: '⑤ 点地面移动', d: '英雄选中后，<b>点一下地面</b>就会走过去；点敌人就会攻击。路上遇到敌人也会自动开火。', ok: () => T.flags.moved },
      { t: '⑥ 释放技能', d: touch() ? '点右下角的技能按钮。需要瞄准的技能：按住按钮拖到目标处松手，或先点按钮再点战场。' : '点右下角技能按钮，或按 <b>Q / W / R</b>：技能会对准鼠标所在的位置。', dom: '#skillBar', ok: () => T.flags.cast },
      { t: '⑦ 移动视野', d: touch() ? '单指拖动平移，双指捏合缩放。' : '右键拖动平移，滚轮缩放，或者用方向键。', ok: () => T.flags.camera },
      { t: '⑧ 指挥全军', d: touch() ? '点左下角「全军」选中所有部队；也可以<b>长按后拖动</b>框选。' : '点左下角「全军」（或按 A）选中所有部队；按住左键拖动可以框选。', dom: '#fabAll', ok: () => T.flags.boxsel },
      { t: '准备好了！', d: '守住 3 波进攻。随时可以在 ☰ 菜单里查看操作速查，或去大厅的「说明」页面。', btn: '开战' },
    ];
  }
  T.maybeStart = function (g, force) {
    T.stop();
    if (!(force || (g.L.id === 'L1' && !CF.Save.data.tutorial.done))) return;
    T.active = true; T.i = 0; T.flags = {}; T.list = steps(g);
    T.hand = CF.h('<div class="tut-hand">👆</div>'); T.ring = CF.h('<div class="tut-ring"></div>');
    $('#field').appendChild(T.hand); $('#field').appendChild(T.ring);
    T.render();
  };
  T.stop = function () { T.active = false; $('#tutBox').innerHTML = ''; if (T.hand) T.hand.remove(); if (T.ring) T.ring.remove(); T.hand = T.ring = null; };
  T.render = function () {
    const s = T.list[T.i];
    $('#tutBox').innerHTML = `<div class="tut"><div class="st">新手教程 · ${T.i + 1}/${T.list.length}</div><h4>${s.t}</h4><p>${s.d}</p><div class="row"><button class="btn sm ghost" id="tutSkip">跳过教程</button>${s.btn ? `<button class="btn sm primary" id="tutNext">${s.btn}</button>` : '<span class="small muted">完成后自动进入下一步</span>'}</div></div>`;
    $('#tutSkip').onclick = () => T.finish(true);
    const n = $('#tutNext'); if (n) n.onclick = () => T.next();
  };
  T.next = function () { CF.Audio.sfx('correct'); T.i++; if (T.i >= T.list.length) return T.finish(); T.render(); };
  T.finish = function (skipped) { CF.Save.data.tutorial.done = true; CF.Save.save(); T.stop(); CF.toast(skipped ? '已跳过教程，随时可以在「说明」里重新开始' : '教程完成！守住阵地吧', 'gold'); };
  T.tick = function (g) {
    if (!T.active) return;

    const s = T.list[T.i];
    if (s.ok && s.ok()) return T.next();

    else if (s.dom) { const el = $(s.dom), fr = CF.appRect($('#field')), r = CF.appRect(el); pos = [r.left - fr.left + r.width / 2, r.top - fr.top + r.height / 2, Math.max(r.width, r.height) / 2 + 6]; }
    T.hand.style.display = T.ring.style.display = pos ? 'block' : 'none';
    const card = $('#tutBox .tut'), fh = $('#field').clientHeight;
    if (card) { const low = pos && pos[1] < fh * 0.5; card.style.top = low ? 'auto' : ''; card.style.bottom = low ? (document.body.classList.contains('compact') ? '84px' : '96px') : ''; }
    if (pos) { T.hand.style.left = pos[0] + 'px'; T.hand.style.top = pos[1] + 'px'; T.ring.style.left = pos[0] - pos[2] + 'px'; T.ring.style.top = pos[1] - pos[2] + 'px'; T.ring.style.width = T.ring.style.height = pos[2] * 2 + 'px'; }
  };
  CF.bus.on('moved', () => (T.flags.moved = true));
  CF.bus.on('hero:cast', () => (T.flags.cast = true));
  CF.bus.on('camera', () => (T.flags.camera = true));
  CF.bus.on('boxsel', () => (T.flags.boxsel = true));

  // ================= 操作说明 =================
  T.renderHelp = function () {
    const G = [
      ['👆', '点一下', '选中单位或建筑；选中部队后点地面＝移动（沿途自动攻击），点敌人＝集火；点空资源点＝建矿机。', '左键单击（同左）'],
      ['✌', '双击', '双击我方单位：选中屏幕内所有同类；双击空地：取消选择。', '双击'],
      ['⏳', '长按', '长按空地后松手：在这里弹出环形建造菜单。', '右键空地（或按住左键半秒）'],
      ['⬚', '长按 + 拖动', '框选多个单位。', '按住左键拖动'],

      <div class="gest">${G.map(([i, t, d, m]) => `<div class="card"><div class="gi">${i}</div><div><h3>${t}</h3><p>${d}</p><p class="small" style="margin-top:4px;color:var(--hero2)">🖱 ${m}</p></div></div>`).join('')}</div>

        <div class="card"><h3>🗺 征程（战役 + 遭遇战）</h3><p>5 关剧情战役，每关有三星评价；遭遇战随机地形、三档难度。</p></div>
        <div class="card"><h3>🏰 主城</h3><p>像海岛奇兵 / 部落冲突一样建造与升级城池：大本营、资源建筑、研究所、英雄殿、兵营、城墙与防御塔。资源随真实时间产出；完成学习任务获得「学习加速」；「乱码入侵」会用你的城池布局打一场防守战。</p></div>
      </div>
      <div class="sec-title">沉浸模式数值手册</div>

      <div class="sec-title">学习 → 战力</div>
      <p class="small muted" style="line-height:1.9">知识经验 → 起始晶片；实操经验 → 起始语料；完成实验 → 算力产出；线下任务 → 英雄技能伤害；「体」→ 英雄耐久；主城研究所 → 全军伤害 / 护甲；主城英雄殿 → 英雄属性。真正的成长发生在游戏之外——线下任务要真的去做。</p>`;
    $('#startTut').onclick = () => { CF.Save.data.tutorial.done = false; CF.UI.startBattle(CF.Levels.get('L1'), true); };
  };

<script>
/* js/quick.js */
/* 快速模式：90 秒节奏爽局（通勤单手玩，竖屏横屏均可）
 * 设计要点：0 学习成本 · 每 1~3 秒一次正反馈 · 踩拍的「完美」 · 连击称号 · 三选一强化 · FEVER 爆发 · 结尾一张成绩卡 */
(function () {
  const CF = window.CF;
  const $ = CF.$;
  const TAU = Math.PI * 2;
  const Q = (CF.Quick = { on: false });
  const DUR = 90;
  const ETYPE = {
    bug: { hp: 26, r: 9, speed: 95, dmg: 6, xp: 1, score: 10 },
    bat: { hp: 20, r: 10, speed: 135, dmg: 5, xp: 1, score: 12, air: true },
    noise: { hp: 60, r: 11, speed: 70, dmg: 9, xp: 2, score: 20 },
    titan: { hp: 380, r: 21, speed: 46, dmg: 18, xp: 8, score: 120 },
    boss: { hp: 5200, r: 40, speed: 38, dmg: 30, xp: 60, score: 3000, drawAs: 'entropy' },
  };
  const UPS = [
    ['dmg', '⚔', '攻击力', '伤害 +25%', 6], ['rate', '⏩', '攻速', '攻击间隔 -18%', 5], ['proj', '✳', '多重弹', '每次多射一发', 4], ['pierce', '➶', '穿透', '弹道多穿透 1 个敌人', 3],
    ['area', '◎', '范围', '冲击波与技能范围 +20%', 4], ['speed', '👟', '移速', '移动速度 +12%', 3], ['magnet', '🧲', '磁吸', '拾取范围 +45%', 3], ['hp', '❤', '耐久', '最大耐久 +25% 并回满', 3],
    ['crit', '✦', '暴击', '暴击率 +10%（2 倍伤害）', 4], ['orbit', '♪', '环绕音符', '多一颗绕身旋转的音符', 4], ['beat', '🥁', '节拍冲击', '每一拍自动放出冲击波', 4], ['skill', '⟳', '招牌技', '英雄招牌技冷却 -20%', 3], ['steal', '🩸', '吸血', '造成伤害的 2% 回复耐久', 3],
  ];
  const TITLES = [[10, '上头！'], [30, '停不下来！'], [60, '超神！'], [100, '封神！'], [200, '造物者！']];

  let S = null, raf = 0, last = 0, cv, ctx, beatSink = null;
  Q.start = function (heroId) {
    if (!CF.Stamina.spend({ quick: true })) return;
    if (heroId) { CF.Save.data.hero = heroId; CF.Heroes.applyTheme(heroId); }
    CF.UI.show('quick');
    Q.on = true;
    cv = $('#quickCanvas'); ctx = cv.getContext('2d');
    const h = CF.Heroes.current();
    const lvl = CF.City ? CF.City.level('hall') : 0;
    S = {
      h, t: 0, over: false, paused: false, score: 0, kills: 0, combo: 0, maxCombo: 0, comboT: 0, perfects: 0, fever: 0, feverT: 0, slow: 1, slowT: 0, stopT: 0, shake: 0,
      hero: { x: 1200, y: 1200, hp: 300, maxHp: 300, speed: 165, dmg: 14, rate: 0.42, cd: 0, proj: 1, pierce: 1, area: 1, magnet: 90, crit: 0.05, orbit: 0, beatLv: 0, skillCd: 5, skillT: 2, steal: 0, hitT: 0, face: 1, lv: 1, xp: 0, next: 4, ups: {} },
      ens: [], gems: [], shots: [], texts: [], parts: [], waves: [], spawnT: 0, eliteT: 20, bossDone: false, boss: null,
      multi: 0, multiT: 0, packT: 5, joy: null, lastBeat: 0, beatIv: 60 / (CF.Audio.curBpm || 110), pickPitch: 0, pickT: 0, tapCd: 0, lastTitle: 0, startT: performance.now(),
    };
    if (h.power) { S.hero.dmg *= h.power; S.hero.maxHp = S.hero.hp = Math.round(S.hero.maxHp * h.power); }
    if (h.companion) S.hero.drone = { x: 1170, y: 1160, cd: 0.5 };
    if (lvl) { S.hero.dmg *= 1 + lvl * 0.06; CF.toast(`音乐厅 Lv${lvl}：开局攻击 +${lvl * 6}%`, 'gold'); }
    beatSink = { pulse: (s) => { if (s < 0.5 || !S) return; const now = performance.now(); if (S.lastBeat) S.beatIv = CF.lerp(S.beatIv, CF.clamp((now - S.lastBeat) / 1000, 0.25, 1.2), 0.3); S.lastBeat = now; Q.onBeat(s); }, visible: () => false };
    CF.PixelFX.Stage.all.add(beatSink);
    Q.resize(); Q.hud();
    cancelAnimationFrame(raf); last = performance.now();
    const loop = (now) => { raf = requestAnimationFrame(loop); if (!Q.on) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!S.paused && !CF.modal.isOpen()) Q.update(dt); Q.render(); };
    raf = requestAnimationFrame(loop);
    CF.toast('拖动移动 · 踩着节拍点屏幕打出「完美」', 'gold', 3000);
  };
  Q._S = () => S; // 调试用
  Q.stop = function () { Q.on = false; cancelAnimationFrame(raf); if (beatSink) CF.PixelFX.Stage.all.delete(beatSink); beatSink = null; S = null; };
  Q.resize = function () { const dpr = Math.min(2, window.devicePixelRatio || 1); Q.dpr = dpr; Q.w = cv.clientWidth; Q.h = cv.clientHeight; cv.width = Q.w * dpr; cv.height = Q.h * dpr; };

  // ---------- 输入 ----------
  Q.bind = function () {
    const c = $('#quickCanvas');
    let down = null;
    const pt = (e) => { const r = CF.appRect(c), p = CF.appPoint(e.clientX, e.clientY); return { x: p.x - r.left, y: p.y - r.top }; };
    c.addEventListener('pointerdown', (e) => { if (!S) return; CF.Audio.unlock(); try { c.setPointerCapture(e.pointerId); } catch (er) {} const p = pt(e); down = { x: p.x, y: p.y, t: performance.now(), id: e.pointerId, moved: false }; S.joy = { ox: p.x, oy: p.y, dx: 0, dy: 0 }; });
    c.addEventListener('pointermove', (e) => { if (!S || !down || e.pointerId !== down.id) return; const p = pt(e); const dx = p.x - down.x, dy = p.y - down.y, d = Math.hypot(dx, dy); if (d > 12) down.moved = true; const k = Math.min(1, d / 60); S.joy = { ox: down.x, oy: down.y, dx: d ? (dx / d) * k : 0, dy: d ? (dy / d) * k : 0 }; });
    const up = (e) => { if (!S || !down || e.pointerId !== down.id) return; const tap = !down.moved && performance.now() - down.t < 220; down = null; S.joy = null; if (tap) Q.strum(); };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    const keys = new Set();
    window.addEventListener('keydown', (e) => { if (CF.UI.cur !== 'quick' || !S || CF.modal.isOpen()) return; const k = e.key.toLowerCase(); if (k === ' ') { Q.strum(); e.preventDefault(); } else if (k === 'e' || k === 'enter') Q.feverGo(); else if (k === 'escape' || k === 'p') Q.pause(); else { keys.add(k); Q.keys = keys; } });
    window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
    Q.keys = keys;
    $('#qFever').onclick = () => Q.feverGo();
    $('#qPause').onclick = () => Q.pause();
    window.addEventListener('resize', () => CF.UI.cur === 'quick' && Q.resize());
  };
  Q.pause = function () {
    if (!S) return; S.paused = true;
    CF.modal.open({ title: '暂停', body: `<p class="small muted">当前 ${S.score} 分 · ${CF.fmtTime(DUR - S.t)} 剩余</p>`, foot: [{ text: '退出', cls: 'ghost', onClick: () => { CF.modal.close(); CF.UI.show('lobby'); } }, { text: '继续', cls: 'primary', onClick: () => { CF.modal.close(); } }], onClose: () => { if (S) S.paused = false; } });
  };

  // ---------- 节拍：踩拍判定 ----------
  Q.onBeat = function (s) {
    const H = S.hero;
    S.waves.push({ t: 0, x: H.x, y: H.y, s });
    if (H.beatLv) Q.nova(H.x, H.y, 90 * H.area * (1 + H.beatLv * 0.15), H.dmg * (0.8 + H.beatLv * 0.4), S.h.pal.glow, false);
    if (S.feverT > 0) { Q.nova(H.x, H.y, 200 * H.area, H.dmg * 3, S.h.pal.accent, true); CF.Audio.lick(S.h.id, true); }
  };
  Q.strum = function () {
    if (!S || S.over || S.tapCd > 0) return;
    S.tapCd = 0.22;
    const now = performance.now(), iv = S.beatIv * 1000, off = Math.min(Math.abs(now - S.lastBeat), Math.abs(S.lastBeat + iv - now));
    const H = S.hero, perfect = off < 130;
    if (perfect) { S.perfects++; S.combo += 3; Q.flash(S.h.pal.accent, 0.18); Q.buzz(8); Q.nova(H.x, H.y, 190 * H.area, H.dmg * 3.2, S.h.pal.accent, true); Q.text(H.x, H.y - 46, 'PERFECT', '#ffe08a', 22); S.shake = 0.18; CF.Audio.lick(S.h.id, true); S.fever = Math.min(100, S.fever + 4); }
    else { Q.nova(H.x, H.y, 110 * H.area, H.dmg * 1.2, S.h.pal.glow, false); Q.text(H.x, H.y - 40, 'GOOD', '#ffffffcc', 14); CF.Audio.sfx('chord', 0.4); }
  };
  Q.feverGo = function () {
    if (!S || S.fever < 100 || S.feverT > 0) return;
    S.fever = 0; S.feverT = 6; S.slow = 0.35; S.slowT = 0.5; S.shake = 0.4;
    CF.Audio.sfx('riff'); Q.text(S.hero.x, S.hero.y - 70, 'FEVER!!', S.h.pal.accent, 34);
    Q.nova(S.hero.x, S.hero.y, 320, S.hero.dmg * 6, S.h.pal.accent, true);
  };
  Q.nova = function (x, y, r, dmg, c, big) {
    S.parts.push({ k: 'ring', x, y, r: 0, max: r, t: 0, c, big });
    for (const e of S.ens) { if (e.dead) continue; const d = CF.dist(e.x, e.y, x, y); if (d < r + e.r) { Q.hit(e, dmg, big); if (!e.boss) { const a = Math.atan2(e.y - y, e.x - x); e.x += Math.cos(a) * (big ? 40 : 18); e.y += Math.sin(a) * (big ? 40 : 18); } } }
  };
  // 反馈工具：闪屏（边缘光）、手机震动、升级冲击
  Q.flash = function (c, a) { if (!S || CF.Save.data.settings.reduceMotion) return; S.flashC = c; S.flashA = Math.max(S.flashA || 0, a); };
  Q.buzz = function (ms) { try { if (navigator.vibrate && !CF.Save.data.settings.reduceMotion) navigator.vibrate(ms); } catch (e) { /* 不支持 */ } };
  Q.levelBurst = function () { const H = S.hero; Q.nova(H.x, H.y, 230 * H.area, H.dmg * 2.5, '#ffffff', true); Q.text(H.x, H.y - 64, `LEVEL ${H.lv}`, '#ffe08a', 26); H.hitT = Math.max(H.hitT, 1); Q.flash('#ffe08a', 0.3); Q.buzz(20); };
  Q.text = function (x, y, txt, c, size = 14) { S.texts.push({ x, y, txt, c, size, t: 0 }); if (S.texts.length > 60) S.texts.shift(); };
  Q.hit = function (e, dmg, big) {
    const H = S.hero, crit = Math.random() < H.crit;
    if (crit) dmg *= 2;
    if (S.feverT > 0) dmg *= 2;
    e.hp -= dmg; e.hit = 0.08;
    if (H.steal) H.hp = Math.min(H.maxHp, H.hp + dmg * H.steal);
    if (crit || big || Math.random() < 0.3) Q.text(e.x + CF.rand(-8, 8), e.y - e.r, Math.round(dmg), crit ? '#fff35c' : '#ffffff', crit ? 18 : 12);
    if (crit && !S.stopT) S.stopT = 0.04;
    if (e.hp <= 0 && !e.dead) Q.kill(e);
  };
  Q.kill = function (e) {
    const H = S.hero, T = ETYPE[e.type];
    e.dead = true; S.kills++; S.combo++; S.comboT = 2; S.maxCombo = Math.max(S.maxCombo, S.combo);
    S.score += Math.round(T.score * (1 + S.combo / 25) * (e.elite ? 4 : 1));
    S.fever = Math.min(100, S.fever + (e.elite ? 14 : 2.4));
    // 经验：连击越高掉得越多（每 20 连击 +50%）
    const xk = 1 + Math.min(2, S.combo / 40);
    for (let i = 0; i < (e.elite || e.boss ? 10 : 1); i++) S.gems.push({ x: e.x + CF.rand(-10, 10), y: e.y + CF.rand(-10, 10), v: (e.boss ? 12 : e.elite ? 4 : T.xp * 1.3) * xk });
    // 多杀：0.6 秒内连续击杀
    S.multi = S.multiT > 0 ? S.multi + 1 : 1; S.multiT = 0.6;
    if (S.multi >= 5 && S.multi % 5 === 0) { const MK = { 5: '五连破！', 10: '十连破！！', 15: '清屏！！！', 20: '无双！！！' }; Q.text(H.x, H.y - 120, MK[Math.min(20, S.multi)] || `${S.multi} 连破！`, '#ffe08a', 24 + Math.min(16, S.multi)); S.shake = Math.max(S.shake, 0.2); Q.flash(S.h.pal.accent, 0.25); Q.buzz(12); CF.Audio.sfx('levelup', 0.35); }
    for (let i = 0; i < (e.boss ? 40 : 8); i++) { const a = Math.random() * TAU, sp = CF.rand(60, e.boss ? 320 : 180); S.parts.push({ k: 'px', x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: CF.rand(0.3, 0.7), c: Math.random() < 0.5 ? '#ff4f9a' : '#29e0e0' }); }
    if (S.kills % 3 === 0) CF.Audio.sfx('boom', 0.25);
    const ti = TITLES.filter(([n]) => S.combo >= n).pop();
    if (ti && ti[0] > S.lastTitle) { S.lastTitle = ti[0]; Q.text(H.x, H.y - 80, ti[1], S.h.pal.accent, 30); CF.Audio.sfx('levelup', 0.6); S.shake = 0.25; }
    if (e.boss) { S.slow = 0.25; S.slowT = 0.9; S.shake = 0.7; S.score += 5000; Q.text(H.x, H.y - 100, '首领击破！', '#ffe08a', 36); CF.Audio.sfx('win'); S.boss = null; Q.flash('#ffffff', 0.6); Q.buzz([40, 30, 80]); }
    if (e.elite) { S.stopT = 0.1; Q.flash('#ffd34d', 0.35); Q.buzz(30); Q.levelUp(); }
    if (e.type === 'titan' && !e.elite) { S.stopT = Math.max(S.stopT, 0.05); S.shake = Math.max(S.shake, 0.22); }
  };

  // ---------- 升级三选一 ----------
  Q.levelUp = function () {
    const H = S.hero;
    if (CF.modal.isOpen()) { S.pendingUp = (S.pendingUp || 0) + 1; return; }
    H.lv++; H.xp = Math.max(0, H.xp - H.next); H.next = Math.round(H.next * 1.25 + 3);
    Q.levelBurst();
    CF.Audio.sfx('levelup');
    const pool = CF.shuffle(UPS.filter(([id, , , , max]) => (H.ups[id] || 0) < max)).slice(0, 3);
    if (!pool.length) return;
    const body = CF.h(`<div><p class="small muted" style="text-align:center;margin-bottom:10px">Lv ${H.lv} · 选一个强化</p><div class="cards3"></div></div>`);
    pool.forEach(([id, ic, n, d], i) => {
      const b = CF.h(`<button class="upc" style="animation-delay:${i * 60}ms"><div class="ic">${ic}</div><h4>${n}</h4><p>${d}</p><div class="lv">Lv ${(H.ups[id] || 0) + 1}</div></button>`);
      b.onclick = () => { Q.apply(id); CF.modal.close(); CF.Audio.sfx('unlock'); if (S && S.pendingUp > 0) { S.pendingUp--; setTimeout(() => S && Q.levelUp(), 80); } };
      body.querySelector('.cards3').appendChild(b);
    });
    CF.modal.open({ title: '⬆ 升级！', body, closable: false });
  };
  Q.apply = function (id) {
    const H = S.hero; H.ups[id] = (H.ups[id] || 0) + 1;
    switch (id) {
      case 'dmg': H.dmg *= 1.25; break; case 'rate': H.rate *= 0.82; break; case 'proj': H.proj++; break; case 'pierce': H.pierce++; break;
      case 'area': H.area *= 1.2; break; case 'speed': H.speed *= 1.12; break; case 'magnet': H.magnet *= 1.45; break; case 'hp': H.maxHp *= 1.25; H.hp = H.maxHp; break;
      case 'crit': H.crit += 0.1; break; case 'orbit': H.orbit++; break; case 'beat': H.beatLv++; break; case 'skill': H.skillCd *= 0.8; break; case 'steal': H.steal += 0.02; break;
    }
  };

  // ---------- 招牌技（每位英雄不同） ----------
  function signature() {
    const H = S.hero, P = S.h.pal, id = S.h.id;

    S.over = true; Q._last = { score: S.score, kills: S.kills, lv: S.hero.lv, combo: S.maxCombo, perfects: S.perfects, t: Math.round(S.t), hp: Math.round(S.hero.hp) };
    const d = CF.Save.data, H = S.hero;
    if (survived) S.score += Math.round(H.hp) * 10;
    const sc = Math.round(S.score), rank = sc >= 250000 ? 'S' : sc >= 150000 ? 'A' : sc >= 70000 ? 'B' : 'C';
    const best = sc > (d.quick.best || 0);
    d.quick.runs++; if (best) { d.quick.best = sc; d.quick.bestRank = rank; }
    d.stats.kills += S.kills; CF.Save.save();
    const reward = CF.City ? CF.City.add({ chip: Math.round(sc / 60), corp: Math.round(sc / 120), comp: Math.round(S.perfects * 2) }) : null;
    CF.Audio.sfx(survived ? 'win' : 'lose');
    const body = CF.h(`<div style="text-align:center"><div class="rank-big">${rank}</div><div class="t-h2" style="margin-top:6px">${sc.toLocaleString()} 分 ${best ? '<span class="pill warn">新纪录！</span>' : ''}</div><p class="small muted" style="margin-top:4px">${survived ? '撑满 90 秒！' : '英雄倒下了'} · 击杀 ${S.kills} · 最高连击 ${S.maxCombo} · 完美 ${S.perfects} · Lv ${H.lv}</p>${reward ? `<p class="small" style="margin-top:8px">🏰 主城入账 <span class="c-chip">+${reward.chip}</span> <span class="c-corp">+${reward.corp}</span> <span class="c-comp">+${reward.comp}</span></p>` : ''}<div class="explain" style="text-align:left;margin-top:12px">📚 <b>知识闪卡</b>：答对 1 道题，本局分数 ×1.2，还能拿知识经验。<button class="btn sm" id="qQuiz" style="margin-left:6px">来一题</button></div></div>`);
    CF.modal.open({ title: survived ? '⚡ 爽局结束' : '⚡ 再来一局？', body, closable: false, foot: [{ text: '返回大厅', cls: 'ghost', onClick: () => { CF.modal.close(); CF.UI.show('lobby'); } }, { text: '换英雄', onClick: () => { CF.modal.close(); CF.UI.show('heroes'); } }, { text: '再来一局 ▶', cls: 'primary', onClick: () => { CF.modal.close(); Q.start(); } }] });
    body.querySelector('#qQuiz').onclick = () => {
      CF.Academy.quiz({ n: 1, title: '📚 知识闪卡', onDone: (r) => { if (r) { const add = Math.round(sc * 0.2); d.quick.best = Math.max(d.quick.best, sc + add); CF.Save.save(); CF.toast(`答对了！分数 +${add}`, 'gold'); } else CF.toast('没关系，讲解看懂了就是收获'); setTimeout(() => CF.UI.show('lobby'), 200); } });
    };
  };
})();

</script>
<script>
/* js/city.js */
/* 主城 → 电路工坊（v1）：从高中电路图衔接到大学电路的「学习 + 轻养成」
 * - 10 个电路实验：高中（闭合回路、开关、串并联、伏安法）→ 衔接（分压、LED 限流）→ 大学（基尔霍夫、惠斯通电桥、RC 充电）。
 * - 操作沿用沉浸模式的拖拽放置：从下方元件盒按住元件拖到电路板的「边」上（两个接线点之间），松手放下；
 *   点元件可以开关 / 换阻值 / 翻转极性 / 拿走；已经放好的元件可以再拖到别处。
 * - 电路是真的在算：节点电压法 + 牛顿式迭代（二极管）+ 后向欧拉（电容），所以接错了灯就是不亮。
 * - 轻养成：每完成一个实验，电网多一台发电机组，按真实时间产出晶片 / 语料 / 算力；收藏的发电厂再加成。
 * - 对外接口保持不变（storage / add / reward / bonus / level / enter / leave / bind），征程奖励与商城照常使用仓库。 */
(function () {
  const CF = window.CF;
  const $ = CF.$;
  const COLS = 7, ROWS = 5, GW = 1e4, HOUR = 3600 * 1000;
  const C = (CF.City = {});

  // ================= 数据（仓库沿用旧主城的 res，旧存档资源不丢） =================
  function data() {
    const d = CF.Save.data;
    if (!d.city) d.city = { res: { chip: 600, corp: 400, comp: 60 } };
    const c = d.city;
    if (!c.res) c.res = { chip: 600, corp: 400, comp: 60 };
    if (!c.cw) c.cw = { solved: {}, last: Date.now(), stock: { chip: 0, corp: 0, comp: 0 }, sandbox: [] };
    return c;
  }
  const solvedN = () => Object.keys(data().cw.solved).length;
  C.storage = () => data().res;
  C.cap = () => 8000 + solvedN() * 1500;
  C.add = function (r) {
    const c = data(), cap = C.cap(), out = {};
    for (const k in r) { const before = c.res[k] || 0; c.res[k] = Math.min(cap, before + Math.max(0, Math.round(r[k]))); out[k] = c.res[k] - before; }
    CF.Save.save(); return out;
  };
  C.reward = function (win, stars, L) {
    if (!win) return C.add({ chip: 60, corp: 30, comp: 0 });
    const k = L.immersive ? 2.5 : L.skirmish ? 1.5 : 1;
    return C.add({ chip: (150 + stars * 120) * k, corp: (90 + stars * 70) * k, comp: (15 + stars * 15) * k });
  };
  // 电路学得越多，战场越强（学习 → 战力）
  C.bonus = function () { const n = solvedN(); return { atkMul: 1 + n * 0.02, bldMul: 1 + n * 0.02, heroMul: 1 + n * 0.015, extraCoders: n >= 5 ? 1 : 0, startChip: n * 20, solved: n }; };
  C.level = (type) => (type === 'hall' ? Math.floor(solvedN() / 3) : 0);

  // ================= 电网（轻养成） =================
  const plantMul = () => 1 + (CF.Collect && CF.Collect.owns('plant_thermal') ? 0.2 : 0) + (CF.Collect && CF.Collect.owns('plant_nuclear') ? 0.4 : 0);
  C.rate = () => { const n = solvedN(), m = plantMul(); return { chip: Math.round(30 * n * m), corp: Math.round(18 * n * m), comp: Math.round(5 * n * m) }; }; // 每小时
  C.tick = function () {
    const cw = data().cw, now = Date.now(), dt = Math.min(12 * HOUR, now - cw.last), r = C.rate();
    if (dt > 0) { for (const k in r) cw.stock[k] = Math.min(r[k] * 12, (cw.stock[k] || 0) + (r[k] * dt) / HOUR); cw.last = now; }
  };
  C.collect = function () { C.tick(); const cw = data().cw, got = C.add({ chip: cw.stock.chip, corp: cw.stock.corp, comp: cw.stock.comp }); cw.stock = { chip: 0, corp: 0, comp: 0 }; CF.Save.save(); CF.Audio.sfx('unlock'); CF.toast(`电网收取：晶片 +${got.chip} · 语料 +${got.corp} · 算力 +${got.comp}`, 'gold'); C.renderTop(); };
  C.boost = function () {
    const d = CF.Save.data;
    if (!(d.boosts > 0)) return CF.modal.open({ title: '⚡ 学习加速', body: '<p style="line-height:1.8">每获得 30 点学习经验（答题、实验、线下任务、情景决策、电路实验）就会得到 1 次「学习加速」，每次立即领取电网 1 小时的产出。</p>', foot: [{ text: '去学院', cls: 'primary', onClick: () => { CF.modal.close(); CF.UI.show('academy'); } }] });
    d.boosts--; const r = C.rate(); const got = C.add(r); CF.Save.save(); CF.Audio.sfx('unlock'); CF.toast(`学习加速：领取 1 小时电网产出（晶片 +${got.chip}）`, 'gold'); C.renderTop();
  };

  // ================= 元件与求解器 =================
  const PARTS = {
    wire: { name: '导线', ic: '—' },
    battery: { name: '电池', ic: '⊣⊢', vals: [1.5, 3, 4.5, 6, 9], unit: 'V', polar: true },
    bulb: { name: '小灯泡', ic: '⊗', R: 10 },
    resistor: { name: '电阻', ic: '▭', vals: [10, 20, 50, 100, 200, 330, 500, 1000, 2000], unit: 'Ω' },
    switch: { name: '开关', ic: '⌐' },
    ammeter: { name: '电流表', ic: 'Ⓐ', R: 0.01 },
    voltmeter: { name: '电压表', ic: 'Ⓥ' },
    led: { name: '发光二极管', ic: '▷|', polar: true, Vf: 2, rd: 10, Imax: 0.02 },
    cap: { name: '电容', ic: '||', vals: [0.0005, 0.001, 0.002], unit: 'F' },
  };
  const node = (c, r) => r * COLS + c;
  const ends = (e) => { const [k, c, r] = e.split(','); const ci = +c, ri = +r; return k === 'h' ? [node(ci, ri), node(ci + 1, ri)] : [node(ci, ri), node(ci, ri + 1)]; };
  // 解线性方程组（高斯消元，部分主元）
  function gauss(A, b) {
    const n = b.length;
    for (let i = 0; i < n; i++) {
      let p = i; for (let k = i + 1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[p][i])) p = k;
      [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
      const d = A[i][i] || 1e-12;
      for (let k = i + 1; k < n; k++) { const f = A[k][i] / d; if (!f) continue; for (let j = i; j < n; j++) A[k][j] -= f * A[i][j]; b[k] -= f * b[i]; }
    }
    const x = new Float64Array(n);
    for (let i = n - 1; i >= 0; i--) { let s = b[i]; for (let j = i + 1; j < n; j++) s -= A[i][j] * x[j]; x[i] = s / (A[i][i] || 1e-12); }
    return x;
  }
  // 节点电压法：所有元件都化成「电导 + 电流源」（电池 = 诺顿等效，电容 = 后向欧拉伴随模型，二极管 = 分段线性）
  function solve(parts, dt = 0.02) {
    const N = COLS * ROWS, bat = parts.find((p) => p.type === 'battery');
    const ref = bat ? ends(bat.e)[bat.flip ? 0 : 1] : 0; // 电池负极接地
    parts.forEach((p) => { if (p.type === 'led' && p.dOn === undefined) p.dOn = false; });
    let v = null;
    for (let it = 0; it < 10; it++) {
      const G = Array.from({ length: N }, () => new Float64Array(N)), I = new Float64Array(N);
      const g2 = (a, b, g) => { G[a][a] += g; G[b][b] += g; G[a][b] -= g; G[b][a] -= g; };
      for (const p of parts) {
        const [a, b] = ends(p.e), pos = p.flip ? b : a, neg = p.flip ? a : b;
        switch (p.type) {
          case 'wire': g2(a, b, GW); break;
          case 'resistor': g2(a, b, 1 / p.val); break;
          case 'bulb': g2(a, b, 1 / PARTS.bulb.R); break;
          case 'ammeter': g2(a, b, 1 / PARTS.ammeter.R); break;
          case 'voltmeter': g2(a, b, 1e-7); break;
          case 'switch': g2(a, b, p.on ? GW : 1e-9); break;
          case 'battery': { const g = 1 / 0.05; g2(pos, neg, g); I[pos] += p.val * g; I[neg] -= p.val * g; break; }
          case 'led': { if (p.burnt) { g2(a, b, 1e-9); break; } if (p.dOn) { const g = 1 / PARTS.led.rd; g2(pos, neg, g); I[pos] += PARTS.led.Vf * g; I[neg] -= PARTS.led.Vf * g; } else g2(pos, neg, 1e-9); break; }
          case 'cap': { const g = p.val / dt, vp = p.vc || 0; g2(a, b, g); I[a] += g * vp; I[b] -= g * vp; break; }
        }
      }
      for (let i = 0; i < N; i++) G[i][i] += 1e-9;
      G[ref].fill(0); G[ref][ref] = 1; I[ref] = 0;
      v = gauss(G, I);
      // 二极管状态迭代
      let changed = false;
      for (const p of parts) if (p.type === 'led' && !p.burnt) { const [a, b] = ends(p.e), vd = p.flip ? v[b] - v[a] : v[a] - v[b]; const want = p.dOn ? (vd - PARTS.led.Vf) / PARTS.led.rd > 0 : vd > PARTS.led.Vf; if (want !== p.dOn) { p.dOn = want; changed = true; } }
      if (!changed) break;
    }
    // 每个元件的电流（a → b 为正）与两端电压
    let short = false;
    for (const p of parts) {
      const [a, b] = ends(p.e), vab = v[a] - v[b];
      p.V = vab;
      switch (p.type) {
        case 'wire': p.I = vab * GW; break;
        case 'resistor': p.I = vab / p.val; break;
        case 'bulb': p.I = vab / PARTS.bulb.R; break;
        case 'ammeter': p.I = vab / PARTS.ammeter.R; break;
        case 'voltmeter': p.I = vab * 1e-7; break;
        case 'switch': p.I = vab * (p.on ? GW : 1e-9); break;
        case 'battery': { const vt = p.flip ? -vab : vab; p.I = (p.val - vt) / 0.05; if (p.I > 8) short = true; break; }
        case 'led': { const vd = p.flip ? -vab : vab; p.I = p.dOn && !p.burnt ? (vd - PARTS.led.Vf) / PARTS.led.rd : 0; break; }
        case 'cap': { const g = p.val / dt; p.I = g * (vab - (p.vc || 0)); p.vcNext = vab; break; }
      }
    }
    return { v, short };
  }
  C.solve = solve; C.PARTS = PARTS;

  // ================= 实验 =================
  const V = (e, type, o = {}) => Object.assign({ e, type, fixed: true }, o);
  const isLit = (p) => p.type === 'bulb' && Math.abs(p.I) > 0.08;
  const series = (ps) => ps.length > 1 && ps.every((p) => Math.abs(Math.abs(p.I) - Math.abs(ps[0].I)) < 0.002 && Math.abs(p.I) > 0.01);
  const RAILS = ['h,0,1', 'h,0,3', 'v,0,2', 'h,1,1', 'h,2,1', 'h,3,1', 'h,1,3', 'h,2,3', 'h,3,3'];
  const LABS = [
    { id: 'k1', lv: '高中', title: '点亮第一盏灯', goal: '用导线把电池和小灯泡连成闭合回路，让灯泡亮起来。', fixed: [V('v,1,1', 'battery', { val: 3 }), V('v,5,1', 'bulb')], pal: { wire: 10 },
      know: '电流只有在闭合回路中才能持续流动；电源提供电压，用电器消耗电能。', bridge: '电流 I = dq/dt：单位时间通过导体横截面的电荷量。「闭合回路」就是给电荷一条从电源正极出发、回到负极的路径。',
      hint: '电池长的那片是正极。从电池上端出发，沿上面一排接线点连到灯泡上端，再从灯泡下端沿下面一排回到电池下端。', check: (P) => P.some(isLit) },
    { id: 'k2', lv: '高中', title: '开关控制', goal: '在回路里接一个开关：开关断开灯灭，闭合灯亮。', fixed: [V('v,1,1', 'battery', { val: 3 }), V('v,5,1', 'bulb')], pal: { wire: 10, switch: 1 },
      know: '开关串联在电路中，控制整条回路的通断。', bridge: '开关断开时电阻近似无穷大，回路电流为零——这就是数字电路里「0 / 1」的物理基础。',
      hint: '把开关当作一段导线串进回路里；点开关可以切换断开 / 闭合。', check: (P, T) => T((ps) => ps.filter((p) => p.type === 'switch').forEach((s) => (s.on = true)), (Q) => Q.some(isLit)) && T((ps) => ps.filter((p) => p.type === 'switch').forEach((s) => (s.on = false)), (Q) => !Q.some(isLit)) },
    { id: 'k3', lv: '高中', title: '串联：电流处处相等', goal: '把两个小灯泡和一个电流表串联起来，让两个灯都亮。', fixed: [V('v,1,1', 'battery', { val: 6 })], pal: { wire: 10, bulb: 2, ammeter: 1 },
      know: '串联电路电流处处相等；总电压等于各部分电压之和：U = U₁ + U₂。两个灯分电压，所以每个都比单独接时暗。', bridge: '这就是基尔霍夫电压定律（KVL）：沿任意闭合回路，各段电压的代数和为零，ΣU = 0。',
      hint: '电池 → 灯泡 → 灯泡 → 电流表 → 回到电池，排成一个圈。', check: (P) => { const b = P.filter((p) => p.type === 'bulb'), a = P.filter((p) => p.type === 'ammeter'); return b.length === 2 && b.every(isLit) && a.length === 1 && series(b.concat(a)); } },
    { id: 'k4', lv: '高中', title: '并联：互不影响', goal: '两个小灯泡并联，每条支路各有一个开关：关掉任意一个，另一个照样亮。', fixed: [V('v,1,1', 'battery', { val: 3 }), V('h,1,1', 'wire'), V('h,1,2', 'wire')], pal: { wire: 12, bulb: 2, switch: 2 },
      know: '并联电路各支路电压相等、互不影响；干路电流等于各支路电流之和。家里的电灯就是并联的。', bridge: '并联总电阻 1/R = 1/R₁ + 1/R₂，比任何一个支路的电阻都小——所以插座上同时开的电器越多，总电流越大。',
      hint: '在电池右边做出上下两条「轨道」，在轨道之间竖着接两条支路，每条支路里放一个灯泡和一个开关。',
      check: (P, T) => { const S = P.filter((p) => p.type === 'switch'), B = P.filter((p) => p.type === 'bulb'); if (S.length !== 2 || B.length !== 2) return false; const all = T((ps) => ps.forEach((p) => p.type === 'switch' && (p.on = true)), (Q) => Q.filter(isLit).length === 2); const solo = [0, 1].every((k) => T((ps) => { let i = 0; ps.forEach((p) => { if (p.type === 'switch') p.on = i++ !== k; }); }, (Q) => Q.filter(isLit).length === 1)); return all && solo; } },
    { id: 'k5', lv: '高中', title: '伏安法测电阻', goal: '用电流表测通过 Rₓ 的电流、电压表测 Rₓ 两端的电压，再算出 Rₓ。', fixed: [V('v,1,1', 'battery', { val: 3 }), V('h,3,1', 'resistor', { val: 20, hidden: true, label: 'Rₓ' })], pal: { wire: 10, ammeter: 1, voltmeter: 1 },
      know: '电流表要串联、电压表要并联；R = U / I。', bridge: '真实电表有内阻：电流表内接 / 外接会带来系统误差，大学物理实验要先估算 Rₓ 与电表内阻的大小关系再选接法。',
      hint: '先用导线和电流表把电池、Rₓ 连成回路；再把电压表跨接在 Rₓ 的两端（可以用导线把电压表引到 Rₓ 两边）。',
      check: (P) => { const R = P.find((p) => p.label === 'Rₓ'), A = P.find((p) => p.type === 'ammeter'), Vm = P.find((p) => p.type === 'voltmeter'); return A && Vm && Math.abs(R.I) > 0.02 && Math.abs(Math.abs(A.I) - Math.abs(R.I)) < 0.002 && Math.abs(Math.abs(Vm.V) - Math.abs(R.V)) < 0.05; },
      quiz: { q: '根据电表读数，Rₓ 是多少？', opts: ['10 Ω', '20 Ω', '50 Ω', '100 Ω'], a: 1 } },
    { id: 'k6', lv: '衔接', title: '分压电路', goal: '用两个电阻把 6 V 分出 2 V：电压表并在下面那个电阻两端，读数 2.0 V（±0.1 V）。', fixed: [V('v,1,1', 'battery', { val: 6 })], pal: { wire: 10, resistor: 2, voltmeter: 1 },
      know: '串联电阻按阻值比例分压：U₂ = U · R₂ / (R₁ + R₂)。', bridge: '这就是传感器电路、电位器调光调音的原理；大学电路里会把它推广成「戴维南等效电路」。',
      hint: '要分出 1/3 的电压，R₁ 应该是 R₂ 的 2 倍。点电阻可以换阻值。', check: (P) => { const Vm = P.find((p) => p.type === 'voltmeter'); return Vm && Math.abs(Math.abs(Vm.V) - 2) <= 0.1 && P.filter((p) => p.type === 'resistor' && Math.abs(p.I) > 0.001).length === 2; } },
    { id: 'k7', lv: '衔接', title: 'LED 限流电阻', goal: '给发光二极管串一个合适的电阻：让它亮，电流在 8–20 mA 之间（超过 30 mA 会烧坏）。', fixed: [V('v,1,1', 'battery', { val: 6 }), V('v,5,1', 'led')], pal: { wire: 10, resistor: 1, ammeter: 1 },
      know: '欧姆定律 I = U / R：电阻越大电流越小。', bridge: '二极管是「非线性」元件：正向电压低于约 2 V 几乎不导通，超过后电流猛增。所以要串电阻限流：R = (U − U_F) / I = (6 − 2) / 0.02 = 200 Ω。',
      hint: '先算再放：允许的最大电流 20 mA，LED 自己分走约 2 V。', check: (P) => { const L = P.find((p) => p.type === 'led'); return L && !L.burnt && L.I >= 0.008 && L.I <= 0.0205; } },

    x.strokeStyle = '#19f0e0'; x.lineWidth = 2; x.beginPath(); chart.forEach(([t, v], i) => { const X = 24 + (t / 3) * (w - 30), Y = 6 + (h - 24) * (1 - v / 6); i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.stroke(); x.lineWidth = 1;
  };
  // 画电路板与元件（国标符号的像素风简化）
  C.render = function () {
    if (!cv || !cur) return;
    const w = cv.clientWidth, h = cv.clientHeight, g = geo(), t = performance.now() / 1000, beat = CF.PixelFX.beat(), hp = CF.Heroes.current().pal;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#0b1424'; ctx.fillRect(0, 0, w, h);
    // 背景网格（像素脉冲随节拍）
    ctx.fillStyle = `rgba(${hp.grid.join(',')},${0.05 + beat * 0.05})`; for (let y = 0; y < h; y += 24) for (let x = 0; x < w; x += 24) ctx.fillRect(x, y, 1, 1);
    // 空边（可放位置）
    const hl = drag && drag.edge;
    allEdges().forEach((e) => { const [a, b] = ends(e).map(nodeXY); ctx.strokeStyle = e === hl ? (drag.ok ? '#6fdc8c' : '#ff5d6c') : '#ffffff10'; ctx.lineWidth = e === hl ? 4 : 2; ctx.setLineDash(e === hl ? [] : [3, 5]); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); });
    ctx.setLineDash([]); ctx.lineWidth = 1;
    if (cur.lab.slot && !cur.parts.some((p) => p.e === cur.lab.slot)) { const [mx, my] = edgeMid(cur.lab.slot); ctx.strokeStyle = `rgba(255,177,74,${0.5 + beat * 0.5})`; ctx.strokeRect(mx - 14, my - 22, 28, 44); ctx.fillStyle = '#ffb14a'; ctx.font = '11px sans-serif'; ctx.fillText('R₃ ?', mx + 16, my); }
    cur.parts.forEach((p) => drawPart(p, g.s, t));
    // 节点
    for (let n = 0; n < COLS * ROWS; n++) { const [x, y] = nodeXY(n); ctx.fillStyle = '#c9d4ff'; ctx.fillRect(x - 3, y - 3, 6, 6); }
    // 拖拽中的虚影
    if (drag) { const pos = drag.edge ? edgeMid(drag.edge) : [drag.lx, drag.ly]; ctx.globalAlpha = 0.75; drawPart({ type: drag.type, e: drag.edge || 'h,0,0', val: drag.val, ghost: true, at: drag.edge ? null : pos, I: 0 }, g.s, t); ctx.globalAlpha = 1; }
    if (cur.short) { ctx.fillStyle = `rgba(255,93,108,${0.08 + 0.06 * Math.sin(t * 10)})`; ctx.fillRect(0, 0, w, h); }
  };
  function drawPart(p, s, t) {
    let [a, b] = ends(p.e).map(nodeXY);
    if (p.at) { const half = s / 2; a = [p.at[0] - half, p.at[1]]; b = [p.at[0] + half, p.at[1]]; }
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, ang = Math.atan2(b[1] - a[1], b[0] - a[0]), L = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.min(1, s / 80);
    ctx.save(); ctx.translate(mx, my); ctx.rotate(ang);
    const line = (x1, x2, c = '#ede6d6', w = 3) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, 0); ctx.lineTo(x2, 0); ctx.stroke(); };
    const lead = (half) => { line(-L / 2, -half); line(half, L / 2); };
    const I = Math.abs(p.I || 0);
    switch (p.type) {
      case 'wire': line(-L / 2, L / 2, I > 0.001 ? '#ffe9a8' : '#ede6d6'); break;
      case 'battery': { lead(8 * k); const pl = p.flip ? 1 : -1; ctx.fillStyle = '#ede6d6'; ctx.fillRect(pl * 6 * k - 1.5, -16 * k, 3, 32 * k); ctx.fillRect(-pl * 6 * k - 2.5, -9 * k, 5, 18 * k); ctx.fillStyle = '#ffb14a'; ctx.font = `${11}px sans-serif`; ctx.rotate(-ang); ctx.fillText(`${p.val}V`, 10, -14); break; }
      case 'resistor': { lead(16 * k); ctx.strokeStyle = '#ede6d6'; ctx.lineWidth = 2.5; ctx.strokeRect(-16 * k, -7 * k, 32 * k, 14 * k); ctx.rotate(-ang); ctx.fillStyle = '#9fe8ff'; ctx.font = '11px sans-serif'; ctx.fillText(p.label ? p.label + (p.hidden ? '' : '=' + fmtVal(p)) : fmtVal(p), 10, -12); break; }
      case 'bulb': { lead(12 * k); const pw = Math.min(1, (I * I * 10) / 0.5); if (pw > 0.02) { const gr = ctx.createRadialGradient(0, 0, 2, 0, 0, 34 * k); gr.addColorStop(0, `rgba(255,236,150,${0.9 * pw})`); gr.addColorStop(1, 'rgba(255,236,150,0)'); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, 34 * k, 0, Math.PI * 2); ctx.fill(); } ctx.strokeStyle = '#ede6d6'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 12 * k, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-8 * k, -8 * k); ctx.lineTo(8 * k, 8 * k); ctx.moveTo(8 * k, -8 * k); ctx.lineTo(-8 * k, 8 * k); ctx.stroke(); break; }
      case 'switch': { lead(14 * k); ctx.fillStyle = '#ede6d6'; ctx.fillRect(-14 * k - 2, -2, 4, 4); ctx.fillRect(14 * k - 2, -2, 4, 4); ctx.strokeStyle = p.on ? '#6fdc8c' : '#ffb14a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-14 * k, 0); ctx.lineTo(14 * k, p.on ? 0 : -14 * k); ctx.stroke(); break; }
      case 'ammeter': case 'voltmeter': { lead(13 * k); ctx.fillStyle = '#0b1424'; ctx.beginPath(); ctx.arc(0, 0, 13 * k, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = p.type === 'ammeter' ? '#ffb14a' : '#19f0e0'; ctx.lineWidth = 2.5; ctx.stroke(); ctx.rotate(-ang); ctx.fillStyle = ctx.strokeStyle; ctx.font = `bold ${Math.round(13 * k)}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText(p.label === 'G' ? 'G' : p.type === 'ammeter' ? 'A' : 'V', 0, 4.5 * k); ctx.font = '11px ui-monospace,monospace'; ctx.fillText(p.type === 'ammeter' ? fmtI(p.I || 0) : Math.abs(p.V || 0).toFixed(2) + 'V', 0, -18 * k); ctx.textAlign = 'left'; break; }
      case 'led': { lead(10 * k); const on = I > 0.001 && !p.burnt, dir = p.flip ? -1 : 1; if (on) { ctx.fillStyle = `rgba(255,90,120,${Math.min(0.9, I * 50)})`; ctx.beginPath(); ctx.arc(0, 0, 26 * k, 0, Math.PI * 2); ctx.fill(); } ctx.fillStyle = p.burnt ? '#555' : on ? '#ff5a78' : '#a04050'; ctx.beginPath(); ctx.moveTo(-10 * k * dir, -10 * k); ctx.lineTo(10 * k * dir, 0); ctx.lineTo(-10 * k * dir, 10 * k); ctx.closePath(); ctx.fill(); ctx.fillRect(10 * k * dir - (dir > 0 ? 0 : 3), -10 * k, 3, 20 * k); if (p.burnt) { ctx.strokeStyle = '#ff5d6c'; ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.moveTo(8, -8); ctx.lineTo(-8, 8); ctx.stroke(); } break; }
      case 'cap': { lead(5 * k); ctx.fillStyle = '#ede6d6'; ctx.fillRect(-6 * k, -14 * k, 3, 28 * k); ctx.fillRect(3 * k, -14 * k, 3, 28 * k); ctx.rotate(-ang); ctx.fillStyle = '#9fe8ff'; ctx.font = '11px sans-serif'; ctx.fillText(fmtVal(p), 12, -14); break; }
    }
    // 电流流动：沿元件移动的小方块，速度与电流大小相关
    if (I > 0.001 && !p.ghost && p.type !== 'voltmeter') { const sp = Math.min(3, 0.4 + Math.log10(1 + I * 100)), dir = (p.I || 0) >= 0 ? 1 : -1; ctx.fillStyle = '#ffe08a'; for (let i = 0; i < 3; i++) { const u = ((t * sp + i / 3) % 1) * dir; ctx.fillRect(-L / 2 + ((u + 1) % 1) * L - 2, -2, 4, 4); } }
    if (p.fixed && !p.ghost && p.type !== 'wire') { ctx.rotate(0); }
    ctx.restore();
  }

  C.bind = function () { window.addEventListener('resize', () => CF.UI.cur === 'city' && C.resize()); };
  // 学习经验 → 学习加速（每 30 点经验 1 次）
  CF.bus.on('progress', () => {
    const d = CF.Save.data, c = data(), tot = d.xp.knowledge + d.xp.practice;
    if (c.boostBase === undefined) c.boostBase = tot;
    while (tot - c.boostBase >= 30) { c.boostBase += 30; d.boosts = (d.boosts || 0) + 1; CF.toast('⚡ 获得 1 次学习加速（电路工坊：立即领取 1 小时电网产出）', 'gold', 2600); }
    CF.Save.save();
  });
})();

</script>
<script>
/* js/shop.js */
/* 商城（v1）：用主城仓库里的晶片购买。不涉及真实货币。
 * - 英雄碎片：每天轮换 3 位还没拥有的英雄，每位每天限购 3 片（稀缺性）；主角造乐不出售。
 * - 法宝：法宝锦囊（每天 1 个）；打开锦囊、用 10 片赐福法宝碎片为英雄赐福法宝。
 * - 补给：体力药剂（每天 2 瓶）。 */
(function () {
  const CF = window.CF;
  const $ = CF.$;
  const PRICE = { frag: 150, pouch: 800, stamina: 300 };
  const LIMIT = { frag: 3, pouch: 1, stamina: 2 };
  const today = () => new Date().toISOString().slice(0, 10);
  const data = () => { const d = CF.Save.data; if (!d.shop || d.shop.date !== today()) d.shop = { date: today(), bought: {} }; return d.shop; };
  const chips = () => Math.floor(CF.City.storage().chip);
  const pay = (n) => { const st = CF.City.storage(); if (st.chip < n) { CF.Audio.sfx('error'); CF.toast(`晶片不足（需要 ${n}）——去征程或电路工坊攒一些`, 'bad'); return false; } st.chip -= n; CF.Save.save(); return true; };
  const left = (key, lim) => lim - (data().bought[key] || 0);
  const take = (key) => { const b = data().bought; b[key] = (b[key] || 0) + 1; CF.Save.save(); };
  // 今日轮换的英雄（按日期固定）
  const offers = () => {
    const pool = CF.Heroes.list.filter((h) => !h.protagonist && h.id !== CF.Roster.STARTER && !CF.Roster.ownsReal(h.id));
    const day = Math.floor(Date.now() / 864e5), out = [];
    for (let i = 0; i < Math.min(3, pool.length); i++) out.push(pool[(day * 7 + i * 3) % pool.length]);
    return [...new Set(out)];
  };
  const Shop = (CF.Shop = { PRICE, LIMIT });
  let tab = 'hero';
  Shop.render = function () {
    const body = $('#shopBody');
    body.innerHTML = `<div class="row between wrap" style="margin-bottom:10px"><div class="shop-wallet"><span class="c-chip">◆ <b class="t-num">${chips().toLocaleString()}</b> 晶片</span><span class="small muted">商城只用游戏里赚到的晶片，不需要充值</span></div><div class="tabs" id="shopTabs" style="padding:0"></div></div><div id="shopTab"></div>`;
    const tb = $('#shopTabs');
    [['hero', '英雄碎片'], ['fb', '法宝'], ['sup', '补给']].forEach(([k, n]) => { const b = CF.h(`<button class="tab ${tab === k ? 'on' : ''}">${n}</button>`); b.onclick = () => { tab = k; CF.Audio.sfx('click'); Shop.render(); }; tb.appendChild(b); });
    const host = $('#shopTab');
    if (tab === 'hero') {
      const list = offers();
      host.appendChild(CF.h(`<p class="small muted" style="margin-bottom:8px">每天轮换 3 位你还没拥有的英雄，每位每天限购 ${LIMIT.frag} 片；集齐 ${CF.Roster.FRAG_NEED} 片解锁。主角「造乐」只能通过特殊渠道获得，不在商城出售。</p>`));
      if (!list.length) host.appendChild(CF.h('<p class="small">你已经拥有全部可购买的英雄。</p>'));
      const g = CF.h('<div class="shop-grid"></div>');
      list.forEach((h) => {
        const key = 'frag_' + h.id, n = left(key, LIMIT.frag);
        const el = CF.h(`<div class="shop-item"><canvas width="144" height="112"></canvas><b>${h.name} <small>${h.title}</small></b><span class="small muted">碎片 ${CF.Roster.frags(h.id)}/${CF.Roster.FRAG_NEED} · 今日还可买 ${n} 片</span><button class="btn sm primary" ${n > 0 ? '' : 'disabled'}><span class="c-chip">◆ ${PRICE.frag}</span> 买 1 片</button></div>`);
        const x = el.querySelector('canvas').getContext('2d'); x.fillStyle = h.pal.bg[1]; x.fillRect(0, 0, 144, 112); h.draw(x, 22, 40, 4.2, { t: 0 });
        el.querySelector('button').onclick = () => { if (left(key, LIMIT.frag) <= 0 || !pay(PRICE.frag)) return; take(key); CF.Roster.addFrag(h.id, 1); CF.Audio.sfx('unlock'); CF.toast(`${h.name} 碎片 +1（${Math.min(CF.Roster.FRAG_NEED, CF.Roster.frags(h.id))}/${CF.Roster.FRAG_NEED}）`, 'gold'); Shop.render(); };
        g.appendChild(el);
      });
      host.appendChild(g);
    }
    if (tab === 'fb') {
      const C = CF.Collect, n = left('pouch', LIMIT.pouch);
      host.appendChild(CF.h(`<div class="shop-grid">
        <div class="shop-item"><div class="shop-ic">🧧</div><b>法宝锦囊</b><span class="small muted">打开有 35% 概率得到赐福法宝碎片，其余为补给。第六章也会掉落。持有 <b>${C.pouches()}</b> 个</span><div class="row" style="gap:6px"><button class="btn sm primary" id="buyPouch" ${n > 0 ? '' : 'disabled'}><span class="c-chip">◆ ${PRICE.pouch}</span> 买 1 个（今日 ${n}）</button><button class="btn sm" id="openPouch" ${C.pouches() > 0 ? '' : 'disabled'}>打开</button></div></div>
        <div class="shop-item"><div class="shop-ic">✨</div><b>赐福法宝碎片</b><span class="small muted">集齐 ${C.NEED} 片，可以为一位已拥有、还没有法宝的英雄赐福法宝。当前 <b class="t-num">${C.bless()}/${C.NEED}</b></span><div class="bless-list"></div></div>
      </div>`));
      host.querySelector('#buyPouch').onclick = () => { if (left('pouch', LIMIT.pouch) <= 0 || !pay(PRICE.pouch)) return; take('pouch'); C.addPouch(1); CF.toast('法宝锦囊 +1', 'gold'); Shop.render(); };
      host.querySelector('#openPouch').onclick = () => { const r = C.openPouch(); if (r) CF.modal.open({ title: '打开法宝锦囊', body: `<p style="text-align:center;font-size:18px;line-height:2">🎁 ${r}</p>`, foot: [{ text: '好的', cls: 'primary', onClick: () => { CF.modal.close(); Shop.render(); } }] }); };
      const bl = host.querySelector('.bless-list');
      CF.Roster.ownedList().filter((h) => !CF.Treasure.has(h.id) || CF.P.trial()).forEach((h) => { const b = CF.h(`<button class="btn sm ${C.bless() >= C.NEED ? 'violet' : 'ghost'}" ${C.bless() >= C.NEED ? '' : 'disabled'}>赐福 ${h.name}（${h.instrument}）</button>`); b.onclick = () => { if (C.redeem(h.id)) Shop.render(); }; bl.appendChild(b); });
      if (!bl.children.length) bl.appendChild(CF.h('<span class="small muted">你拥有的英雄都已经有法宝了。</span>'));
    }
    if (tab === 'sup') {
      const n = left('stamina', LIMIT.stamina);
      host.appendChild(CF.h(`<div class="shop-grid"><div class="shop-item"><div class="shop-ic">⚡</div><b>体力药剂</b><span class="small muted">立即恢复 40 点体力（可以超过上限）。更推荐的办法：去学院学习——连续学 25 分钟得 5 分钟无限体力，累计学 40 分钟得 10 分钟。</span><button class="btn sm primary" ${n > 0 ? '' : 'disabled'}><span class="c-chip">◆ ${PRICE.stamina}</span> 买 1 瓶（今日 ${n}）</button></div></div>`));
      host.querySelector('button').onclick = () => { if (left('stamina', LIMIT.stamina) <= 0 || !pay(PRICE.stamina)) return; take('stamina'); CF.Stamina.add(40); CF.toast('体力 +40', 'gold'); Shop.render(); };
    }
  };
})();

</script>
<script>
/* js/main.js */
/* 启动 */
(function () {
  const CF = window.CF;
  CF.Save.load();
  if (!CF.Heroes.list.some((h) => h.id === CF.Save.data.hero) || !CF.Roster.owns(CF.Save.data.hero)) CF.Save.data.hero = CF.Roster.STARTER;
  CF.Heroes.applyTheme();
  document.body.classList.toggle('reduce-motion', !!CF.Save.data.settings.reduceMotion);
  CF.P._unlockSnapshot = CF.P.unlockSnapshot();
  CF.P.dailyPlan();
  CF.UI.initUltrabars();
  CF.Lobby.init();
  CF.UI.initComms();
  CF.UI.initRotate();
  CF.UI.bindBattle();
  CF.Quick.bind();
  CF.City.bind();
  CF.UI.initBreak();
  CF.UI.touch = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  window.addEventListener('pointerdown', (e) => { CF.UI.touch = e.pointerType !== 'mouse'; }, true);
  // 浏览器要求用户交互后才能播放声音
  const unlock = () => { CF.Audio.unlock(); const f = document.querySelector('#scr-lobby .menu-foot'); if (f) f.remove(); };
  window.addEventListener('pointerdown', unlock, { once: true });
  window.addEventListener('keydown', unlock, { once: true });
  CF.Icons.watch(); // 全部 emoji → 像素图标（UI 宪法第 12 章）
  CF.UI.show('lobby');
  CF.P.checkAch();
  document.addEventListener('visibilitychange', () => { if (document.hidden) { CF.Save.save(); const g = CF.Game.current; if (g && !g.over) g.paused = true; } });
  window.CF_DEBUG = CF; // 方便在控制台调试
})();

</script>
